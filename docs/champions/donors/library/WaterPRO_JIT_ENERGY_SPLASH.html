* 4; P.cxy[p] = cxy * 4; P.cxz[p] = cxz * 4;\n      P.cyx[p] = cyx * 4; P.cyy[p] = cyy * 4; P.cyz[p] = cyz * 4;\n      P.czx[p] = czx * 4; P.czy[p] = czy * 4; P.czz[p] = czz * 4;\n\n      P.px[p] += P.vx[p] * dt;\n      P.py[p] += P.vy[p] * dt;\n      P.pz[p] += P.vz[p] * dt;\n      this.applyParticleWalls(P, p, dt);\n      this.finishParticle(P, p, dt, prevY, surface);\n    }\n  }\n\n  private integrateBallistic(P: MpmParticles, p: number, dt: number, prevY: number, surface?: MpmSurfaceSampler) {\n    const params = waterStore.get().mpmParams;\n    P.vy[p] += (params.gravity ?? DEFAULT_GRAVITY) * gravityWorldScale() * dt;\n    const drag = Math.exp(-Math.max(0, params.airDrag ?? 0) * dt);\n    P.vx[p] *= drag; P.vy[p] *= drag; P.vz[p] *= drag;\n    P.px[p] += P.vx[p] * dt;\n    P.py[p] += P.vy[p] * dt;\n    P.pz[p] += P.vz[p] * dt;\n    P.cxx[p] *= 0.9; P.cxy[p] *= 0.9; P.cxz[p] *= 0.9;\n    P.cyx[p] *= 0.9; P.cyy[p] *= 0.9; P.cyz[p] *= 0.9;\n    P.czx[p] *= 0.9; P.czy[p] *= 0.9; P.czz[p] *= 0.9;\n    this.applyParticleWalls(P, p, dt);\n    this.finishParticle(P, p, dt, prevY, surface);\n  }\n\n  private applyParticleWalls(P: MpmParticles, p: number, dt: number) {\n    // No side-wall/container clamp for splash particles. They can travel over\n    // the pool rim. The only hard boundary is the infinite floor below the app.\n    const predictedY = P.py[p] + P.vy[p] * dt * 2;\n    const floorY = runtimePoolFloorY();\n    if (predictedY < floorY) {\n      P.vy[p] += WALL_STIFFNESS * (floorY - predictedY) * dt;\n      P.vx[p] *= 0.86;\n      P.vz[p] *= 0.86;\n      P.py[p] = Math.max(floorY, P.py[p]);\n      P.floorAge[p] += dt;\n    } else {\n      P.floorAge[p] = 0;\n    }\n  }\n\n  private finishParticle(P: MpmParticles, p: number, dt: number, prevY: number, surface?: MpmSurfaceSampler) {\n    P.life[p] += dt;\n    if (P.flags[p] & FLAG_FOAM) {\n      // Aerated parcels shed volume (mist evaporation); spent mist is culled.\n      P.vol[p] *= Math.exp(-0.30 * dt);\n      if (P.vol[p] < MIN_PARCEL_VOL * 0.5) {\n        P.kill(p);\n        return;\n      }\n    }\n    const half = runtimePoolHalfExtents();\n    const overWater = Math.abs(P.px[p]) <= half.x && Math.abs(P.pz[p]) <= half.z;\n    const surfaceY = overWater && surface ? surface.heightAt(P.px[p], P.pz[p]) : -Infinity;\n    const wasAirborne = (P.flags[p] & FLAG_AIRBORNE) !== 0;\n\n    // A particle persists while airborne. It is killed only when it actually\n    // contacts the water surface, or after it has rested on the floor. Missing\n    // the pool no longer deletes it at the pool bounds.\n    const crossedSurface = overWater && wasAirborne && prevY > surfaceY + 0.001 && P.py[p] <= surfaceY + 0.001 && P.vy[p] <= 0.02;\n    const submergedAfterContact = overWater && wasAirborne && P.py[p] < surfaceY - 0.004;\n    if (surface && (crossedSurface || submergedAfterContact)) {\n      this.recordSettle(P, p);\n      P.kill(p);\n      return;\n    }\n\n    if (overWater && P.py[p] >= surfaceY) P.flags[p] |= FLAG_AIRBORNE;\n    else if (overWater) P.flags[p] &= ~FLAG_AIRBORNE;\n\n    // Floor-contact lifetime only. No arbitrary airborne timeout.\n    if (P.floorAge[p] > 1.35) {\n      P.kill(p);\n      return;\n    }\n\n    // Emergency kill far beyond the supported world, not normal pool-edge culling.\n    const far = Math.abs(P.px[p]) > 8.0 || Math.abs(P.pz[p]) > 8.0 || P.py[p] > MPM_DOMAIN_Y_MAX + 1.0 || P.py[p] < runtimePoolFloorY() - 0.8;\n    if (far) P.kill(p);\n  }\n\n  private recordSettle(P: MpmParticles, p: number) {\n    const impactVy = P.vy[p] < -0.01 ? P.vy[p] : -Math.max(0.04, Math.abs(P.vy[p]));\n    this.settleEvents.push({ x: P.px[p], z: P.pz[p], vy: impactVy, weight: Math.max(0.35, P.density[p] / REST_DENSITY), vol: P.vol[p] });\n  }\n\n  private surfaceYAt(x: number, z: number) {\n    return this.lastSurface ? this.lastSurface.heightAt(x, z) : SURFACE_Y;\n  }\n\n  /**\n   * Weber-style breakup volume: fast ejecta shatter into finer droplets, slow\n   * heavy sheets leave as fat parcels. Log-normal jitter matches real spray\n   * drop-size distributions; foam parcels read smaller because they are aerated.\n   */\n  private weberVol(vx: number, vy: number, vz: number, foam = false) {\n    const fine = Math.max(0.2, waterStore.get().mpmParams.sprayFineness ?? 1.0);\n    const v2 = vx * vx + vy * vy + vz * vz;\n    let r = 0.058 / ((1.0 + v2 * 0.42) * fine);\n    r *= Math.exp((this.rand() - 0.5) * 1.15);\n    if (foam) r *= 0.72;\n    r = Math.min(0.085, Math.max(0.011, r));\n    return 4.18879 * r * r * r;\n  }\n\n  /** Direct volume-carrying spawn for the heightfield energy-layer emitter. */\n  spawnParcel(x: number, y: number, z: number, vx: number, vy: number, vz: number, vol: number, foam = false) {\n    return this.particles.spawn(x, y, z, vx, vy, vz, foam, Math.max(MIN_PARCEL_VOL, vol));\n  }\n\n  spawnCrown(cx: number, cz: number, impactSpeed: number, count = 72, radius = 0.23) {\n    const params = waterStore.get().mpmParams;\n    const spatial = Math.max(0.12, params.splashSpatialScale ?? 0.58);\n    const launch = Math.max(0.08, params.launchSpeedScale ?? 0.66) * froudeSpeedScale();\n    const energy = Math.max(0.15, impactSpeed);\n    const radiusBoost = Math.min(4.0, Math.max(1.0, (radius / 0.23) * (radius / 0.23) * 0.55));\n    const particles = Math.min(220, Math.max(24, Math.floor(count * radiusBoost * Math.min(1.45, 0.5 + energy * 0.15))));\n    for (let i = 0; i < particles; i++) {\n      const a = i * GOLDEN_ANGLE + (this.rand() - 0.5) * 0.22;\n      const ring = radius * spatial * (0.62 + this.rand() * 0.48);\n      const nx = Math.cos(a), nz = Math.sin(a);\n      const sheetBias = 0.35 + 0.45 * this.rand();\n      const speed = (0.24 + energy * (0.32 + 0.32 * this.rand())) * launch;\n      const x = cx + nx * ring;\n      const z = cz + nz * ring;\n      const y = this.surfaceYAt(x, z) + 0.004 + this.rand() * 0.014;\n      const vx = nx * speed * (0.72 + sheetBias) + (this.rand() - 0.5) * 0.11 * launch;\n      const vz = nz * speed * (0.72 + sheetBias) + (this.rand() - 0.5) * 0.11 * launch;\n      const vy = (0.34 + energy * (0.38 + 0.28 * this.rand())) * launch;\n      const foam = this.rand() < 0.42;\n      this.particles.spawn(x, y, z, vx, vy, vz, foam, this.weberVol(vx, vy, vz, foam));\n    }\n  }\n\n  spawnSheet(cx: number, cz: number, yStart: number, upSpeed: number, count = 54) {\n    const params = waterStore.get().mpmParams;\n    const spatial = Math.max(0.12, params.splashSpatialScale ?? 0.58);\n    const launch = Math.max(0.08, params.launchSpeedScale ?? 0.66) * froudeSpeedScale();\n    const energy = Math.max(0.1, upSpeed);\n    const particles = Math.min(160, Math.max(20, Math.floor(count * Math.min(1.3, 0.68 + energy * 0.12))));\n    for (let i = 0; i < particles; i++) {\n      const a = i * GOLDEN_ANGLE + this.rand() * 0.35;\n      const r = (0.025 + this.rand() * 0.12) * spatial;\n      const nx = Math.cos(a), nz = Math.sin(a);\n      const vx = (nx * (0.24 + this.rand() * 0.48) + (this.rand() - 0.5) * 0.10) * launch;\n      const vz = (nz * (0.24 + this.rand() * 0.48) + (this.rand() - 0.5) * 0.10) * launch;\n      const vy = (energy * (0.48 + this.rand() * 0.46) + 0.22) * launch;\n      const foam = this.rand() < 0.55;\n      this.particles.spawn(cx + nx * r, yStart + this.rand() * 0.05, cz + nz * r, vx, vy, vz, foam, this.weberVol(vx, vy, vz, foam));\n    }\n  }\n\n  spawnImpact(cx: number, cz: number, energy = 1.0, count = 28) {\n    const params = waterStore.get().mpmParams;\n    const spatial = Math.max(0.12, params.splashSpatialScale ?? 0.58);\n    const launch = Math.max(0.08, params.launchSpeedScale ?? 0.66) * froudeSpeedScale();\n    const particles = Math.min(80, Math.max(10, Math.floor(count * Math.min(1.5, 0.72 + energy * 0.28))));\n    for (let i = 0; i < particles; i++) {\n      const a = i * GOLDEN_ANGLE + this.rand() * 0.5;\n      const r = this.rand() * 0.04 * spatial;\n      const nx = Math.cos(a), nz = Math.sin(a);\n      const speed = (0.42 + this.rand() * 0.92) * energy * launch;\n      const tilt = 0.42 + this.rand() * 0.45;\n      const sx = cx + nx * r;\n      const sz = cz + nz * r;\n      const svx = nx * speed * tilt;\n      const svy = 0.32 + speed * (0.58 - tilt * 0.18);\n      const svz = nz * speed * tilt;\n      const foam = this.rand() < 0.38;\n      this.particles.spawn(\n        sx,\n        this.surfaceYAt(sx, sz) + 0.004 + this.rand() * 0.014,\n        sz,\n        svx,\n        svy,\n        svz,\n        foam,\n        this.weberVol(svx, svy, svz, foam),\n      );\n    }\n  }\n\n  spawnSphereBreach(cx: number, cy: number, cz: number, radius: number, vx: number, vy: number, vz: number, intensity = 1.0) {\n    const horizontalSpeed = Math.sqrt(vx * vx + vz * vz);\n    const verticalEnergy = Math.abs(vy);\n    if (Math.abs(cy) > radius * 1.05 || horizontalSpeed + verticalEnergy < 0.12) return;\n\n    const ringRadius = Math.sqrt(Math.max(0.0025, radius * radius - cy * cy));\n    const hx = horizontalSpeed > 1e-4 ? vx / horizontalSpeed : 0;\n    const hz = horizontalSpeed > 1e-4 ? vz / horizontalSpeed : 1;\n    const radiusScale = Math.min(4.5, Math.max(1.0, (radius / 0.25) * (radius / 0.25) * 0.55));\n    const count = Math.min(180, Math.max(12, Math.floor((12 + horizontalSpeed * 12 + verticalEnergy * 8) * intensity * radiusScale))); \n    for (let i = 0; i < count; i++) {\n      const a = i * GOLDEN_ANGLE + this.rand() * 0.4;\n      const nx = Math.cos(a), nz = Math.sin(a);\n      const front = Math.max(0, nx * hx + nz * hz);\n      const side = 0.35 + 0.65 * front;\n      const x = cx + nx * ringRadius * (0.86 + this.rand() * 0.22);\n      const z = cz + nz * ringRadius * (0.86 + this.rand() * 0.22);\n      const params = waterStore.get().mpmParams;\n      const launch = Math.max(0.08, params.launchSpeedScale ?? 0.66) * froudeSpeedScale();\n      const skim = (0.18 + horizontalSpeed * (0.20 + 0.26 * front)) * launch;\n      const lift = (0.18 + verticalEnergy * 0.16 + horizontalSpeed * 0.10 * side) * launch;\n      const bvx = nx * skim * side + vx * 0.10 * launch + (this.rand() - 0.5) * 0.05 * launch;\n      const bvy = lift + this.rand() * 0.14 * launch;\n      const bvz = nz * skim * side + vz * 0.10 * launch + (this.rand() - 0.5) * 0.05 * launch;\n      const foam = this.rand() < 0.68;\n      this.particles.spawn(\n        x,\n        this.surfaceYAt(x, z) + 0.004 + this.rand() * 0.025,\n        z,\n        bvx,\n        bvy,\n        bvz,\n        foam,\n        this.weberVol(bvx, bvy, bvz, foam),\n      );\n    }\n  }\n}\n\nexport function vec3ToProbe(pos: THREE.Vector3, vel: THREE.Vector3, radius: number): SphereProbe {\n  return {\n    cx: pos.x, cy: pos.y, cz: pos.z,\n    vx: vel.x, vy: vel.y, vz: vel.z,\n    radius,\n    fx: 0, fy: 0, fz: 0,\n  };\n}\n","/src/lib/mpmConnectivity.ts":"import type { MpmParams } from './waterStore';\n\nexport interface MpmConnection {\n  a: number;\n  b: number;\n  age: number;\n  strength: number;\n  distance: number;\n}\n\n/**\n * A tendril that snapped while stretched. The renderer turns these into\n * Rayleigh-Plateau satellite droplets: the pinched bridge volume detaches as\n * one or two tiny parcels instead of silently vanishing.\n */\nexport interface MpmBreakEvent {\n  a: number;\n  b: number;\n  distance: number;\n  strength: number;\n}\n\nconst keyFor = (a: number, b: number) => (a < b ? `${a}:${b}` : `${b}:${a}`);\nconst MAX_BREAK_EVENTS = 48;\n\nexport class MpmConnectivityGraph {\n  readonly connections = new Map<string, MpmConnection>();\n  readonly breakEvents: MpmBreakEvent[] = [];\n  private readonly active = new Set<number>();\n  private readonly buckets = new Map<string, number[]>();\n\n  update(\n    ids: Int32Array,\n    count: number,\n    px: Float32Array,\n    py: Float32Array,\n    pz: Float32Array,\n    params: MpmParams,\n    dt: number,\n  ) {\n    const formRadius = Math.max(0.025, params.formRadius);\n    const breakRadius = Math.max(formRadius + 0.005, params.breakRadius);\n    const cellSize = formRadius;\n    const maxConnections = 1800;\n\n    this.active.clear();\n    this.buckets.clear();\n    this.breakEvents.length = 0;\n\n    for (let i = 0; i < count; i++) {\n      const id = ids[i];\n      this.active.add(id);\n      const key = `${Math.floor(px[id] / cellSize)},${Math.floor(py[id] / cellSize)},${Math.floor(pz[id] / cellSize)}`;\n      const bucket = this.buckets.get(key);\n      if (bucket) bucket.push(id);\n      else this.buckets.set(key, [id]);\n    }\n\n    for (const [key, c] of this.connections) {\n      if (!this.active.has(c.a) || !this.active.has(c.b)) {\n        this.connections.delete(key);\n        continue;\n      }\n      const dx = px[c.a] - px[c.b];\n      const dy = py[c.a] - py[c.b];\n      const dz = pz[c.a] - pz[c.b];\n      const d = Math.hypot(dx, dy, dz);\n      c.distance = d;\n      c.age += dt;\n      if (d > breakRadius * (1 + params.connectionMemory) || c.strength < 0.025) {\n        // Only a genuinely stretched filament pinches off satellites; connections\n        // that die short (merge/absorb) break silently.\n        if (d > formRadius * 1.6 && this.breakEvents.length < MAX_BREAK_EVENTS) {\n          this.breakEvents.push({ a: c.a, b: c.b, distance: d, strength: c.strength });\n        }\n        this.connections.delete(key);\n        continue;\n      }\n      const stretch = Math.max(0, (d - formRadius) / Math.max(1e-5, breakRadius - formRadius));\n      const target = Math.pow(Math.max(0, 1 - stretch), 0.65);\n      const rate = d > breakRadius ? 2.4 / Math.max(0.08, params.connectionMemory) : 14;\n      c.strength += (target - c.strength) * Math.min(1, dt * rate);\n    }\n\n    if (this.connections.size >= maxConnections) return;\n\n    for (let i = 0; i < count && this.connections.size < maxConnections; i++) {\n      const a = ids[i];\n      const hx = Math.floor(px[a] / cellSize);\n      const hy = Math.floor(py[a] / cellSize);\n      const hz = Math.floor(pz[a] / cellSize);\n\n      for (let ox = -1; ox <= 1 && this.connections.size < maxConnections; ox++) {\n        for (let oy = -1; oy <= 1 && this.connections.size < maxConnections; oy++) {\n          for (let oz = -1; oz <= 1 && this.connections.size < maxConnections; oz++) {\n            const bucket = this.buckets.get(`${hx + ox},${hy + oy},${hz + oz}`);\n            if (!bucket) continue;\n            for (let k = 0; k < bucket.length && this.connections.size < maxConnections; k++) {\n              const b = bucket[k];\n              if (b <= a) continue;\n              const key = keyFor(a, b);\n              if (this.connections.has(key)) continue;\n              const dx = px[a] - px[b];\n              const dy = py[a] - py[b];\n              const dz = pz[a] - pz[b];\n              const d = Math.hypot(dx, dy, dz);\n              if (d > formRadius) continue;\n              this.connections.set(key, { a, b, age: 0, strength: 1, distance: d });\n            }\n          }\n        }\n      }\n    }\n  }\n\n  clear() {\n    this.connections.clear();\n    this.breakEvents.length = 0;\n    this.active.clear();\n    this.buckets.clear();\n  }\n}\n","/src/lib/proceduralAssets.ts":"import * as THREE from 'three';\n\n/**\n * Generates a procedural HDR-style sky cubemap using a fragment shader.\n * Returns a CubeTexture containing 6 RGBA8 faces rendered with a smooth\n * horizon \u2192 zenith gradient and a soft sun disk in the +X +Y direction.\n */\nexport function generateProceduralSky(\n  renderer: THREE.WebGLRenderer,\n  size = 512,\n): THREE.CubeTexture {\n  const cubeRT = new THREE.WebGLCubeRenderTarget(size, {\n    format: THREE.RGBAFormat,\n    type: THREE.UnsignedByteType,\n    generateMipmaps: false,\n    minFilter: THREE.LinearFilter,\n    magFilter: THREE.LinearFilter,\n  });\n\n  const skyMaterial = new THREE.ShaderMaterial({\n    side: THREE.BackSide,\n    uniforms: {\n      sunDir: { value: new THREE.Vector3(2, 2, -1).normalize() },\n    },\n    vertexShader: /* glsl */ `\n      varying vec3 vDir;\n      void main() {\n        vDir = position;\n        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n      }\n    `,\n    fragmentShader: /* glsl */ `\n      precision highp float;\n      varying vec3 vDir;\n      uniform vec3 sunDir;\n      void main() {\n        vec3 d = normalize(vDir);\n        float t = smoothstep(-0.05, 0.7, d.y);\n        vec3 horizon = vec3(0.62, 0.78, 0.85);\n        vec3 zenith = vec3(0.11, 0.23, 0.34);\n        vec3 ground = vec3(0.04, 0.08, 0.12);\n        vec3 sky = mix(horizon, zenith, t);\n        float g = smoothstep(0.05, -0.4, d.y);\n        sky = mix(sky, ground, g);\n        float haze = exp(-pow(abs(d.y) * 4.0, 2.0)) * 0.25;\n        sky += vec3(haze * 0.9, haze * 0.7, haze * 0.5);\n        float sunDot = max(0.0, dot(d, normalize(sunDir)));\n        sky += vec3(1.0, 0.96, 0.78) * (smoothstep(0.998, 1.0, sunDot) * 8.0\n          + pow(sunDot, 256.0) * 0.6 + pow(sunDot, 16.0) * 0.15);\n        gl_FragColor = vec4(sky, 1.0);\n      }\n    `,\n  });\n\n  const cubeCamera = new THREE.CubeCamera(0.1, 100, cubeRT);\n  const skyScene = new THREE.Scene();\n  const sphere = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 32), skyMaterial);\n  skyScene.add(sphere);\n\n  const prevTarget = renderer.getRenderTarget();\n  cubeCamera.update(renderer, skyScene);\n  renderer.setRenderTarget(prevTarget);\n\n  sphere.geometry.dispose();\n  skyMaterial.dispose();\n\n  cubeRT.texture.colorSpace = THREE.SRGBColorSpace;\n  return cubeRT.texture as THREE.CubeTexture;\n}\n\n/**\n * Generates a procedural pool-tile texture (light blue ceramic with grout)\n * with subtle grain. Returns a CanvasTexture set up for repeat wrapping.\n */\nexport function generateTilesTexture(size = 512): THREE.CanvasTexture {\n  const canvas = document.createElement('canvas');\n  canvas.width = size;\n  canvas.height = size;\n  const ctx = canvas.getContext('2d')!;\n\n  // Base grout\n  ctx.fillStyle = '#0a1a22';\n  ctx.fillRect(0, 0, size, size);\n\n  // Tiles\n  const tilesPerSide = 8;\n  const tileSize = size / tilesPerSide;\n  const gap = 4;\n\n  for (let y = 0; y < tilesPerSide; y++) {\n    for (let x = 0; x < tilesPerSide; x++) {\n      const px = x * tileSize + gap / 2;\n      const py = y * tileSize + gap / 2;\n      const w = tileSize - gap;\n      const h = tileSize - gap;\n\n      // Per-tile color variation\n      const hue = 195 + (Math.random() - 0.5) * 14;\n      const sat = 35 + Math.random() * 20;\n      const lum = 38 + Math.random() * 16;\n      ctx.fillStyle = `hsl(${hue}, ${sat}%, ${lum}%)`;\n      ctx.fillRect(px, py, w, h);\n\n      // Subtle gradient highlight\n      const grad = ctx.createLinearGradient(px, py, px + w, py + h);\n      grad.addColorStop(0, 'rgba(255,255,255,0.08)');\n      grad.addColorStop(0.5, 'rgba(255,255,255,0)');\n      grad.addColorStop(1, 'rgba(0,0,0,0.12)');\n      ctx.fillStyle = grad;\n      ctx.fillRect(px, py, w, h);\n\n      // Speckle noise\n      const speckles = 30;\n      for (let i = 0; i < speckles; i++) {\n        const sx = px + Math.random() * w;\n        const sy = py + Math.random() * h;\n        const a = Math.random() * 0.06;\n        ctx.fillStyle = `rgba(255,255,255,${a})`;\n        ctx.fillRect(sx, sy, 1, 1);\n      }\n    }\n  }\n\n  // Overall grain\n  const imageData = ctx.getImageData(0, 0, size, size);\n  const d = imageData.data;\n  for (let i = 0; i < d.length; i += 4) {\n    const n = (Math.random() - 0.5) * 8;\n    d[i] = Math.max(0, Math.min(255, d[i] + n));\n    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));\n    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));\n  }\n  ctx.putImageData(imageData, 0, 0);\n\n  const tex = new THREE.CanvasTexture(canvas);\n  tex.wrapS = THREE.RepeatWrapping;\n  tex.wrapT = THREE.RepeatWrapping;\n  tex.colorSpace = THREE.SRGBColorSpace;\n  tex.anisotropy = 16;\n  tex.minFilter = THREE.LinearMipmapLinearFilter;\n  tex.magFilter = THREE.LinearFilter;\n  tex.generateMipmaps = true;\n  return tex;\n}\n","/src/lib/utils.ts":"import { clsx, type ClassValue } from \"clsx\";\nimport { twMerge } from \"tailwind-merge\";\n\nexport function cn(...inputs: ClassValue[]) {\n  return twMerge(clsx(inputs));\n}\n","/src/lib/waterStore.ts":"import { useSyncExternalStore } from 'react';\n\n\nexport type HeightfieldOverlayMode =\n  | 'height'\n  | 'velocity'\n  | 'sigma'\n  | 'sigmaDot'\n  | 'contact'\n  | 'pressure'\n  | 'risk'\n  | 'elongation'\n  | 'bodyFlux'\n  | 'wakeCurl'\n  | 'particles'\n  | 'absorb'\n  | 'failVol'\n  | 'jitVol'\n  | 'eject';\n\nexport interface HeightfieldGuidanceStats {\n  localRisk: number;\n  localContact: number;\n  localPressure: number;\n  localElongation: number;\n  localBodyFlux: number;\n  localWakeCurl: number;\n  maxRisk: number;\n  maxContact: number;\n  maxPressure: number;\n  maxElongation: number;\n  maxAbsorb: number;\n  candidateArea: number;\n  releaseGate: number;\n  particleDensity: number;\n  /** Peak JIT reservoir volume (m^3-ish parcel units) available for field emission. */\n  maxJitVol: number;\n  /** Field-emitted particles in the last frame. */\n  jitEmitted: number;\n  frame: number;\n}\n\nexport interface HeightfieldMapSnapshot {\n  size: number;\n  mode: HeightfieldOverlayMode;\n  fields: Partial<Record<HeightfieldOverlayMode, Float32Array>>;\n  stats: HeightfieldGuidanceStats;\n  poolHalfSize: [number, number];\n  updatedAt: number;\n}\n\ntype Listener = () => void;\n\nexport interface WaterState {\n  fps: number;\n  rippleCount: number;\n  spherePos: [number, number, number];\n  lightAngle: number; // degrees, 0-360 around Y\n  lightElevation: number; // degrees, 0-90\n  intensity: number; // 0-1\n  paused: boolean;\n  // Splash physics telemetry\n  particleCount: number;\n  splashEvents: number;\n  // Splash intensity multiplier (0\u20132)\n  splashIntensity: number;\n  // Splash time-speed multiplier (0.1\u20133)\n  splashSpeed: number;\n  // Scales pool, sphere, water and camera relative to the fixed valid metaball droplet kernel.\n  worldScale: number;\n  // Legacy square pool half-extent. Kept for older modules; new code uses poolWidth/poolDepth.\n  poolScale: number;\n  // Pool X half-extent in world meters. Expands by adding area, not scaling detail.\n  poolWidth: number;\n  // Pool Z half-extent / plan-depth in world meters. Expands by adding area, not scaling detail.\n  poolDepth: number;\n  // Vertical water depth from surface y=0 down to pool floor.\n  poolWaterDepth: number;\n  // Universal multiplier for radial heightfield wave/drop radii.\n  waveScale: number;\n  // Master caustics switch; false disables caustic generation and shader contribution.\n  causticsEnabled: boolean;\n  // Sphere radius in unit-pool space (0.05\u20130.6)\n  sphereRadius: number;\n  /** Advanced Phase8-style 2D heightfield overlay selected in UI. */\n  heightfieldOverlayMode: HeightfieldOverlayMode;\n  /** Enables use of heightfield diagnostic fields as MPM release sensors. */\n  heightfieldGuidanceEnabled: boolean;\n  /** Multiplier turning risk/contact/pressure fields into MPM release intensity. */\n  guidanceReleaseGain: number;\n  /** Risk threshold before diagnostics strongly increase MPM release. */\n  guidanceRiskThreshold: number;\n  /** Pressure contribution to release gate. */\n  guidancePressureGain: number;\n  /** Elongation/ribbon-memory contribution to release gate. */\n  guidanceElongationGain: number;\n  /** Latest downsampled Phase8-style field map for inspector visualization. */\n  heightfieldMap?: HeightfieldMapSnapshot;\n  /** Latest numeric field telemetry used by the release system. */\n  heightfieldGuidance: HeightfieldGuidanceStats;\n  mpmParams: MpmParams;\n}\n\nexport interface MpmParams {\n  /**\n   * Global droplet radius multiplier. Rendered droplet size is now derived per\n   * particle from its carried fluid volume (Weber-scaled at spawn); this scales\n   * that physical radius. Values below 1 are safe: the tight-fit JIT marching\n   * volume clamps features at the voxel floor instead of collapsing to diamonds.\n   */\n  particleSize: number;\n  /** Weber breakup coefficient: >1 shatters ejecta into finer spray, <1 keeps fat parcels. */\n  sprayFineness: number;\n  /** Continuous emission gain from heightfield energy reservoirs (aqua phase 7 JIT path). */\n  jitSpawnGain: number;\n  /** Risk->failed-volume conversion gain feeding the JIT reservoirs. */\n  jitRiskGain: number;\n  metaballIsolation: number;\n  /** World-space multiplier for splash crown/sheet birth radius, independent of pool scaling. */\n  splashSpatialScale: number;\n  /** Multiplier for initial MPM launch velocities; separates birth energy from visual droplet size. */\n  launchSpeedScale: number;\n  /** Solver gravity in world units / s^2. Negative pulls droplets down. */\n  gravity: number;\n  /** Light velocity damping for airborne/out-of-grid particles. */\n  airDrag: number;\n  /** World-space velocity clamp for MPM grid and particles. */\n  maxVelocity: number;\n  formRadius: number;\n  breakRadius: number;\n  connectionMemory: number;\n  tendrilSamples: number;\n  tendrilThinPower: number;\n  /** Legacy/global settle ripple gain. Retained for source compatibility. */\n  splashBackGain: number;\n  /** MPM particle impact -> heightfield wave gain when droplets re-enter/settle. */\n  settleRippleGain: number;\n  /** Radius of droplet-settle ripples in world meters. */\n  settleRippleRadius: number;\n  /** Absolute clamp for settle ripple strength. */\n  settleRippleClamp: number;\n  /** Active airborne MPM surface -> heightfield lift gain. Defaults to 0; contact absorption is event-driven. */\n  particleRippleGain: number;\n  /** Radius of active particle-to-heightfield wave stamps. */\n  particleRippleRadius: number;\n  /** Absolute clamp for active particle wave stamps. */\n  particleRippleClamp: number;\n  /** Maximum active particle stamps per frame. */\n  particleMaxStamps: number;\n  /** Height blend when MPM splash volume pulls the heightfield upward. */\n  particleHeightBlend: number;\n  /** Heightfield surface elevation -> MPM grid vertical velocity gain. */\n  surfaceLiftGain: number;\n  /** Width of the MPM/free-surface coupling band in MPM grid cells. */\n  surfaceBandCells: number;\n  /** Direct wave gain for generic impacts/clicks/storm splashes. */\n  impactWaveGain: number;\n  /** Direct wave radius for generic impacts/clicks/storm splashes. */\n  impactWaveRadius: number;\n  /** Downward sphere breach -> heightfield wave gain. */\n  entryWaveGain: number;\n  /** Downward sphere breach radius in world meters. */\n  entryWaveRadius: number;\n  /** Upward sphere exit -> negative suction wave gain. */\n  exitSuctionGain: number;\n  /** Upward sphere exit suction radius in world meters. */\n  exitSuctionRadius: number;\n  /** Submerged sphere wake -> continuous heightfield ripple gain. */\n  wakeRippleGain: number;\n  /** Velocity threshold before continuous wake ripples start. */\n  wakeThreshold: number;\n  /** Radius for continuous submerged wake ripples. */\n  wakeRippleRadius: number;\n  /** Multiplier for MPM foam/sheet generation while objects move through water. */\n  wakeFoamGain: number;\n  spawnThreshold: number;\n  spawnCountMultiplier: number;\n  lifetimeMultiplier: number;\n  reflectionStrength: number;\n  refractionStrength: number;\n  colorMix: number;\n}\n\nexport const defaultMpmParams: MpmParams = {\n  particleSize: 1.0,\n  sprayFineness: 1.0,\n  jitSpawnGain: 1.0,\n  jitRiskGain: 1.05,\n  metaballIsolation: 96,\n  splashSpatialScale: 1.0,\n  launchSpeedScale: 1.0,\n  gravity: -4.2,\n  airDrag: 0.015,\n  maxVelocity: 12.0,\n  formRadius: 0.08,\n  breakRadius: 0.19,\n  connectionMemory: 0.28,\n  tendrilSamples: 4,\n  tendrilThinPower: 1.6,\n  splashBackGain: 1.0,\n  settleRippleGain: 1.0,\n  settleRippleRadius: 0.042,\n  settleRippleClamp: 0.075,\n  particleRippleGain: 0.0,\n  particleRippleRadius: 0.026,\n  particleRippleClamp: 0.018,\n  particleMaxStamps: 24,\n  particleHeightBlend: 0.0,\n  surfaceLiftGain: 0.03,\n  surfaceBandCells: 3.0,\n  impactWaveGain: 1.0,\n  impactWaveRadius: 0.04,\n  entryWaveGain: 1.0,\n  entryWaveRadius: 0.075,\n  exitSuctionGain: 1.0,\n  exitSuctionRadius: 0.055,\n  wakeRippleGain: 0.35,\n  wakeThreshold: 0.75,\n  wakeRippleRadius: 0.032,\n  wakeFoamGain: 1.0,\n  spawnThreshold: 0.12,\n  spawnCountMultiplier: 1.0,\n  lifetimeMultiplier: 1.0,\n  reflectionStrength: 1.0,\n  refractionStrength: 1.0,\n  colorMix: 1.0,\n};\n\nconst defaultHeightfieldGuidance: HeightfieldGuidanceStats = {\n  localRisk: 0,\n  localContact: 0,\n  localPressure: 0,\n  localElongation: 0,\n  localBodyFlux: 0,\n  localWakeCurl: 0,\n  maxRisk: 0,\n  maxContact: 0,\n  maxPressure: 0,\n  maxElongation: 0,\n  maxAbsorb: 0,\n  candidateArea: 0,\n  releaseGate: 1,\n  particleDensity: 0,\n  maxJitVol: 0,\n  jitEmitted: 0,\n  frame: 0,\n};\n\nconst state: WaterState = {\n  fps: 0,\n  rippleCount: 0,\n  spherePos: [-0.4, -0.75, 0.2],\n  lightAngle: 45,\n  lightElevation: 50,\n  intensity: 0.6,\n  paused: false,\n  particleCount: 0,\n  splashEvents: 0,\n  splashIntensity: 1.0,\n  splashSpeed: 1.0,\n  worldScale: 2.6,\n  poolScale: 1.0,\n  poolWidth: 1.0,\n  poolDepth: 1.0,\n  poolWaterDepth: 1.0,\n  waveScale: 1.0,\n  causticsEnabled: true,\n  sphereRadius: 0.25,\n  heightfieldOverlayMode: 'risk',\n  heightfieldGuidanceEnabled: true,\n  guidanceReleaseGain: 1.0,\n  guidanceRiskThreshold: 0.34,\n  guidancePressureGain: 0.75,\n  guidanceElongationGain: 0.45,\n  heightfieldGuidance: defaultHeightfieldGuidance,\n  mpmParams: defaultMpmParams,\n};\n\nconst listeners = new Set<Listener>();\n\nexport const waterStore = {\n  get: () => state,\n  set: (patch: Partial<WaterState>) => {\n    Object.assign(state, patch);\n    listeners.forEach((l) => l());\n  },\n  subscribe: (l: Listener) => {\n    listeners.add(l);\n    return () => { listeners.delete(l); };\n  },\n};\n\n// Command bus for one-shot actions\nexport type Command = 'reset' | 'storm' | 'single-drop' | 'splash';\nconst commandListeners = new Set<(cmd: Command) => void>();\nexport const waterCommands = {\n  emit: (cmd: Command) => commandListeners.forEach((l) => l(cmd)),\n  on: (l: (cmd: Command) => void) => {\n    commandListeners.add(l);\n    return () => { commandListeners.delete(l); };\n  },\n};\n\nexport function useWaterStore<T>(selector: (s: WaterState) => T): T {\n  return useSyncExternalStore(\n    waterStore.subscribe,\n    () => selector(state),\n    () => selector(state),\n  );\n}\n","/src/pages/Index.tsx":"import { Canvas } from '@react-three/fiber';\nimport { OrbitControls } from '@react-three/drei';\nimport { WaterScene } from '../components/WaterScene';\nimport { WaterUI } from '../components/WaterUI';\n\nconst Index = () => {\n  return (\n    <main className=\"relative h-screen w-screen overflow-hidden bg-ink\">\n      <Canvas\n        camera={{ position: [0.35, 1.15, 2.45], fov: 45, near: 0.01, far: 100 }}\n        gl={{ antialias: true, alpha: false, powerPreference: 'high-performance' }}\n        dpr={[1, 2]}\n        className=\"absolute inset-0 h-full w-full\"\n      >\n        <WaterScene />\n        <OrbitControls\n          target={[0, -0.12, 0]}\n          enableDamping\n          dampingFactor={0.08}\n          rotateSpeed={0.55}\n          zoomSpeed={0.65}\n          panSpeed={0.35}\n          minDistance={1.25}\n          maxDistance={14}\n          mouseButtons={{\n            LEFT: undefined,\n            MIDDLE: undefined,\n            RIGHT: 0,\n          }}\n        />\n      </Canvas>\n      <WaterUI />\n    </main>\n  );\n};\n\nexport default Index;\n","/src/shaders/waterShaders.ts":"/**\n * WebGL Water \u2014 modernized shader port of Evan Wallace's classic.\n * Source: https://github.com/evanw/webgl-water (MIT, 2011)\n *\n * Coordinate system:\n *   - Pool spans X,Z \u2208 [-1, 1], floor at Y = -1, water surface at Y = 0.\n *   - Plane geometry (used by water surface + caustics) lives on XY in three.js;\n *     the vertex shader swizzles `position.xzy` to map it onto the XZ plane\n *     exactly as the original `gl_Vertex.xzy`.\n *   - The pool cube uses a custom open-top BoxGeometry with Y remapped via\n *     ((1 - y) * 7/12 - 1) so that walls span Y \u2208 [-1, -5/12] and the\n *     visible waterline (modeled by the 2/12 threshold) is preserved.\n *\n * Texture format: RGBA float\n *   r = surface height, g = vertical velocity, b = normal.x, a = normal.z\n */\n\n// \u2500\u2500\u2500 SIMULATION PASSES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexport const simulationVertexShader = /* glsl */ `\n  varying vec2 vCoord;\n  void main() {\n    vCoord = position.xy * 0.5 + 0.5;\n    gl_Position = vec4(position.xy, 0.0, 1.0);\n  }\n`;\n\nexport const dropFragmentShader = /* glsl */ `\n  precision highp float;\n  uniform sampler2D tSim;\n  uniform vec2 center;     // in [-1, 1]\n  uniform float radius;     // world-space radius in meters\n  uniform float strength;\n  uniform vec2 poolHalfSize;\n  varying vec2 vCoord;\n\n  const float PI = 3.141592653589793;\n\n  void main() {\n    vec4 info = texture2D(tSim, vCoord);\n    vec2 centerUv = center * 0.5 + 0.5;\n    vec2 worldDelta = (centerUv - vCoord) * poolHalfSize * 2.0;\n    float drop = max(0.0, 1.0 - length(worldDelta) / max(radius, 0.0001));\n    drop = 0.5 - cos(drop * PI) * 0.5;\n    info.r += drop * strength;\n    gl_FragColor = info;\n  }\n`;\n\nexport const updateFragmentShader = /* glsl */ `\n  precision highp float;\n  uniform sampler2D tSim;\n  uniform vec2 delta;\n  varying vec2 vCoord;\n\n  void main() {\n    vec4 info = texture2D(tSim, vCoord);\n\n    vec2 dx = vec2(delta.x, 0.0);\n    vec2 dy = vec2(0.0, delta.y);\n\n    float average = (\n      texture2D(tSim, vCoord - dx).r +\n      texture2D(tSim, vCoord - dy).r +\n      texture2D(tSim, vCoord + dx).r +\n      texture2D(tSim, vCoord + dy).r\n    ) * 0.25;\n\n    info.g += (average - info.r) * 2.0;\n    info.g *= 0.995;\n    info.r += info.g;\n\n    gl_FragColor = info;\n  }\n`;\n\nexport const normalFragmentShader = /* glsl */ `\n  precision highp float;\n  uniform sampler2D tSim;\n  uniform vec2 delta;\n  varying vec2 vCoord;\n\n  void main() {\n    vec4 info = texture2D(tSim, vCoord);\n    vec3 dx = vec3(delta.x, texture2D(tSim, vec2(vCoord.x + delta.x, vCoord.y)).r - info.r, 0.0);\n    vec3 dy = vec3(0.0, texture2D(tSim, vec2(vCoord.x, vCoord.y + delta.y)).r - info.r, delta.y);\n    info.ba = normalize(cross(dy, dx)).xz;\n    gl_FragColor = info;\n  }\n`;\n\nexport const sphereDisplacementFragmentShader = /* glsl */ `\n  precision highp float;\n  uniform sampler2D tSim;\n  uniform vec3 oldCenter;\n  uniform vec3 newCenter;\n  uniform float radius;\n  uniform vec2 poolHalfSize;\n  varying vec2 vCoord;\n\n  float volumeInSphere(vec3 center) {\n    vec3 worldPoint = vec3((vCoord.x * 2.0 - 1.0) * poolHalfSize.x, 0.0, (vCoord.y * 2.0 - 1.0) * poolHalfSize.y);\n    vec3 toCenter = worldPoint - center;\n    float t = length(toCenter) / radius;\n    float dy = exp(-pow(t * 1.5, 6.0));\n    float ymin = min(0.0, center.y - dy);\n    float ymax = min(max(0.0, center.y + dy), ymin + 2.0 * dy);\n    return (ymax - ymin) * 0.1;\n  }\n\n  void main() {\n    vec4 info = texture2D(tSim, vCoord);\n    info.r += volumeInSphere(oldCenter);\n    info.r -= volumeInSphere(newCenter);\n    gl_FragColor = info;\n  }\n`;\n\n// \u2500\u2500\u2500 SHARED HELPERS FOR RENDER PASSES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nconst helpers = /* glsl */ `\n  const float IOR_AIR = 1.0;\n  const float IOR_WATER = 1.333;\n  const vec3 abovewaterColor = vec3(0.25, 1.0, 1.25);\n  const vec3 underwaterColor = vec3(0.4, 0.9, 1.0);\n  uniform float poolDepthY;\n  uniform float causticsEnabled;\n\n  uniform vec3 light;\n  uniform vec3 sphereCenter;\n  uniform float sphereRadius;\n  uniform vec2 poolHalfSize;\n  uniform sampler2D tiles;\n  uniform sampler2D causticTex;\n  uniform sampler2D water;\n\n  vec2 poolUv(vec2 xz) {\n    return xz / max(poolHalfSize * 2.0, vec2(0.001)) + 0.5;\n  }\n\n  vec3 poolMin() { return vec3(-poolHalfSize.x, -poolDepthY, -poolHalfSize.y); }\n  vec3 poolMax() { return vec3( poolHalfSize.x,  2.0,       poolHalfSize.y); }\n\n  vec2 intersectCube(vec3 origin, vec3 ray, vec3 cubeMin, vec3 cubeMax) {\n    vec3 tMin = (cubeMin - origin) / ray;\n    vec3 tMax = (cubeMax - origin) / ray;\n    vec3 t1 = min(tMin, tMax);\n    vec3 t2 = max(tMin, tMax);\n    float tNear = max(max(t1.x, t1.y), t1.z);\n    float tFar  = min(min(t2.x, t2.y), t2.z);\n    return vec2(tNear, tFar);\n  }\n\n  float intersectSphere(vec3 origin, vec3 ray, vec3 sc, float sr) {\n    vec3 toSphere = origin - sc;\n    float a = dot(ray, ray);\n    float b = 2.0 * dot(toSphere, ray);\n    float c = dot(toSphere, toSphere) - sr * sr;\n    float disc = b*b - 4.0*a*c;\n    if (disc > 0.0) {\n      float t = (-b - sqrt(disc)) / (2.0 * a);\n      if (t > 0.0) return t;\n    }\n    return 1.0e6;\n  }\n\n  vec3 getSphereColor(vec3 point) {\n    vec3 color = vec3(0.5);\n\n    // Ambient occlusion against walls + floor\n    color *= 1.0 - 0.9 / pow((poolHalfSize.x + sphereRadius - abs(point.x)) / sphereRadius, 3.0);\n    color *= 1.0 - 0.9 / pow((poolHalfSize.y + sphereRadius - abs(point.z)) / sphereRadius, 3.0);\n    color *= 1.0 - 0.9 / pow((point.y + poolDepthY + sphereRadius) / sphereRadius, 3.0);\n\n    vec3 sphereNormal = (point - sphereCenter) / sphereRadius;\n    vec3 refractedLight = refract(-light, vec3(0.0, 1.0, 0.0), IOR_AIR / IOR_WATER);\n    float diffuse = max(0.0, dot(-refractedLight, sphereNormal)) * 0.5;\n    vec4 info = texture2D(water, poolUv(point.xz));\n    if (point.y < info.r) {\n      vec4 caustic = causticsEnabled > 0.5 ? texture2D(causticTex, poolUv(0.75 * (point.xz - point.y * refractedLight.xz / refractedLight.y))) : vec4(1.0, 1.0, 0.0, 0.0);\n      diffuse *= mix(1.0, caustic.r * 4.0, causticsEnabled);\n    }\n    color += diffuse;\n    return color;\n  }\n\n  vec3 getWallColor(vec3 point) {\n    float scale = 0.5;\n\n    vec3 wallColor;\n    vec3 normal;\n    if (abs(point.x) > poolHalfSize.x - 0.001) {\n      wallColor = texture2D(tiles, point.yz * 0.5 + vec2(1.0, 0.5)).rgb;\n      normal = vec3(-point.x, 0.0, 0.0);\n    } else if (abs(point.z) > poolHalfSize.y - 0.001) {\n      wallColor = texture2D(tiles, point.yx * 0.5 + vec2(1.0, 0.5)).rgb;\n      normal = vec3(0.0, 0.0, -point.z);\n    } else {\n      wallColor = texture2D(tiles, point.xz * 0.5 + 0.5).rgb;\n      normal = vec3(0.0, 1.0, 0.0);\n    }\n\n    scale /= length(point);                                                       // pool AO\n    scale *= 1.0 - 0.9 / pow(length(point - sphereCenter) / sphereRadius, 4.0);   // sphere AO\n\n    vec3 refractedLight = -refract(-light, vec3(0.0, 1.0, 0.0), IOR_AIR / IOR_WATER);\n    float diffuse = max(0.0, dot(refractedLight, normal));\n    vec4 info = texture2D(water, poolUv(point.xz));\n\n    if (point.y < info.r) {\n      vec4 caustic = causticsEnabled > 0.5 ? texture2D(causticTex, poolUv(0.75 * (point.xz - point.y * refractedLight.xz / refractedLight.y))) : vec4(1.0, 1.0, 0.0, 0.0);\n      scale += diffuse * caustic.r * 2.0 * caustic.g * causticsEnabled;\n    } else {\n      vec2 t = intersectCube(point, refractedLight, poolMin(), poolMax());\n      diffuse *= 1.0 / (1.0 + exp(-200.0 / (1.0 + 10.0 * (t.y - t.x)) * (point.y + refractedLight.y * t.y - 2.0 / 12.0)));\n      scale += diffuse * 0.5;\n    }\n\n    return wallColor * scale;\n  }\n`;\n\n// \u2500\u2500\u2500 WATER SURFACE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nconst waterVertexShader = /* glsl */ `\n  uniform sampler2D water;\n  uniform vec2 poolHalfSize;\n  varying vec3 vPosition;\n\n  vec2 poolUv(vec2 xz) {\n    return xz / max(poolHalfSize * 2.0, vec2(0.001)) + 0.5;\n  }\n\n  void main() {\n    vec4 info = texture2D(water, poolUv(position.xy));\n    vPosition = position.xzy;       // map XY plane onto XZ plane\n    vPosition.y += info.r;\n    gl_Position = projectionMatrix * modelViewMatrix * vec4(vPosition, 1.0);\n  }\n`;\n\nconst surfaceRayBody = /* glsl */ `\n  uniform vec3 eye;\n  uniform samplerCube sky;\n  varying vec3 vPosition;\n\n  vec3 getSurfaceRayColor(vec3 origin, vec3 ray, vec3 waterColor) {\n    vec3 color;\n    float q = intersectSphere(origin, ray, sphereCenter, sphereRadius);\n    if (q < 1.0e6) {\n      color = getSphereColor(origin + ray * q);\n    } else if (ray.y < 0.0) {\n      vec2 t = intersectCube(origin, ray, poolMin(), poolMax());\n      color = getWallColor(origin + ray * t.y);\n    } else {\n      vec2 t = intersectCube(origin, ray, poolMin(), poolMax());\n      vec3 hit = origin + ray * t.y;\n      if (hit.y < 2.0 / 12.0) {\n        color = getWallColor(hit);\n      } else {\n        color = textureCube(sky, ray).rgb;\n        color += vec3(pow(max(0.0, dot(light, ray)), 5000.0)) * vec3(10.0, 8.0, 6.0);\n      }\n    }\n    if (ray.y < 0.0) color *= waterColor;\n    return color;\n  }\n`;\n\nexport const waterAboveFragmentShader = /* glsl */ `\n  precision highp float;\n  ${helpers}\n  ${surfaceRayBody}\n\n  void main() {\n    vec2 coord = poolUv(vPosition.xz);\n    vec4 info = texture2D(water, coord);\n\n    // Make water look more \"peaked\"\n    for (int i = 0; i < 5; i++) {\n      coord += info.ba * 0.005;\n      info = texture2D(water, coord);\n    }\n\n    vec3 normal = vec3(info.b, sqrt(1.0 - dot(info.ba, info.ba)), info.a);\n    vec3 incomingRay = normalize(vPosition - eye);\n\n    vec3 reflectedRay = reflect(incomingRay, normal);\n    vec3 refractedRay = refract(incomingRay, normal, IOR_AIR / IOR_WATER);\n    float fresnel = mix(0.25, 1.0, pow(1.0 - dot(normal, -incomingRay), 3.0));\n\n    vec3 reflectedColor = getSurfaceRayColor(vPosition, reflectedRay, abovewaterColor);\n    vec3 refractedColor = getSurfaceRayColor(vPosition, refractedRay, abovewaterColor);\n\n    gl_FragColor = vec4(mix(refractedColor, reflectedColor, fresnel), 1.0);\n  }\n`;\n\nexport const waterBelowFragmentShader = /* glsl */ `\n  precision highp float;\n  ${helpers}\n  ${surfaceRayBody}\n\n  void main() {\n    vec2 coord = poolUv(vPosition.xz);\n    vec4 info = texture2D(water, coord);\n\n    for (int i = 0; i < 5; i++) {\n      coord += info.ba * 0.005;\n      info = texture2D(water, coord);\n    }\n\n    vec3 normal = vec3(info.b, sqrt(1.0 - dot(info.ba, info.ba)), info.a);\n    vec3 incomingRay = normalize(vPosition - eye);\n\n    normal = -normal;\n    vec3 reflectedRay = reflect(incomingRay, normal);\n    vec3 refractedRay = refract(incomingRay, normal, IOR_WATER / IOR_AIR);\n    float fresnel = mix(0.5, 1.0, pow(1.0 - dot(normal, -incomingRay), 3.0));\n\n    vec3 reflectedColor = getSurfaceRayColor(vPosition, reflectedRay, underwaterColor);\n    vec3 refractedColor = getSurfaceRayColor(vPosition, refractedRay, vec3(1.0)) * vec3(0.8, 1.0, 1.1);\n\n    gl_FragColor = vec4(mix(reflectedColor, refractedColor, (1.0 - fresnel) * length(refractedRay)), 1.0);\n  }\n`;\n\nexport const splashWaterVertexShader = /* glsl */ `\n  varying vec3 vPosition;\n  varying vec3 vWorldPosition;\n  varying vec3 vWorldNormal;\n\n  void main() {\n    #ifdef USE_INSTANCING\n      mat4 objectMatrix = modelMatrix * instanceMatrix;\n    #else\n      mat4 objectMatrix = modelMatrix;\n    #endif\n    vec4 worldPosition = objectMatrix * vec4(position, 1.0);\n    vPosition = worldPosition.xyz;\n    vWorldPosition = worldPosition.xyz;\n    vWorldNormal = normalize(mat3(objectMatrix) * normal);\n    gl_Position = projectionMatrix * viewMatrix * worldPosition;\n  }\n`;\n\nexport const splashWaterFragmentShader = /* glsl */ `\n  precision highp float;\n  ${helpers}\n  ${surfaceRayBody}\n\n  uniform float uReflectionStrength;\n  uniform float uRefractionStrength;\n  uniform float uColorMix;\n\n  varying vec3 vWorldPosition;\n  varying vec3 vWorldNormal;\n\n  void main() {\n    vec3 normal = normalize(vWorldNormal);\n    vec3 incomingRay = normalize(vWorldPosition - eye);\n    if (dot(normal, -incomingRay) < 0.0) normal = -normal;\n\n    vec3 reflectedRay = reflect(incomingRay, normal);\n    vec3 refractedRay = refract(incomingRay, normal, IOR_AIR / IOR_WATER);\n    float fresnel = mix(0.25, 1.0, pow(max(0.0, 1.0 - dot(normal, -incomingRay)), 3.0));\n\n    vec3 tint = mix(vec3(1.0), abovewaterColor, clamp(uColorMix, 0.0, 1.5));\n    vec3 reflectedColor = getSurfaceRayColor(vWorldPosition + normal * 0.003, reflectedRay, tint) * uReflectionStrength;\n    vec3 refractedColor = getSurfaceRayColor(vWorldPosition - normal * 0.003, refractedRay, tint) * uRefractionStrength;\n\n    vec3 halfVector = normalize(light - incomingRay);\n    float specular = pow(max(0.0, dot(normal, halfVector)), 180.0) * 2.0;\n    vec3 color = mix(refractedColor, reflectedColor, fresnel) + vec3(specular) * vec3(1.0, 0.92, 0.78);\n\n    gl_FragColor = vec4(color, 1.0);\n  }\n`;\n\nexport { waterVertexShader };\n\n// \u2500\u2500\u2500 POOL CUBE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexport const cubeVertexShader = /* glsl */ `\n  varying vec3 vPosition;\n  uniform float poolDepthY;\n  void main() {\n    vPosition = position;\n    vPosition.y = mix(2.0 / 12.0, -poolDepthY, (position.y + 1.0) * 0.5);\n    gl_Position = projectionMatrix * modelViewMatrix * vec4(vPosition, 1.0);\n  }\n`;\n\nexport const cubeFragmentShader = /* glsl */ `\n  precision highp float;\n  ${helpers}\n  varying vec3 vPosition;\n\n  void main() {\n    gl_FragColor = vec4(getWallColor(vPosition), 1.0);\n    vec4 info = texture2D(water, poolUv(vPosition.xz));\n    if (vPosition.y < info.r) {\n      gl_FragColor.rgb *= underwaterColor * 1.2;\n    }\n  }\n`;\n\n// \u2500\u2500\u2500 SPHERE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexport const sphereVertexShader = /* glsl */ `\n  uniform vec3 sphereCenterU;\n  uniform float sphereRadiusU;\n  varying vec3 vPosition;\n  void main() {\n    vPosition = sphereCenterU + position * sphereRadiusU;\n    gl_Position = projectionMatrix * modelViewMatrix * vec4(vPosition, 1.0);\n  }\n`;\n\nexport const sphereRenderFragmentShader = /* glsl */ `\n  precision highp float;\n  ${helpers}\n  varying vec3 vPosition;\n\n  void main() {\n    gl_FragColor = vec4(getSphereColor(vPosition), 1.0);\n    vec4 info = texture2D(water, poolUv(vPosition.xz));\n    if (vPosition.y < info.r) {\n      gl_FragColor.rgb *= underwaterColor * 1.2;\n    }\n  }\n`;\n\n// \u2500\u2500\u2500 CAUSTICS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexport const causticsVertexShader = /* glsl */ `\n  ${helpers}\n  varying vec3 oldPos;\n  varying vec3 newPos;\n  varying vec3 ray;\n\n  vec3 project(vec3 origin, vec3 r, vec3 refractedLight) {\n    vec2 tcube = intersectCube(origin, r, poolMin(), poolMax());\n    origin += r * tcube.y;\n    float tplane = (-origin.y - poolDepthY) / refractedLight.y;\n    return origin + refractedLight * tplane;\n  }\n\n  void main() {\n    vec4 info = texture2D(water, position.xy * 0.5 + 0.5);\n    info.ba *= 0.5;\n    vec3 normal = vec3(info.b, sqrt(1.0 - dot(info.ba, info.ba)), info.a);\n\n    vec3 refractedLight = refract(-light, vec3(0.0, 1.0, 0.0), IOR_AIR / IOR_WATER);\n    ray = refract(-light, normal, IOR_AIR / IOR_WATER);\n\n    vec3 v = vec3(position.x * poolHalfSize.x, 0.0, position.y * poolHalfSize.y);\n    oldPos = project(v, refractedLight, refractedLight);\n    newPos = project(v + vec3(0.0, info.r, 0.0), ray, refractedLight);\n\n    gl_Position = vec4(0.75 * ((newPos.xz + refractedLight.xz / refractedLight.y) / max(poolHalfSize, vec2(0.001))), 0.0, 1.0);\n  }\n`;\n\nexport const causticsFragmentShader = /* glsl */ `\n  precision highp float;\n  ${helpers}\n  varying vec3 oldPos;\n  varying vec3 newPos;\n  varying vec3 ray;\n\n  void main() {\n    float oldArea = length(dFdx(oldPos)) * length(dFdy(oldPos));\n    float newArea = length(dFdx(newPos)) * length(dFdy(newPos));\n    gl_FragColor = vec4(oldArea / newArea * 0.2, 1.0, 0.0, 0.0);\n\n    vec3 refractedLight = refract(-light, vec3(0.0, 1.0, 0.0), IOR_AIR / IOR_WATER);\n\n    // Sphere blob shadow\n    vec3 dir = (sphereCenter - newPos) / sphereRadius;\n    vec3 area = cross(dir, refractedLight);\n    float shadow = dot(area, area);\n    float dist = dot(dir, -refractedLight);\n    shadow = 1.0 + (shadow - 1.0) / (0.05 + dist * 0.025);\n    shadow = clamp(1.0 / (1.0 + exp(-shadow)), 0.0, 1.0);\n    shadow = mix(1.0, shadow, clamp(dist * 2.0, 0.0, 1.0));\n    gl_FragColor.g = shadow;\n\n    // Pool rim shadow\n    vec2 t = intersectCube(newPos, -refractedLight, poolMin(), poolMax());\n    gl_FragColor.r *= 1.0 / (1.0 + exp(-200.0 / (1.0 + 10.0 * (t.y - t.x)) * (newPos.y - refractedLight.y * t.y - 2.0 / 12.0)));\n  }\n`;\n\n// \u2500\u2500\u2500 PROCEDURAL HDR SKY (for cubemap pre-bake) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexport const skyVertexShader = /* glsl */ `\n  varying vec3 vDir;\n  void main() {\n    vDir = position;\n    gl_Position = vec4(position.xy, 0.0, 1.0);\n  }\n`;\n"}</script>

  <script type="application/json" id="water-encyclopedia-source">"Water Encyclopedia Master Index v0.1 (engine-ready)\r\n0) How every entry is written (phenomenon card contract)\r\n\r\nEvery leaf node in the index becomes a Phenomenon Card with:\r\n\r\nID / Name\r\n\r\nWhere it lives: surface / subsurface / air–water interface / bottom boundary\r\n\r\nScale: wavelength/feature size, time scale\r\n\r\nDominant dimensionless regime (pick what matters):\r\n\r\nFroude \r\n𝐹\r\n𝑟\r\n=\r\n𝑈\r\n𝑔\r\n𝐿\r\nFr=\r\ngL\r\n\t​\r\n\r\nU\r\n\t​\r\n\r\n (gravity vs inertia)\r\n\r\nReynolds \r\n𝑅\r\n𝑒\r\n=\r\n𝜌\r\n𝑈\r\n𝐿\r\n𝜇\r\nRe=\r\nμ\r\nρUL\r\n\t​\r\n\r\n (turbulence vs viscosity)\r\n\r\nWeber \r\n𝑊\r\n𝑒\r\n=\r\n𝜌\r\n𝑈\r\n2\r\n𝐿\r\n𝜎\r\nWe=\r\nσ\r\nρU\r\n2\r\nL\r\n\t​\r\n\r\n (breakup vs surface tension)\r\n\r\nBond/Eötvös \r\n𝐵\r\n𝑜\r\n=\r\n𝜌\r\n𝑔\r\n𝐿\r\n2\r\n𝜎\r\nBo=\r\nσ\r\nρgL\r\n2\r\n\t​\r\n\r\n (gravity vs surface tension)\r\n\r\nGoverning model (math): the minimum equations needed\r\n\r\nObservable cues (what the camera sees)\r\n\r\nWhat looks wrong (anti-cues)\r\n\r\nEngine mapping:\r\n\r\nrequired fields: \r\n𝜂\r\nη (height), \r\n∇\r\n𝜂\r\n∇η (slopes), \r\n𝑢\r\nu (flow), foam \r\n𝐹\r\nF, spray \r\n𝑆\r\nS, bubbles \r\n𝐵\r\nB, turbidity \r\n𝑇\r\nT, thickness \r\n𝜏\r\nτ, etc.\r\n\r\nsimulation tier: L0–L5 (see §9)\r\n\r\nrendering terms: Fresnel, absorption, scattering, caustics, SSR, etc.\r\n\r\nperf/LOD caps + fallbacks\r\n\r\nValidation scenes (a reproducible test)\r\n\r\nThis format matches the project’s “AI-debuggable” goal: each phenomenon has a diagnostic and a rendering + simulation owner.\r\n\r\n1) Water bodies and macro-environments (where the rules change)\r\n\r\n1.1 Ocean (deep water)\r\n\r\nswell + wind sea, long fetch spectra, deep-water dispersion, whitecaps, streak foam\r\n1.2 Coastal / nearshore\r\n\r\nbathymetry-driven refraction + shoaling, surf-zone breaking, rip currents, shoreline runup\r\n1.3 Rivers / streams\r\n\r\nopen-channel flow, shear layers, standing waves, hydraulic jumps, bores, turbulence + aeration\r\n1.4 Lakes / reservoirs\r\n\r\nfinite boundaries: seiches, reflected waves, wind set-up, calmer micro-roughness\r\n1.5 Ponds / pools\r\n\r\nwalls/bottom strongly visible: caustics dominance, boundary reflections, shallow scattering\r\n1.6 Waterfalls / spillways\r\n\r\nthin sheets, breakup, mist plumes, plunge pools, high aeration\r\n1.7 Wet ground / puddles / thin films\r\n\r\nsurface tension + contact angle, adhesion, rivulets, pooling, drying edges\r\n1.8 Ice / slush / mixed phase (optional)\r\n\r\nmelting interface, brash ice damping, slush viscosity shift\r\n\r\n2) Forcing, controls, and boundary conditions (what drives motion)\r\n\r\n2.1 Wind forcing: stress, gusts, streaks, alignment to wind direction\r\n2.2 Gravity + depth: dispersion changes with \r\nℎ\r\nh; shallow vs deep transitions\r\n2.3 Bathymetry: refraction, shoaling, breaking likelihood\r\n2.4 Boundaries: reflective/absorbing walls; beaches vs cliffs\r\n2.5 Currents: advection of waves/foam; Doppler shift; shear instabilities\r\n2.6 Objects: hulls/characters/projectiles: wakes, splashes, entrainment\r\n2.7 External “director controls”: stylization knobs that preserve relationships (no category mistakes)\r\n\r\n3) Surface wave taxonomy (the encyclopedia of “waves”)\r\n\r\n3.1 Linear wave fundamentals\r\n\r\nsuperposition, interference, standing waves, beats\r\n3.2 Dispersion (core math)\r\n\r\ngravity–capillary dispersion:\r\n\r\n𝜔\r\n2\r\n=\r\n(\r\n𝑔\r\n𝑘\r\n+\r\n𝜎\r\n𝜌\r\n𝑘\r\n3\r\n)\r\ntanh\r\n⁡\r\n(\r\n𝑘\r\nℎ\r\n)\r\nω\r\n2\r\n=(gk+\r\nρ\r\nσ\r\n\t​\r\n\r\nk\r\n3\r\n)tanh(kh)\r\n\r\nphase speed \r\n𝑐\r\n=\r\n𝜔\r\n/\r\n𝑘\r\nc=ω/k, group speed \r\n𝑐\r\n𝑔\r\n=\r\n𝑑\r\n𝜔\r\n/\r\n𝑑\r\n𝑘\r\nc\r\ng\r\n\t​\r\n\r\n=dω/dk\r\n3.3 Deep-water gravity waves\r\n\r\n𝑘\r\nℎ\r\n≫\r\n1\r\nkh≫1: \r\n𝜔\r\n2\r\n≈\r\n𝑔\r\n𝑘\r\nω\r\n2\r\n≈gk\r\n3.4 Shallow-water waves\r\n\r\n𝑘\r\nℎ\r\n≪\r\n1\r\nkh≪1: \r\n𝑐\r\n≈\r\n𝑔\r\nℎ\r\nc≈\r\ngh\r\n\t​\r\n\r\n (less dispersive; shoreline behavior changes)\r\n3.5 Capillary waves / ripples\r\n\r\nsurface tension dominated; sparkle + micro-roughness; quickly damped\r\n3.6 Solitons / bores (shallow)\r\n\r\ntidal bores, river bores\r\n3.7 Internal waves (subsurface stratification)\r\n\r\nsurface might show subtle bands; important for “realism lore” but often faked\r\n3.8 Ship wakes / Kelvin patterns\r\n\r\ncusp angle + interference pattern; evolves with depth + speed\r\n3.9 Seiches\r\n\r\nbasin resonances (lakes/pools)\r\n3.10 Rogue / freak waves (rare)\r\n\r\ninterference focusing; cinematic toggle\r\n\r\n4) Breaking, crests, and “water becomes a sheet” (your key cinematic moment)\r\n\r\nThis is where heightfields fail and the hybrid system activates. The project’s core visual truth is: a crest turns into a sheet, conforms to the wave, rides the wave—not “VFX pasted on.”\r\n\r\n4.1 Shoaling + steepening\r\n4.2 Breaking types (spilling / plunging / surging)\r\n4.3 Curling lip + barrel air pocket (brief)\r\n4.4 Sheet formation → ligament breakup → droplets (Weber number drives breakup)\r\n4.5 Whitecaps (wind breaking)\r\n4.6 Aftermath: foam advection/decay, ring waves, turbulence cues\r\n\r\n5) Multiphase “secondarys” (foam, spray, bubbles, mist)\r\n\r\nThese are mandatory for “real water read.”\r\n\r\n5.1 Foam (surface aeration)\r\n\r\ngeneration triggers, advection, stretching, clumping, decay\r\n\r\nrepresentation: particles vs 2D foam density field\r\n5.2 Spray / spindrift / mist\r\n\r\nballistic droplets + air drag; non-colliding cheap path\r\n5.3 Bubbles (subsurface air)\r\n\r\nentrainment, rise, pop → foam contribution\r\n5.4 Turbidity / suspended sediment\r\n\r\n“green/brown water,” visibility loss, forward scattering\r\n5.5 Biological + debris (optional)\r\n\r\nseaweed lines, flotsam streaking (helps scale)\r\n\r\n6) Subsurface and near-surface flow phenomena (what you see through the water)\r\n\r\n6.1 Refraction-driven distortion of bottom geometry\r\n6.2 Underwater “veil”: absorption + scattering with distance\r\n6.3 Caustics: focused light patterns on bottom/walls/objects\r\n6.4 Volumetric shafts / god rays (participating media)\r\n6.5 Boundary layers near bottom: sand ripples, resuspension (cinematic bonus)\r\n6.6 Underwater wakes: bubbles + turbulence trails\r\n\r\n7) Optics & lighting encyclopedia (above + below the surface)\r\n\r\nThis section must be unified across base water + breach/splash layers (shared cubemap, shared IOR, shared underwater tint), or it will look like two different “waters.”\r\n\r\n7.1 Interface optics (air↔water)\r\n\r\nFresnel reflectance \r\n𝐹\r\n(\r\n𝜃\r\n)\r\nF(θ) (strong at grazing angles)\r\n\r\nSnell refraction: \r\n𝑛\r\n1\r\nsin\r\n⁡\r\n𝜃\r\n1\r\n=\r\n𝑛\r\n2\r\nsin\r\n⁡\r\n𝜃\r\n2\r\nn\r\n1\r\n\t​\r\n\r\nsinθ\r\n1\r\n\t​\r\n\r\n=n\r\n2\r\n\t​\r\n\r\nsinθ\r\n2\r\n\t​\r\n\r\n\r\nmicrofacet BRDF/BTDF approximations for real-time\r\n7.2 Absorption (Beer–Lambert)\r\n\r\n𝑇\r\n(\r\n𝜆\r\n,\r\n𝑑\r\n)\r\n=\r\nexp\r\n⁡\r\n(\r\n−\r\n𝑎\r\n(\r\n𝜆\r\n)\r\n \r\n𝑑\r\n)\r\nT(λ,d)=exp(−a(λ)d)\r\n\r\n7.3 Scattering (water + particulates)\r\n\r\nphase functions (often Henyey–Greenstein), in-scattering haze\r\n7.4 Caustics formation\r\n\r\nfrom refracted sunlight via surface normals; in-engine: projected caustics texture (plus occlusion by thick splash volumes)\r\n7.5 Sky + sun environment\r\n\r\nsky radiance drives reflections; sun glints are key cues\r\n7.6 Underwater camera model\r\n\r\ncolor shift + contrast loss; “underwater line” transitions must match across layers\r\n7.7 Lighting conditions (catalog)\r\n\r\nnoon sun, golden hour, overcast, storm, night/moon, artificial lights, bioluminescent stylization\r\n\r\n8) Rendering representations (what geometry are we actually shading?)\r\n\r\n8.1 Heightfield surface mesh (displacement)\r\n8.2 Screen-space fluid surface (depth/thickness → normals)\r\n8.3 Volume proxies (fog/mist)\r\n8.4 Foam layers (decals/fields/particles)\r\n8.5 Reflections: cubemap / SSR / planar (tiered)\r\n8.6 Refractions: scene color + thickness + absorption\r\n8.7 Compositing order: deterministic post-style composite is preferred to avoid “depth lies.”\r\n\r\n9) Simulation ladder (how we decide “how real” per phenomenon)\r\n\r\nThis is the project’s crucial bridge from encyclopedia → code:\r\n\r\nL0 Shading-only micro detail (wind shimmer normals)\r\n\r\nL1 Kinematic waves (Gerstner/sum of sines)\r\n\r\nL2 Spectral (FFT) waves (dispersion + plausible spectra)\r\n\r\nL3 Heightfield PDE (SWE for wakes/shore/bulk flow)\r\n\r\nL4 Event-driven volumetric detail (localized 3D: SPH/FLIP/MPM)\r\n\r\nL5 Offline/film-grade (reference/ground-truth comparisons)\r\n\r\nThis ladder is already formalized in the docs; we’re extending it to every phenomenon and lighting term.\r\n\r\n10) Hybrid coupling and “seam elimination” (the glue)\r\n\r\nshared optical constants (IOR, absorption/scattering/tint)\r\n\r\nshared environment (cubemap)\r\n\r\ncamera underwater test must match\r\n\r\nbreach layer adds thickness/transmittance but must not create a second water look\r\n\r\n11) LOD, budgets, and “no-stall” constraints\r\n\r\nEvery expensive leaf node must declare:\r\n\r\nactivation conditions (distance, importance, triggers)\r\n\r\nhard caps (events/sec, particles, passes)\r\n\r\nfallbacks (foam-first proxies when budgets are exceeded)\r\n\r\nno synchronous GPU readbacks in the hot loop (telemetry tiers)\r\n\r\nThis matches the engine’s performance-first contract and hybrid design intent.\r\n\r\n12) Validation & canonical scenes (encyclopedia must be testable)\r\n\r\nA minimal set (each becomes a “truth table” for visuals + perf):\r\n\r\ncalm lake + ripple rings + wall reflections\r\n\r\nwind sea → whitecaps threshold + foam advection\r\n\r\nshallow beach: refraction + shoaling + breaking type changes\r\n\r\nriver rapid: standing wave + aeration + mist\r\n\r\nobject entry: splash + bubble plume + ring waves\r\n\r\nunderwater camera crossing waterline + caustics on floor\r\n\r\ncinematic breach: crest→sheet, coherent lighting match, no seam\r\n\r\nThree “fully detailed” example entries (so you can see the level)\r\nExample A — Gravity–Capillary Dispersion (core wave behavior)\r\n\r\nMath: \r\n𝜔\r\n2\r\n=\r\n(\r\n𝑔\r\n𝑘\r\n+\r\n𝜎\r\n𝜌\r\n𝑘\r\n3\r\n)\r\ntanh\r\n⁡\r\n(\r\n𝑘\r\nℎ\r\n)\r\nω\r\n2\r\n=(gk+\r\nρ\r\nσ\r\n\t​\r\n\r\nk\r\n3\r\n)tanh(kh)\r\n\r\nCues: wave packets spread; in deep water, different wavelengths travel differently; in shallow water, speed becomes depth-driven and less dispersive\r\n\r\nLooks wrong: “all wavelengths same speed” in deep-water gravity regime\r\n\r\nEngine mapping:\r\n\r\nL2 FFT owns deep-water dispersion; L3 SWE owns shallow/bathymetry transitions; L0 adds micro shimmer.\r\n\r\nValidation: impulse ring test + depth ramp test (watch wavefront bend + compress near shore).\r\n\r\nExample B — Foam / Spray / Bubbles (secondarys as indicators of violence)\r\n\r\nFoam: spawned by breaking/turbulence; advected by surface flow; decays; render as particles or foam field\r\n\r\nSpray: tiny droplets, often non-colliding; additive highlights; short lifetime\r\n\r\nBubbles: entrained air rises and pops; mostly visual in real-time\r\n\r\nEngine mapping: foam field \r\n𝐹\r\n(\r\n𝑥\r\n,\r\n𝑧\r\n)\r\nF(x,z) + spray particles \r\n𝑆\r\nS + bubble particles \r\n𝐵\r\nB; coupling across layers is required so foam persists when detail sim turns off\r\n\r\nValidation: plunging breaker scene → foam streaks advect + decay; underwater bubble plume rises and pops.\r\n\r\nExample C — Underwater optics + breach blending (one water, two representations)\r\n\r\nRule: base water + breach layer must share: cubemap, IOR, underwater tint, tone mapping; otherwise it reads as two waters\r\n\r\nTransmittance: thickness-based attenuation is a good bridge term for particle fluid rendering (depth/thickness RTs)\r\n\r\nCaustics: simplest integration is occlusion of existing caustics by splash thickness (fast)\r\n\r\nValidation: A/B toggle breach layer—base ocean must remain unchanged; breach should look like a continuation, not an overlay\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n1) What we’re changing (right now)\r\n\r\nWe’re freezing a canonical master index (ToC) for the entire water + lighting encyclopedia, aligned to the project’s existing Volumes I–VI / Part VII structure.\r\n\r\nWe’re defining a Phenomenon Card schema (every leaf node becomes an engine-spec “card”).\r\n\r\nWe’re populating the first batch of core cards (waves → breaking → foam/spray/bubbles → optics/underwater/caustics), because these directly drive the “perfect water” look and the hybrid ocean+splash system.\r\n\r\n2) Why (physics → visuals → code, with drift prevention)\r\n\r\nIf the ToC isn’t rigid, we’ll drift into tuning symptoms instead of capturing the true causes (e.g., “ripples” accidentally treated as “main waves,” or “foam” as decoration rather than a violence indicator).\r\n\r\nFor the hybrid system specifically, the encyclopedia must encode the non-negotiable visual truth: crest → sheet, wave-conforming spawn, wave-inherited velocities, then (and only then) feedback/tuning.\r\n\r\n3) Implementation steps (small, shippable increments)\r\n\r\nLock the ToC below as WATER_ENCYCLOPEDIA_MASTER_INDEX.md.\r\n\r\nAdd PHENOMENON_CARD_TEMPLATE.md (schema below).\r\n\r\nCreate CROSSWALK_MATRIX.md: phenomenon → required fields/textures → sim ladder L0–L5 → render features → LOD caps.\r\n\r\nFill cards in this priority order:\r\n\r\nA) Surface waves + spectra + regimes\r\n\r\nB) Breaking + genesis triggers (SF0/SF1 → ribbon/sheets)\r\n\r\nC) Foam/spray/bubbles (lifecycles + rendering)\r\n\r\nD) Optics: Fresnel/refraction/absorption/scattering/caustics/waterline\r\n\r\nE) Rivers/shorelines (hydraulic jump, standing waves, shoaling)\r\n\r\nEach card gets 1 validation scene + debug views (L0/L1 no readback; L2 throttled).\r\n\r\n4) Master Index (the encyclopedia ToC)\r\nVolume I — Vision, “North Star,” and controllability\r\n\r\nGoals: realism and art direction without breaking physics relationships\r\n\r\nTaxonomy rules: main waves ≠ ripples, foam ≠ albedo, spray ≠ smoke\r\n\r\nThe ladder: L0–L5 (what must be true at each)\r\n\r\nGlobal unit system + symbol glossary (g, ρ, μ, σ, η, k, ω, h, U…)\r\n\r\nVolume II — Splash & 3D detail fluids (MLS-MPM layer)\r\n\r\nSheet water (ribbons) vs droplets vs mist volumes\r\n\r\nGenesis: wave-conforming position + wave-inherited velocity\r\n\r\nBreakup: sheet → ligaments → droplets (Weber-driven)\r\n\r\nEnergy/accounting: what is allowed to feed back, when\r\n\r\nVolume III — Hybrid ocean & wave systems (2.5D + localized 3D)\r\n\r\nBase ocean representations: Gerstner / FFT / heightfield PDE\r\n\r\nCoupling maps + textures: BAT, BFT, EBT, SF0/SF1\r\n\r\nSeam elimination: shared optics + consistent underwater view\r\n\r\nLOD/budget policy + “no stall” telemetry contract\r\n\r\nVolume IV — Wave physics reference (the wave encyclopedia)\r\n\r\nA. Fundamental regimes\r\n\r\nDeep vs shallow: \r\n𝑘\r\nℎ\r\n≫\r\n1\r\nkh≫1 vs \r\n𝑘\r\nℎ\r\n≪\r\n1\r\nkh≪1\r\n\r\nGravity vs capillary (Bond number)\r\n\r\nDimensionless map: \r\n𝐹\r\n𝑟\r\n,\r\n𝑅\r\n𝑒\r\n,\r\n𝑊\r\n𝑒\r\n,\r\n𝐵\r\n𝑜\r\nFr,Re,We,Bo\r\n\r\nB. Linear wave machinery (must be exact)\r\n\r\nDispersion (gravity-capillary):\r\n\r\n𝜔\r\n2\r\n=\r\n(\r\n𝑔\r\n𝑘\r\n+\r\n𝜎\r\n𝜌\r\n𝑘\r\n3\r\n)\r\ntanh\r\n⁡\r\n(\r\n𝑘\r\nℎ\r\n)\r\nω\r\n2\r\n=(gk+\r\nρ\r\nσ\r\n\t​\r\n\r\nk\r\n3\r\n)tanh(kh)\r\n\r\nPhase/group velocity, packets, interference\r\n\r\nC. Catalog of waves\r\n\r\nWind sea, swell, seiches, tsunamis (as long waves), solitons/bores\r\n\r\nShip wakes (Kelvin pattern), standing waves, edge waves\r\n\r\nInternal waves (optional realism layer)\r\n\r\nD. Nonlinear + breaking\r\n\r\nSteepening, crest sharpening, breaking types (spilling/plunging/surging)\r\n\r\nShoaling, refraction, diffraction, runup, surf zone\r\n\r\nVolume V — Breach, spawn, and effects (foam/spray/bubbles)\r\n\r\n“Violence detectors” (steepness/curvature/η̇ proxies) → triggers\r\n\r\nSpawn Fields SF0/SF1 → ribbon parcel mapping\r\n\r\nFoam lifecycle: generate → advect → stretch → decay\r\n\r\nSpray lifecycle: emit → ballistic → light → fade\r\n\r\nBubbles: entrain → rise → pop → feed foam\r\n\r\nAftermath + ring waves (BFT), with strict gating\r\n\r\nVolume VI — Rendering, lighting, underwater, and implementation specs\r\n\r\nA. Interface optics\r\n\r\nFresnel reflectance, Snell refraction, total internal reflection\r\n\r\nMicrofacet surface for sun glints and sky streaks\r\n\r\nB. Water color & visibility\r\n\r\nBeer–Lambert absorption \r\n𝑇\r\n(\r\n𝜆\r\n,\r\n𝑑\r\n)\r\n=\r\n𝑒\r\n−\r\n𝑎\r\n(\r\n𝜆\r\n)\r\n𝑑\r\nT(λ,d)=e\r\n−a(λ)d\r\n\r\nScattering/in-scattering, turbidity, underwater haze\r\n\r\nC. Caustics\r\n\r\nSurface-normal focusing, projection approximations, occlusion by thickness\r\n\r\nD. Waterline & camera transitions\r\n\r\nAbove/below blend, “Snell’s window” look, consistent tone mapping\r\n\r\nE. Feature LOD + budgets\r\n\r\nPass count caps, particle caps, screen-space RT tiers, fallback ordering\r\n\r\nPart VII — Extreme-detail code reference\r\n\r\nPer-feature exact data layouts, shader equations, pass graphs, debug views, perf traps (no synchronous readback).\r\n\r\n5) Phenomenon Card Template (every leaf node uses this)\r\n\r\nID: (e.g. WAVE.DISPERSION.GRAV_CAP)\r\nDomain: surface / subsurface / interface / air\r\nScales: \r\n𝐿\r\nL (m), \r\n𝑇\r\nT (s), typical ranges\r\nRegime: key dimensionless numbers (Fr/Re/We/Bo)\r\nGoverning math: minimal equations + approximations\r\nObservable cues: what the shot must show\r\nAnti-cues: what looks fake\r\nEngine fields needed: \r\n𝜂\r\n,\r\n∇\r\n𝜂\r\n,\r\n𝜅\r\n,\r\n𝜂\r\n˙\r\n,\r\n𝑢\r\n,\r\n𝐹\r\n,\r\n𝑆\r\n,\r\n𝐵\r\n,\r\n𝑇\r\n,\r\n𝜏\r\n.\r\n.\r\n.\r\nη,∇η,κ,\r\nη\r\n˙\r\n\t​\r\n\r\n,u,F,S,B,T,τ...\r\nSim ladder: L0–L5 mapping\r\nRendering: reflection/refraction/absorption/scatter/caustics/foam shading\r\nLOD/budgets: caps + fallbacks\r\nValidation scene: reproducible test + camera moves\r\nDebug views: what to visualize (no-stall tiers)\r\n\r\n6) First batch of fully detailed cards (core “must nail” phenomena)\r\nCard 1 — Gravity–Capillary Dispersion\r\n\r\nID: WAVE.DISPERSION.GRAV_CAP\r\nMath: \r\n𝜔\r\n2\r\n=\r\n(\r\n𝑔\r\n𝑘\r\n+\r\n𝜎\r\n𝜌\r\n𝑘\r\n3\r\n)\r\ntanh\r\n⁡\r\n(\r\n𝑘\r\nℎ\r\n)\r\nω\r\n2\r\n=(gk+\r\nρ\r\nσ\r\n\t​\r\n\r\nk\r\n3\r\n)tanh(kh)\r\nCues: packets spread; short ripples move with different speed than long swell; shallow water becomes depth-driven\r\nAnti-cues: all wavelengths travel identically in deep water\r\nEngine mapping:\r\n\r\nL2 FFT owns dispersion exactly for deep water\r\n\r\nL3 heightfield PDE owns shallow transitions + boundaries\r\n\r\nL0 adds micro-normal sparkle only (not energy)\r\nValidation: impulse ring on (a) deep plane (b) depth ramp → watch refraction + speed change\r\nDebug: visualize \r\n𝑘\r\nk-bands energy, phase speed, group speed.\r\n\r\nCard 2 — Capillary Ripples (micro-waves)\r\n\r\nID: WAVE.RIPPLES.CAPILLARY\r\nRegime: small \r\n𝐿\r\nL → surface tension matters (low \r\n𝐵\r\n𝑜\r\nBo)\r\nCues: tight, fast, quickly damped; dominates glints/sparkle; aligns with wind near camera\r\nAnti-cues: ripples changing the large swell height (category error)\r\nEngine mapping:\r\n\r\nL0 only: normal-map spectrum + anisotropy by wind\r\n\r\nOptional L2: very high-k band in FFT affects normals only\r\nRendering: microfacet roughness modulated by ripple energy\r\nLOD: near-only; fades to analytic roughness mid/far\r\nValidation: low sun angle → sparkle streaks respond to wind direction.\r\n\r\nCard 3 — Shallow-water Shoaling + Refraction\r\n\r\nID: WAVE.NEARSHORE.SHOAL_REFRACT\r\nMath hooks: depth changes effective speed; rays bend toward slower region\r\n\r\n(Conceptual) wave celerity decreases as \r\nℎ\r\nh decreases → wavelength shortens, height increases (until breaking)\r\nCues: wavefronts bend around sandbars; crests tighten near shore\r\nAnti-cues: same wavelength everywhere; waves hit shore as perfect straight lines regardless of bathymetry\r\nEngine mapping:\r\n\r\nL3 heightfield PDE or ray-based directional spectrum advection\r\n\r\nBAT channel should rise (steepness) as shoaling increases\r\nValidation: diagonal swell over depth gradient → visible crest bending.\r\n\r\nCard 4 — Breaking Genesis: crest → sheet\r\n\r\nID: BREAK.GENESIS.CREST_TO_SHEET\r\nRegime: steepness high; nonlinear crest sharpening; local instability\r\nObservable must-have: crest top becomes a thin sheet that conforms to the wave and rides it (not a detached VFX burst)\r\nTrigger signals (GPU-friendly):\r\n\r\nsteepness proxy \r\n𝑠\r\n=\r\n∣\r\n∇\r\n𝜂\r\n∣\r\ns=∣∇η∣\r\n\r\ncurvature proxy \r\n𝜅\r\nκ (screen-space or heightfield curvature)\r\n\r\nvertical motion proxy \r\n𝜂\r\n˙\r\nη\r\n˙\r\n\t​\r\n\r\n\r\nEngine mapping:\r\n\r\nBAT encodes steepness/curvature/η̇ proxies\r\n\r\nSF0/SF1 encodes spawn parcels for ribbons (position + orientation + thickness + initial velocity)\r\n\r\nL4 MLS-MPM runs only near active events\r\nLOD: if L4 budget exceeded → foam-first fallback, then spray-only\r\nValidation: traveling crest shot, side angle + top angle, slow-mo toggle: sheet must remain glued to crest motion.\r\n\r\nCard 5 — Whitecaps (wind breaking)\r\n\r\nID: FOAM.WHITE_CAPS.WIND\r\nCues: patchy bright foam on crest tips; increases with wind speed and fetch; advects with surface flow and stretches\r\nAnti-cues: uniform foam layer; foam ignoring wind direction/current\r\nEngine mapping:\r\n\r\ngenerate foam density \r\n𝐹\r\nF from steepness threshold + persistence\r\n\r\nadvect \r\n𝐹\r\nF by surface velocity field\r\nRendering: foam is high albedo but still Fresnel-affected; shadowing in foam clumps\r\nValidation: wind ramps up → foam coverage increases smoothly; gusts create streaks.\r\n\r\nCard 6 — Foam lifecycle (generate → advect → decay)\r\n\r\nID: FOAM.LIFECYCLE.SURFACE\r\nCore model (minimal):\r\n\r\nGeneration term \r\n𝐺\r\n(\r\nsteepness\r\n,\r\n𝜅\r\n,\r\n𝜂\r\n˙\r\n)\r\nG(steepness,κ,\r\nη\r\n˙\r\n\t​\r\n\r\n)\r\n\r\nAdvection: \r\n∂\r\n𝑡\r\n𝐹\r\n+\r\n𝑢\r\n⋅\r\n∇\r\n𝐹\r\n=\r\n𝐺\r\n−\r\n𝐷\r\n(\r\n𝐹\r\n)\r\n∂\r\nt\r\n\t​\r\n\r\nF+u⋅∇F=G−D(F)\r\n\r\nDecay \r\n𝐷\r\nD: exponential + stretch-based thinning\r\nCues: foam trails behind breakers; streaks elongate; fades unevenly\r\nAnti-cues: foam glued to world-space; foam fades uniformly like opacity\r\nLOD: far field becomes cheaper “whitecap coverage” scalar.\r\n\r\nCard 7 — Spray (ballistic droplets + mist)\r\n\r\nID: SPRAY.BALLISTIC.DROPLETS\r\nRegime: droplets decouple from water; air drag dominates quickly\r\nMinimal motion:\r\n\r\n𝑥\r\n˙\r\n=\r\n𝑣\r\nx\r\n˙\r\n=v\r\n\r\n𝑣\r\n˙\r\n=\r\n𝑔\r\n−\r\n𝑐\r\n𝑑\r\n∣\r\n𝑣\r\n−\r\n𝑣\r\n𝑎\r\n𝑖\r\n𝑟\r\n∣\r\n(\r\n𝑣\r\n−\r\n𝑣\r\n𝑎\r\n𝑖\r\n𝑟\r\n)\r\nv\r\n˙\r\n=g−c\r\nd\r\n\t​\r\n\r\n∣v−v\r\nair\r\n\t​\r\n\r\n∣(v−v\r\nair\r\n\t​\r\n\r\n) (cheap drag)\r\nCues: sparkly arcs catching sun; wind bends spray downwind; fades with distance\r\nAnti-cues: spray moving like smoke without gravity; or perfectly rigid arcs\r\nLOD: near-only; mid becomes billboard mist; far becomes nothing.\r\n\r\nCard 8 — Bubbles & subsurface aeration plume\r\n\r\nID: BUBBLES.PLUME.ENTRAINMENT\r\nCues: underwater whiteness near impact, rising bubble columns, pop at surface feeding foam\r\nAnti-cues: bubbles that don’t rise; foam that appears without any violence source\r\nEngine mapping:\r\n\r\nspawn bubble particles from impact/breaking events\r\n\r\nrise velocity + noise; pop at surface adds to foam \r\n𝐹\r\nF\r\nValidation: object entry → bubble plume visible underwater; surface foam appears where bubbles pop.\r\n\r\nCard 9 — Beer–Lambert absorption (water color with depth)\r\n\r\nID: OPTICS.ABSORPTION.BEER_LAMBERT\r\nMath: \r\n𝑇\r\n(\r\n𝜆\r\n,\r\n𝑑\r\n)\r\n=\r\n𝑒\r\n−\r\n𝑎\r\n(\r\n𝜆\r\n)\r\n𝑑\r\nT(λ,d)=e\r\n−a(λ)d\r\n\r\nCues: red dies first; scene shifts blue/green with distance; shallow pools look clearer\r\nAnti-cues: constant tint regardless of distance; underwater looks like fogged glass only\r\nEngine mapping: thickness \r\n𝜏\r\nτ from depth buffer / screen-space fluid thickness RT\r\nValidation: underwater camera moves away from object → color/contrast shift smoothly with distance.\r\n\r\nCard 10 — Fresnel reflection + refraction at interface\r\n\r\nID: OPTICS.INTERFACE.FRESNEL_SNELL\r\nMust-have cues: grazing angles are mirror-like; looking down is more transmissive; reflections brighten at horizon\r\nAnti-cues: same reflectivity at all angles\r\nEngine mapping:\r\n\r\nFresnel term drives blend between reflection and refraction\r\n\r\nconsistent IOR across base ocean + splash layer (no “two waters”)\r\nValidation: orbit camera low to water → reflection ramps naturally as angle approaches grazing.\r\n\r\nCard 11 — Caustics (focused light patterns)\r\n\r\nID: OPTICS.CAUSTICS.PROJECTION\r\nCues: moving bright networks on bottom/walls; speed matches surface wave motion; occluded by objects\r\nAnti-cues: static caustic texture; caustics moving unrelated to waves\r\nEngine mapping:\r\n\r\nprojected caustics driven by surface normals (or precomputed animated field)\r\n\r\nsplash thickness can attenuate/occlude caustics near impacts\r\nValidation: shallow pool, sun overhead, wave motion → caustic pattern speed/scale matches waves.\r\n\r\nCard 12 — Waterline transition + “Snell’s window” feel\r\n\r\nID: CAMERA.WATERLINE.TRANSITION\r\nCues: above/below blend is sharp but not jagged; underwater view has compressed “window” to sky; reflections behave differently above vs below\r\nAnti-cues: hard clip line with mismatched color/exposure; splash layer ignores underwater tint\r\nEngine mapping: unified underwater fog/absorption; shared exposure curve; waterline mask stable with waves\r\nValidation: camera slowly crosses surface near a breaking event: no seam, no double-water look.\r\n\r\n6) Validation checklist (we run every time we add cards)\r\nVisual sweeps\r\n\r\nDistance tiers: near/mid/far\r\n\r\nAngles: top-down, grazing, underwater, waterline\r\n\r\nMotion: calm → windy → breaking; slow-mo toggle for crest→sheet\r\n\r\nPerf + no-stall\r\n\r\nPass count audit (don’t “silently” add passes)\r\n\r\nParticle caps enforced (spray/bubbles/foam)\r\n\r\nNo synchronous GPU readback in frame loop (L2 micro-readback only if explicitly throttled)\r\n\r\nRegression safety\r\n\r\nFeature toggles per card\r\n\r\nPresets: lake / river / ocean / storm / pool\r\n\r\n7) Telemetry / debug views we add immediately\r\n\r\nHeightfield: \r\n𝜂\r\nη, \r\n𝜂\r\n˙\r\nη\r\n˙\r\n\t​\r\n\r\n, slope magnitude \r\n∣\r\n∇\r\n𝜂\r\n∣\r\n∣∇η∣, curvature proxy \r\n𝜅\r\nκ\r\n\r\nBAT: steepness/curvature/η̇ channels (trigger sanity)\r\n\r\nSF0/SF1: spawn parcel visualizer (arrows for inherited velocity)\r\n\r\nFoam density \r\n𝐹\r\nF + velocity advection arrows\r\n\r\nThickness \r\n𝜏\r\nτ + transmittance \r\n𝑇\r\nT (underwater correctness)\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n1) What we’re changing (this step)\r\n\r\nWe’re fully expanding Volume IV (Wave Physics Reference) into a complete wave catalog + regime map + engine crosswalk (L0–L5).\r\n\r\nWe’re fully expanding Volume VI (Rendering/Lighting/Underwater) into a complete optics + lighting condition catalog, again with an engine crosswalk.\r\n\r\nWe’re adding the data schema + code skeleton so this encyclopedia is directly codable (not just descriptive).\r\n\r\n2) Why\r\n\r\nA “perfect water engine” needs a single ontology that prevents category mistakes (ripples ≠ swell; foam ≠ albedo; spray ≠ smoke), while mapping every phenomenon to: fields → sims → shaders → LOD → tests.\r\n\r\nThe hybrid goal depends on correctness in this order: genesis visuals (crest→sheet) first, then coupling/feedback tuning.\r\n\r\nVolume IV — Wave Physics Reference (Expanded Master Catalog)\r\nIV.0 Symbols, units, and engine fields\r\n\r\nCore physical constants\r\n\r\n𝑔\r\ng gravity \r\n≈\r\n9.81\r\n \r\nm\r\n/\r\ns\r\n2\r\n≈9.81m/s\r\n2\r\n\r\n𝜌\r\nρ density (water \r\n∼\r\n1000\r\n \r\nk\r\ng\
