sit);\r\n}\r\n\r\n4.4 Swash foam band deposition (ocean uses SF1, river uses flow)\r\nSHORE_FOAM_BAND_FRAG\r\nprecision highp float;\r\nvarying vec2 vUv;\r\n\r\nuniform sampler2D uContact; // R cover, G band01\r\nuniform sampler2D uWet;     // R wetness\r\nuniform sampler2D uFoamPrev;// A foamDeposit\r\n\r\nuniform sampler2D uSF1;     // RG packed wave dir (optional)\r\nuniform sampler2D uFlow;    // RG flow dir/speed (optional)\r\nuniform int uUseFlow;\r\n\r\nuniform float uDt;\r\nuniform float uDepositGain;\r\nuniform float uFoamDecayPerSec;\r\n\r\nfloat sat(float x){ return clamp(x,0.0,1.0); }\r\n\r\nvec2 decodeDir(vec2 rg){\r\n  vec2 d = rg * 2.0 - 1.0;\r\n  return d / max(1e-4, length(d));\r\n}\r\n\r\nvoid main(){\r\n  vec4 c = texture2D(uContact, vUv);\r\n  float cover = c.r;\r\n  float band01 = c.g;\r\n\r\n  vec4 w = texture2D(uWet, vUv);\r\n  float wet = w.r;\r\n\r\n  float foamDeposit = texture2D(uFoamPrev, vUv).a;\r\n  foamDeposit *= exp(-uFoamDecayPerSec * uDt);\r\n\r\n  // “Incoming swash” proxy:\r\n  // - Ocean: stronger where band is high + wet is high (recently covered), wave dir exists\r\n  // - River: stronger where band is high + flow exists\r\n  float incoming = band01 * wet;\r\n\r\n  if (uUseFlow == 1) {\r\n    vec2 f = texture2D(uFlow, vUv).rg; // assume magnitude encoded\r\n    float speed = length(f);\r\n    incoming *= sat(speed / 2.0);\r\n  } else {\r\n    vec2 sf1 = texture2D(uSF1, vUv).rg;\r\n    vec2 F = decodeDir(sf1);\r\n    // If you have shoreline normal, project; MV just uses presence\r\n    incoming *= 1.0;\r\n  }\r\n\r\n  // Deposit foam right at shoreline (thin band)\r\n  float deposit = uDepositGain * incoming * band01;\r\n  foamDeposit = sat(foamDeposit + deposit * uDt * 2.0);\r\n\r\n  // Output keeps wetness/age, writes foamDeposit in A\r\n  gl_FragColor = vec4(wet, w.g, w.b, foamDeposit);\r\n}\r\n\r\n4.5 Terrain shading hook (wet sand/rock)\r\n\r\nRule: Wetness affects terrain material, not water. One truth.\r\n\r\nsrc/terrain/materials/TerrainWetness.glsl (snippet)\r\n// inputs: baseColor, roughness, normal\r\nuniform sampler2D uWetTex; // R wetness\r\nuniform vec3 uWetDarken;   // e.g. (0.22,0.18,0.12)\r\nuniform float uWetRoughnessMin; // e.g. 0.12\r\nuniform float uWetSpecBoost;    // e.g. 0.25\r\n\r\nfloat wet = texture2D(uWetTex, vUvWaterDomain).r; // same domain UV mapping for shoreline area\r\n\r\n// Darken toward wet color\r\nbaseColor = mix(baseColor, baseColor * (1.0 - uWetDarken), wet);\r\n\r\n// Reduce roughness (more sheen)\r\nroughness = mix(roughness, min(roughness, uWetRoughnessMin), wet);\r\n\r\n// Optional: boost spec intensity (if you have spec/metal workflow)\r\nspecular = specular + uWetSpecBoost * wet;\r\n\r\n// Micro-normal: add subtle ripples only where wet (separate from main waves!)\r\nnormal = normalize(mix(normal, perturbWetMicroNormal(normal), wet));\r\n\r\n5) Validation checklist\r\nVisual sweeps (shoreline must read real)\r\n\r\nSwash band: a thin, dynamic foam line appears at the edge and retreats/advances smoothly.\r\n\r\nWet sand: darkening + sheen persists briefly after water leaves (hysteresis), then dries.\r\n\r\nOcean vs lake vs river:\r\n\r\nlake: wetness changes but little directional streaking\r\n\r\nriver: wetness + foam streaks align with flow\r\n\r\nocean: foam band aligns with wave-driven runup\r\n\r\nPerf / no-stall\r\n\r\nNo readbacks.\r\n\r\nRT tiers: shoreRes=256/512 gated by distance tier.\r\n\r\nPass gating: if shoreline not in view (or camera far), skip SIM.SHORE.*.\r\n\r\nRegression safety\r\n\r\nIf terrainHeightTex absent → disable shoreline system (wetness = 0).\r\n\r\nIf SF/flow missing → foam band deposits only from wetness (still stable).\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n1) What we’re changing\r\n\r\nWe’re adding a nearshore Swash solver (runup + backwash) that produces film thickness + along-slope velocity + wetness memory + foam deposit in one GPU state texture.\r\n\r\nWe’re replacing the “shoreline foam band = wetness * band” hack with physics-shaped motion: wave impulse pushes water upslope, gravity + friction pulls it downslope, and the film advects along the shoreline normal.\r\n\r\nWe’re keeping it GPU-only, LOD-capped, no-stall and explicitly registered as SIM.SWASH.UPDATE.\r\n\r\n2) Why\r\n\r\nThe shoreline “truth” isn’t just coverage; it’s runup/backwash dynamics:\r\n\r\nthe wet band advances with incoming waves, then retreats as backwash\r\n\r\nfoam appears as a moving front with shear, not a static ring\r\n\r\nwet sand has memory (hysteresis), not frame-to-frame toggling\r\n\r\nThis gives you a unified solution for ocean / lake / river edges:\r\n\r\nocean: driven by η̇ + wave direction (SF1)\r\n\r\nriver: driven by flow velocity\r\n\r\nlake: weak periodic drive (η̇ small), mostly gravity/friction\r\n\r\n3) Implementation steps\r\n\r\nKeep SIM.SHORE.CONTACT as-is (cover + band + slope proxy).\r\n\r\nAdd a single Swash state RT:\r\nSHORE.swashTex RGBA = (h_film_m, u_alongN_mps, wetness01, foamDeposit01)\r\n\r\nImplement SIM.SWASH.UPDATE (one fullscreen pass) that:\r\n\r\ncomputes shoreline normal n_uphill from terrain height gradient\r\n\r\nbuilds 2D velocity v = u * n_uphill\r\n\r\nsemi-Lagrangian advects (h, u) by v (stable, CFL-friendly)\r\n\r\napplies forces:\r\n\r\nwave impulse (ocean): +k * max(0,η̇) * max(0, dot(F, n_uphill)) * band\r\n\r\nflow impulse (river): +kFlow * dot(flow, n_uphill)\r\n\r\ngravity pullback: -g * slope * dt\r\n\r\nfriction: u *= exp(-c_f * dt)\r\n\r\nupdates wetness hysteresis from film thickness + cover\r\n\r\nupdates foamDeposit from shear |u| near shoreline band\r\n\r\nTerrain shading uses wetness (B) and foamDeposit (A) directly.\r\n\r\nWater/foam injection uses foamDeposit to seed FoamField near shore (cheap and coherent).\r\n\r\nLOD caps:\r\n\r\nswashResTier 256/512 near-only\r\n\r\nskip pass if shoreline band not visible or if bandMax is low (CPU-side camera heuristics, no readback)\r\n\r\n4) Code\r\n4.1 New pass registration (explicit)\r\n{ id:\"SIM.SWASH.UPDATE\", phase:\"SIM\", flag:\"swash\", deps:[\"SIM.SHORE.CONTACT\"], produces:[\"SHORE.swashTex\"], costTags:[\"fsPass\",\"rtSwash\"] },\r\n{ id:\"RENDER.TERRAIN.WETNESS_APPLY\", phase:\"RENDER\", flag:\"swash\", deps:[\"SIM.SWASH.UPDATE\"], produces:[\"TERRAIN.shaded\"], costTags:[\"terrain\"] },\r\n\r\n4.2 Swash system (TS)\r\n\r\nwater-showcase-unified/src/engines/oceansimv1/shore/SwashSystem.ts\r\n\r\nimport * as THREE from \"three\";\r\nimport { FullscreenPass } from \"../render/FullscreenPass\";\r\n\r\nexport class SwashSystem {\r\n  swashA: THREE.WebGLRenderTarget; // RGBA: h,u,wet,foam\r\n  swashB: THREE.WebGLRenderTarget;\r\n\r\n  private pass: FullscreenPass;\r\n\r\n  constructor(private gl: THREE.WebGLRenderer, res = 512) {\r\n    const opts: THREE.WebGLRenderTargetOptions = {\r\n      type: THREE.HalfFloatType,\r\n      format: THREE.RGBAFormat,\r\n      depthBuffer: false,\r\n      stencilBuffer: false,\r\n      minFilter: THREE.LinearFilter,\r\n      magFilter: THREE.LinearFilter,\r\n    };\r\n    this.swashA = new THREE.WebGLRenderTarget(res, res, opts);\r\n    this.swashB = new THREE.WebGLRenderTarget(res, res, opts);\r\n\r\n    this.pass = new FullscreenPass(new THREE.ShaderMaterial({\r\n      vertexShader: VS,\r\n      fragmentShader: SWASH_UPDATE_FRAG,\r\n      uniforms: {\r\n        uSwashPrev: { value: this.swashA.texture },\r\n        uContact: { value: null as unknown as THREE.Texture },   // R cover, G band01, B slopeProxy\r\n        uTerrainH: { value: null as unknown as THREE.Texture },  // R height (m)\r\n\r\n        // Ocean drive\r\n        uWaterInfo: { value: null as unknown as THREE.Texture }, // r=eta, g=etaDotProxy\r\n        uSF1: { value: null as unknown as THREE.Texture },       // RG packed F\r\n        uUseOceanDrive: { value: 1 },\r\n\r\n        // River drive (optional)\r\n        uFlow: { value: null as unknown as THREE.Texture },      // RG flow (m/s) or packed\r\n        uUseFlow: { value: 0 },\r\n\r\n        uDomainSize: { value: new THREE.Vector2(1, 1) },\r\n        uDt: { value: 1/60 },\r\n\r\n        // Physics knobs (scene-scaled)\r\n        uG: { value: 9.81 },\r\n        uFriction: { value: 2.2 },         // 1/s\r\n        uInfiltration: { value: 0.45 },    // 1/s (kills thin film over time)\r\n        uCoverFillRate: { value: 0.12 },   // m/s source when covered (caps)\r\n        uFilmCapM: { value: 0.12 },        // max film thickness (m)\r\n\r\n        // Ocean impulse\r\n        uWaveImpulseGain: { value: 0.55 }, // scales η̇-driven runup\r\n        uEtaDotScale: { value: 1.0 },      // converts info.g to m/s if needed\r\n\r\n        // Wetness + foam\r\n        uWetRefM: { value: 0.02 },         // thickness that maps to wet=1\r\n        uWetDryPerSec: { value: 0.18 },\r\n        uFoamDepositGain: { value: 0.55 },\r\n        uFoamDecayPerSec: { value: 0.85 },\r\n\r\n        // Stability clamps\r\n        uUMax: { value: 8.0 },             // m/s\r\n      },\r\n      depthTest:false,\r\n      depthWrite:false,\r\n    }));\r\n  }\r\n\r\n  update(args: {\r\n    contactTex: THREE.Texture;\r\n    terrainHeightTex: THREE.Texture;\r\n    waterInfoTex: THREE.Texture;\r\n    sf1Tex: THREE.Texture;\r\n    domainSize: THREE.Vector2;\r\n    dt: number;\r\n\r\n    flowTex?: THREE.Texture;\r\n\r\n    // knobs\r\n    useOceanDrive: boolean;\r\n    waveImpulseGain: number;\r\n  }) {\r\n    const u = this.pass.mat.uniforms;\r\n    u.uSwashPrev.value = this.swashA.texture;\r\n    u.uContact.value = args.contactTex;\r\n    u.uTerrainH.value = args.terrainHeightTex;\r\n\r\n    u.uWaterInfo.value = args.waterInfoTex;\r\n    u.uSF1.value = args.sf1Tex;\r\n    u.uUseOceanDrive.value = args.useOceanDrive ? 1 : 0;\r\n\r\n    if (args.flowTex) { u.uFlow.value = args.flowTex; u.uUseFlow.value = 1; }\r\n    else { u.uUseFlow.value = 0; }\r\n\r\n    u.uDomainSize.value.copy(args.domainSize);\r\n    u.uDt.value = args.dt;\r\n    u.uWaveImpulseGain.value = args.waveImpulseGain;\r\n\r\n    this.pass.render(this.gl, this.swashB);\r\n    this.swap();\r\n  }\r\n\r\n  private swap() {\r\n    const t = this.swashA; this.swashA = this.swashB; this.swashB = t;\r\n  }\r\n}\r\n\r\nconst VS = /* glsl */`\r\nvarying vec2 vUv;\r\nvoid main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }\r\n`;\r\n\r\n4.3 Swash update shader (GLSL)\r\n\r\nSWASH_UPDATE_FRAG (single-pass “thin film” SWE proxy)\r\n\r\nprecision highp float;\r\nvarying vec2 vUv;\r\n\r\nuniform sampler2D uSwashPrev; // RGBA: h,u,wet,foam\r\nuniform sampler2D uContact;   // R cover, G band01, B slopeProxy\r\nuniform sampler2D uTerrainH;  // R terrain height (m)\r\n\r\nuniform sampler2D uWaterInfo; // r=eta, g=etaDotProxy\r\nuniform sampler2D uSF1;       // RG packed wave dir\r\nuniform int uUseOceanDrive;\r\n\r\nuniform sampler2D uFlow;      // optional flow (m/s)\r\nuniform int uUseFlow;\r\n\r\nuniform vec2 uDomainSize;\r\nuniform float uDt;\r\n\r\nuniform float uG;\r\nuniform float uFriction;\r\nuniform float uInfiltration;\r\nuniform float uCoverFillRate;\r\nuniform float uFilmCapM;\r\n\r\nuniform float uWaveImpulseGain;\r\nuniform float uEtaDotScale;\r\n\r\nuniform float uWetRefM;\r\nuniform float uWetDryPerSec;\r\nuniform float uFoamDepositGain;\r\nuniform float uFoamDecayPerSec;\r\n\r\nuniform float uUMax;\r\n\r\nfloat sat(float x){ return clamp(x,0.0,1.0); }\r\n\r\nvec2 decodeDir(vec2 rg){\r\n  vec2 d = rg * 2.0 - 1.0;\r\n  return d / max(1e-4, length(d));\r\n}\r\n\r\nvec2 texel() {\r\n  // MV: assume 512; pass exact if you want\r\n  return vec2(1.0/512.0, 1.0/512.0);\r\n}\r\n\r\nvoid main(){\r\n  vec4 c = texture2D(uContact, vUv);\r\n  float cover = c.r;\r\n  float band  = c.g;\r\n  // slopeProxy available as c.b, but we compute slope more consistently from terrain gradient\r\n\r\n  vec4 prev = texture2D(uSwashPrev, vUv);\r\n  float hPrev   = prev.r; // film thickness (m)\r\n  float uPrev   = prev.g; // m/s along n_uphill (positive inland)\r\n  float wetPrev = prev.b; // 0..1\r\n  float foamPrev= prev.a; // 0..1\r\n\r\n  // Terrain gradient -> n_uphill in xz (UV space proxy)\r\n  vec2 ts = texel();\r\n  float hL = texture2D(uTerrainH, vUv - vec2(ts.x, 0.0)).r;\r\n  float hR = texture2D(uTerrainH, vUv + vec2(ts.x, 0.0)).r;\r\n  float hD = texture2D(uTerrainH, vUv - vec2(0.0, ts.y)).r;\r\n  float hU = texture2D(uTerrainH, vUv + vec2(0.0, ts.y)).r;\r\n\r\n  // dh/dx, dh/dz in meters per uv-step; scale to meters per meter is messy—use as directional guide\r\n  vec2 grad = vec2(hR - hL, hU - hD);\r\n  vec2 nUv = grad / max(1e-4, length(grad)); // points uphill in UV coordinates\r\n\r\n  // Convert along-n velocity into a UV advection vector:\r\n  // v_world ≈ u * n_world; but we only have nUv, so treat u as driving UV advection scaled by domainSize.\r\n  vec2 vUvAdv = (uPrev * nUv * uDt) / max(vec2(1e-3), uDomainSize);\r\n\r\n  // Semi-Lagrangian backtrace\r\n  vec2 uv0 = vUv - vUvAdv;\r\n  vec4 adv = texture2D(uSwashPrev, uv0);\r\n  float h = adv.r;\r\n  float u = adv.g;\r\n  float wet = adv.b;\r\n  float foam = adv.a;\r\n\r\n  // Gravity wants to push film downslope: u += -g*slope*dt\r\n  // slope magnitude proxy from terrain gradient\r\n  float slope = sat(length(grad) * 40.0); // tune factor for your terrain scale\r\n  u += (-uG * slope) * uDt;\r\n\r\n  // Ocean impulse: incoming wave pushes upslope\r\n  if (uUseOceanDrive == 1) {\r\n    float etaDot = texture2D(uWaterInfo, vUv).g * uEtaDotScale; // m/s-ish\r\n    vec2 F = decodeDir(texture2D(uSF1, vUv).rg);\r\n    float hit = sat(dot(F, nUv));        // wave heading inland\r\n    float push = max(0.0, etaDot) * hit; // only rising / incoming\r\n    u += uWaveImpulseGain * push * band * uDt;\r\n  }\r\n\r\n  // River impulse: flow can wet banks / drive along nUv (optional)\r\n  if (uUseFlow == 1) {\r\n    vec2 flow = texture2D(uFlow, vUv).rg; // assume m/s in uv axes\r\n    u += 0.6 * dot(flow, nUv) * band * uDt;\r\n  }\r\n\r\n  // Friction (exponential decay)\r\n  u *= exp(-uFriction * uDt);\r\n  u = clamp(u, -uUMax, uUMax);\r\n\r\n  // Film thickness sources/sinks\r\n  // - when covered: fill toward cap\r\n  // - when uncovered: infiltrate/evaporate\r\n  h += cover * uCoverFillRate * uDt;\r\n  h *= exp(-uInfiltration * (1.0 - cover) * uDt);\r\n  h = clamp(h, 0.0, uFilmCapM);\r\n\r\n  // Gate swash to shoreline region (avoid “film everywhere”)\r\n  float gate = sat((band - 0.05) * 8.0); // only in band\r\n  h *= gate;\r\n  u *= mix(0.2, 1.0, gate);\r\n\r\n  // Wetness hysteresis from film + cover\r\n  float wetFromFilm = sat(h / max(1e-4, uWetRefM));\r\n  wet = max(wet * exp(-uWetDryPerSec * (1.0 - cover) * uDt), wetFromFilm);\r\n  wet = clamp(wet, 0.0, 1.0);\r\n\r\n  // Foam deposit from shear (|u|) in the band, decays over time\r\n  foam *= exp(-uFoamDecayPerSec * uDt);\r\n  float shear = abs(u);\r\n  foam += uFoamDepositGain * shear * wet * band * uDt;\r\n  foam = clamp(foam, 0.0, 1.0);\r\n\r\n  gl_FragColor = vec4(h, u, wet, foam);\r\n}\r\n\r\n\r\nNotes (by design):\r\n\r\nThis is a stable “thin film” model (semi-Lagrangian) rather than a full SWE Riemann solver.\r\n\r\nIt produces the right cinematic cues: runup, retreat, wetness memory, foam at the moving front.\r\n\r\nIt stays bounded and cheap (one fullscreen pass).\r\n\r\n4.4 Using swash outputs\r\n\r\nTerrain shading:\r\n\r\nwetness = swashTex.b\r\n\r\nfoam deposit (shore foam line) = swashTex.a\r\n\r\nWater foam injection (optional, cheap bridge):\r\n\r\nin your FoamField.injectFromEBT, add a second injector that splats from shoreline foamDeposit (A) near shore.\r\n\r\n5) Validation checklist\r\nVisual sweeps\r\n\r\nRunup/backwash: the wet band and foam line visibly advance, then recede (not just flicker).\r\n\r\nSlope dependence: steeper beaches show faster retreat; shallow beaches show longer runup linger.\r\n\r\nOcean vs river\r\n\r\nocean: runup responds to incoming crests (η̇ and F alignment)\r\n\r\nriver: bank wetting aligns with flow and is steadier\r\n\r\nNo category mistake: shoreline micro ripples (terrain wet micro-normal) stay separate from main waves.\r\n\r\nPerf / no-stall\r\n\r\nNo GPU readbacks.\r\n\r\nOnly one new SIM pass (SIM.SWASH.UPDATE) and it is LOD-gated.\r\n\r\nRT tier: 256/512; skip when far.\r\n\r\nRegression safety\r\n\r\nIf uSF1 missing: set uUseOceanDrive=0 and rely on gravity/cover (still stable).\r\n\r\nIf terrain height missing: disable swash system (wetness=0, foamDeposit=0).\r\n\r\n6) Telemetry/debug views added\r\n\r\nDEBUG.SWASH_H (R = film thickness meters)\r\n\r\nDEBUG.SWASH_U (G = velocity along shore-normal, signed)\r\n\r\nDEBUG.SWASH_WET (B = wetness)\r\n\r\nDEBUG.SWASH_FOAM (A = foamDeposit)\r\n\r\nDEBUG.SHORE_NORMAL (optional: visualize nUv direction field)\r\n\r\nL0 counters:\r\n\r\nswashPassEnabled, swashResTier\r\n\r\nswashOceanDriveOn, swashFlowDriveOn\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n1) What we’re changing\r\n\r\nWe’re introducing a single WaterTypeProfile system that drives everything (surface dynamics, optics, foam/spray/bubbles/SSA, shoreline swash) for oceans / lakes / rivers / puddles—one codepath, different profiles.\r\n\r\nWe’re adding a WaterType blending mechanism so you can smoothly transition (river→estuary→ocean, lake→shore, puddle→wet ground) without seams:\r\n\r\neither via a weight map texture (GPU sampled)\r\n\r\nor per-waterbody assignment (single profile per domain)\r\n\r\nWe’re wiring profiles into the existing Shared Lighting + Genesis pipeline without breaking the drift rules:\r\n\r\nGenesis stays the driver for breach/splash spawn (SF/EBT); profiles only modulate appearance + secondary lifecycles + flow coupling.\r\n\r\n2) Why\r\n\r\n“Water” isn’t one thing: rivers are advective + directional, lakes are bounded + standing waves, oceans are multi-scale + wind seas + breakers, puddles are thin-film + surface tension dominated.\r\n\r\nIf you treat these as separate engines, you’ll get inconsistent optics, foam truth duplication, and broken LOD budgets.\r\n\r\nA profile system gives you:\r\n\r\nauthoring clarity (“this is a muddy river, fast flow”)\r\n\r\nrender consistency (same IOR / Fresnel / Beer–Lambert pipeline)\r\n\r\nperf control (each type has caps + pass schedule rules)\r\n\r\n3) Implementation steps\r\n\r\nCreate WaterTypeProfile with five subprofiles:\r\n\r\nSurfaceProfile (waves/flow/bounds/damping)\r\n\r\nOpticsProfile (IOR, absorption/scatter, g, foam tint, refraction strength)\r\n\r\nSecondaryFXProfile (foam/spray/bubbles/SSA banks + budgets)\r\n\r\nShoreProfile (swash parameters, wetness response, foam band behavior)\r\n\r\nLODProfile (RT tiers + pass enable rules)\r\n\r\nAdd a WaterTypeRegistry and ship canonical profiles:\r\n\r\nOCEAN_DEEP_CLEAR, OCEAN_COASTAL_GREEN\r\n\r\nLAKE_CLEAR, LAKE_MURKY\r\n\r\nRIVER_CLEAR_FAST, RIVER_MUDDY_SLOW\r\n\r\nPUDDLE_THIN_FILM\r\n\r\nAdd a GPU-friendly blending interface:\r\n\r\nuWaterTypeParams[] arrays (packed vec4s)\r\n\r\noptional uWaterTypeWeightMap sampled in water shaders/passes\r\n\r\nUpdate all systems to pull parameters from one function:\r\n\r\nresolveWaterParams(uv/worldXZ) -> {optics, fx, shore, ...}\r\n\r\nAdd debug:\r\n\r\nDEBUG.WATER_TYPE_ID/WEIGHTS\r\n\r\nDEBUG.OPTICS_COEFFS (σa/σs/g)\r\n\r\nDEBUG.FX_BUDGETS_BY_TYPE\r\n\r\n4) Code\r\n4.1 src/water/types/WaterTypeProfile.ts\r\nimport * as THREE from \"three\";\r\n\r\nexport type WaterTypeId =\r\n  | \"OCEAN_DEEP_CLEAR\"\r\n  | \"OCEAN_COASTAL_GREEN\"\r\n  | \"LAKE_CLEAR\"\r\n  | \"LAKE_MURKY\"\r\n  | \"RIVER_CLEAR_FAST\"\r\n  | \"RIVER_MUDDY_SLOW\"\r\n  | \"PUDDLE_THIN_FILM\";\r\n\r\nexport interface SurfaceProfile {\r\n  // “Big” surface behavior (heightfield driver selection)\r\n  mode: \"OCEAN_WAVES\" | \"LAKE_BOUNDED\" | \"RIVER_FLOW\" | \"THIN_FILM\";\r\n\r\n  // Energy/damping (does NOT change genesis; it changes base heightfield & flow coupling)\r\n  swellEnergy01: number;\r\n  chopEnergy01: number;\r\n  dampingPerSec: number;\r\n\r\n  // Flow coupling (rivers) in m/s; lakes/ocean can have mild currents\r\n  flowSpeedMps: number;\r\n  flowDirXZ: THREE.Vector2;\r\n\r\n  // Boundary behavior (lakes)\r\n  boundary: \"OPEN\" | \"CLOSED\";\r\n}\r\n\r\nexport interface OpticsProfile {\r\n  ior: number; // usually 1.333\r\n\r\n  // Per-meter coefficients for Beer–Lambert / underwater volume\r\n  absorptionRGB: THREE.Vector3; // σa [1/m]\r\n  scatteringRGB: THREE.Vector3; // σs [1/m]\r\n  gHG: number;                  // 0..0.95\r\n\r\n  // Surface look\r\n  refractionStrength: number;\r\n  roughnessWater: number;\r\n  foamTint: THREE.Color;\r\n  foamRoughness: number;\r\n}\r\n\r\nexport interface SecondaryFXProfile {\r\n  // Multipliers that scale the banks you already built\r\n  foamPersistence: number;  // higher -> slower decay\r\n  sprayAmount: number;      // scales spray quotas + brightness\r\n  bubbleAmount: number;     // scales bubble inject + haze\r\n  ssaAmount: number;        // sea-surface aerosol amount\r\n\r\n  // Hard caps by type (LOD policy)\r\n  maxSprayDraw: number;\r\n  foamRes: 256 | 512 | 1024;\r\n  bubbleRes: 256 | 512;\r\n  ssaRes: 256 | 512;\r\n}\r\n\r\nexport interface ShoreProfile {\r\n  // Swash solver knobs (thin film)\r\n  swashEnabled: boolean;\r\n  swashBandMeters: number;\r\n  waveImpulseGain: number;\r\n  friction: number;\r\n  infiltration: number;\r\n  wetDryPerSec: number;\r\n  foamDepositGain: number;\r\n}\r\n\r\nexport interface LODProfile {\r\n  // Per type scheduling: what to disable as distance grows\r\n  enableUnderwater: boolean;\r\n  enableCaustics: boolean;\r\n  enableSprayLighting: boolean;\r\n  enableSSA: boolean;\r\n}\r\n\r\nexport interface WaterTypeProfile {\r\n  id: WaterTypeId;\r\n  surface: SurfaceProfile;\r\n  optics: OpticsProfile;\r\n  fx: SecondaryFXProfile;\r\n  shore: ShoreProfile;\r\n  lod: LODProfile;\r\n}\r\n\r\n4.2 src/water/types/WaterTypeRegistry.ts (canonical profiles)\r\n\r\nThese numbers are engine-authored starting points (units are consistent: σ in 1/m).\r\n\r\nimport * as THREE from \"three\";\r\nimport type { WaterTypeProfile, WaterTypeId } from \"./WaterTypeProfile\";\r\n\r\nconst v3 = (r:number,g:number,b:number)=> new THREE.Vector3(r,g,b);\r\nconst c3 = (r:number,g:number,b:number)=> new THREE.Color(r,g,b);\r\n\r\nexport const WATER_TYPES: Record<WaterTypeId, WaterTypeProfile> = {\r\n  OCEAN_DEEP_CLEAR: {\r\n    id: \"OCEAN_DEEP_CLEAR\",\r\n    surface: {\r\n      mode: \"OCEAN_WAVES\",\r\n      swellEnergy01: 0.85,\r\n      chopEnergy01: 0.35,\r\n      dampingPerSec: 0.04,\r\n      flowSpeedMps: 0.3,\r\n      flowDirXZ: new THREE.Vector2(1, 0),\r\n      boundary: \"OPEN\",\r\n    },\r\n    optics: {\r\n      ior: 1.333,\r\n      absorptionRGB: v3(0.18, 0.06, 0.02),\r\n      scatteringRGB: v3(0.02, 0.03, 0.04),\r\n      gHG: 0.80,\r\n      refractionStrength: 0.030,\r\n      roughnessWater: 0.02,\r\n      foamTint: c3(0.95, 0.98, 1.00),\r\n      foamRoughness: 0.35,\r\n    },\r\n    fx: {\r\n      foamPersistence: 1.0,\r\n      sprayAmount: 1.0,\r\n      bubbleAmount: 0.8,\r\n      ssaAmount: 0.9,\r\n      maxSprayDraw: 262144,\r\n      foamRes: 512,\r\n      bubbleRes: 512,\r\n      ssaRes: 512,\r\n    },\r\n    shore: {\r\n      swashEnabled: true,\r\n      swashBandMeters: 3.0,\r\n      waveImpulseGain: 0.55,\r\n      friction: 2.2,\r\n      infiltration: 0.45,\r\n      wetDryPerSec: 0.18,\r\n      foamDepositGain: 0.55,\r\n    },\r\n    lod: {\r\n      enableUnderwater: true,\r\n      enableCaustics: true,\r\n      enableSprayLighting: true,\r\n      enableSSA: true,\r\n    },\r\n  },\r\n\r\n  OCEAN_COASTAL_GREEN: {\r\n    id: \"OCEAN_COASTAL_GREEN\",\r\n    surface: {\r\n      mode: \"OCEAN_WAVES\",\r\n      swellEnergy01: 0.75,\r\n      chopEnergy01: 0.45,\r\n      dampingPerSec: 0.06,\r\n      flowSpeedMps: 0.4,\r\n      flowDirXZ: new THREE.Vector2(0.8, 0.2),\r\n      boundary: \"OPEN\",\r\n    },\r\n    optics: {\r\n      ior: 1.333,\r\n      // more particulate: higher σs and slightly higher σa\r\n      absorptionRGB: v3(0.25, 0.10, 0.05),\r\n      scatteringRGB: v3(0.06, 0.08, 0.10),\r\n      gHG: 0.85,\r\n      refractionStrength: 0.028,\r\n      roughnessWater: 0.03,\r\n      foamTint: c3(0.94, 0.98, 1.00),\r\n      foamRoughness: 0.38,\r\n    },\r\n    fx: {\r\n      foamPersistence: 1.15,\r\n      sprayAmount: 1.1,\r\n      bubbleAmount: 1.0,\r\n      ssaAmount: 1.0,\r\n      maxSprayDraw: 196608,\r\n      foamRes: 512,\r\n      bubbleRes: 512,\r\n      ssaRes: 512,\r\n    },\r\n    shore: {\r\n      swashEnabled: true,\r\n      swashBandMeters: 3.5,\r\n      waveImpulseGain: 0.65,\r\n      friction: 2.4,\r\n      infiltration: 0.40,\r\n      wetDryPerSec: 0.20,\r\n      foamDepositGain: 0.65,\r\n    },\r\n    lod: { enableUnderwater: true, enableCaustics: true, enableSprayLighting: true, enableSSA: true },\r\n  },\r\n\r\n  LAKE_CLEAR: {\r\n    id: \"LAKE_CLEAR\",\r\n    surface: {\r\n      mode: \"LAKE_BOUNDED\",\r\n      swellEnergy01: 0.25,\r\n      chopEnergy01: 0.20,\r\n      dampingPerSec: 0.10,\r\n      flowSpeedMps: 0.05,\r\n      flowDirXZ: new THREE.Vector2(1, 0),\r\n      boundary: \"CLOSED\",\r\n    },\r\n    optics: {\r\n      ior: 1.333,\r\n      absorptionRGB: v3(0.20, 0.08, 0.03),\r\n      scatteringRGB: v3(0.03, 0.04, 0.05),\r\n      gHG: 0.80,\r\n      refractionStrength: 0.020,\r\n      roughnessWater: 0.015,\r\n      foamTint: c3(0.97, 0.99, 1.00),\r\n      foamRoughness: 0.30,\r\n    },\r\n    fx: {\r\n      foamPersistence: 0.75,\r\n      sprayAmount: 0.35,\r\n      bubbleAmount: 0.35,\r\n      ssaAmount: 0.20,\r\n      maxSprayDraw: 65536,\r\n      foamRes: 256,\r\n      bubbleRes: 256,\r\n      ssaRes: 256,\r\n    },\r\n    shore: {\r\n      swashEnabled: true,\r\n      swashBandMeters: 2.0,\r\n      waveImpulseGain: 0.18,\r\n      friction: 2.8,\r\n      infiltration: 0.55,\r\n      wetDryPerSec: 0.25,\r\n      foamDepositGain: 0.20,\r\n    },\r\n    lod: { enableUnderwater: true, enableCaustics: true, enableSprayLighting: false, enableSSA: false },\r\n  },\r\n\r\n  LAKE_MURKY: {\r\n    id: \"LAKE_MURKY\",\r\n    surface: {\r\n      mode: \"LAKE_BOUNDED\",\r\n      swellEnergy01: 0.20,\r\n      chopEnergy01: 0.18,\r\n      dampingPerSec: 0.12,\r\n      flowSpeedMps: 0.06,\r\n      flowDirXZ: new THREE.Vector2(1, 0),\r\n      boundary: \"CLOSED\",\r\n    },\r\n    optics: {\r\n      ior: 1.333,\r\n      absorptionRGB: v3(0.35, 0.22, 0.12),\r\n      scatteringRGB: v3(0.10, 0.12, 0.14),\r\n      gHG: 0.88,\r\n      refractionStrength: 0.018,\r\n      roughnessWater: 0.02,\r\n      foamTint: c3(0.95, 0.98, 1.0),\r\n      foamRoughness: 0.34,\r\n    },\r\n    fx: {\r\n      foamPersistence: 0.85,\r\n      sprayAmount: 0.25,\r\n      bubbleAmount: 0.55,\r\n      ssaAmount: 0.10,\r\n      maxSprayDraw: 32768,\r\n      foamRes: 256,\r\n      bubbleRes: 256,\r\n      ssaRes: 256,\r\n    },\r\n    shore: {\r\n      swashEnabled: true,\r\n      swashBandMeters: 2.2,\r\n      waveImpulseGain: 0.16,\r\n      friction: 3.0,\r\n      infiltration: 0.60,\r\n      wetDryPerSec: 0.28,\r\n      foamDepositGain: 0.18,\r\n    },\r\n    lod: { enableUnderwater: true, enableCaustics: false, enableSprayLighting: false, enableSSA: false },\r\n  },\r\n\r\n  RIVER_CLEAR_FAST: {\r\n    id: \"RIVER_CLEAR_FAST\",\r\n    surface: {\r\n      mode: \"RIVER_FLOW\",\r\n      swellEnergy01: 0.05,\r\n      chopEnergy01: 0.20,      // ripples from flow/rocks, not ocean chop injection\r\n      dampingPerSec: 0.14,\r\n      flowSpeedMps: 1.8,\r\n      flowDirXZ: new THREE.Vector2(1, 0),\r\n      boundary: \"OPEN\",\r\n    },\r\n    optics: {\r\n      ior: 1.333,\r\n      absorptionRGB: v3(0.22, 0.12, 0.06),\r\n      scatteringRGB: v3(0.05, 0.06, 0.07),\r\n      gHG: 0.82,\r\n      refractionStrength: 0.024,\r\n      roughnessWater: 0.02,\r\n      foamTint: c3(0.96, 0.99, 1.0),\r\n      foamRoughness: 0.32,\r\n    },\r\n    fx: {\r\n      foamPersistence: 0.90,\r\n      sprayAmount: 0.25,\r\n      bubbleAmount: 0.30,\r\n      ssaAmount: 0.05,\r\n      maxSprayDraw: 32768,\r\n      foamRes: 256,\r\n      bubbleRes: 256,\r\n      ssaRes: 256,\r\n    },\r\n    shore: {\r\n      swashEnabled: true,\r\n      swashBandMeters: 1.6,\r\n      waveImpulseGain: 0.00,   // use flow drive instead\r\n      friction: 3.2,\r\n      infiltration: 0.70,\r\n      wetDryPerSec: 0.22,\r\n      foamDepositGain: 0.25,\r\n    },\r\n    lod: { enableUnderwater: true, enableCaustics: true, enableSprayLighting: false, enableSSA: false },\r\n  },\r\n\r\n  RIVER_MUDDY_SLOW: {\r\n    id: \"RIVER_MUDDY_SLOW\",\r\n    surface: {\r\n      mode: \"RIVER_FLOW\",\r\n      swellEnergy01: 0.02,\r\n      chopEnergy01: 0.12,\r\n      dampingPerSec: 0.18,\r\n      flowSpeedMps: 0.7,\r\n      flowDirXZ: new THREE.Vector2(1, 0),\r\n      boundary: \"OPEN\",\r\n    },\r\n    optics: {\r\n      ior: 1.333,\r\n      absorptionRGB: v3(0.55, 0.40, 0.26),\r\n      scatteringRGB: v3(0.18, 0.20, 0.22),\r\n      gHG: 0.90,\r\n      refractionStrength: 0.020,\r\n      roughnessWater: 0.03,\r\n      foamTint: c3(0.94, 0.97, 1.0),\r\n      foamRoughness: 0.36,\r\n    },\r\n    fx: {\r\n      foamPersistence: 0.75,\r\n      sprayAmount: 0.10,\r\n      bubbleAmount: 0.45,\r\n      ssaAmount: 0.02,\r\n      maxSprayDraw: 16384,\r\n      foamRes: 256,\r\n      bubbleRes: 256,\r\n      ssaRes: 256,\r\n    },\r\n    shore: {\r\n      swashEnabled: true,\r\n      swashBandMeters: 1.8,\r\n      waveImpulseGain: 0.00,\r\n      friction: 3.6,\r\n      infiltration: 0.80,\r\n      wetDryPerSec: 0.24,\r\n      foamDepositGain: 0.18,\r\n    },\r\n    lod: { enableUnderwater: true, enableCaustics: false, enableSprayLighting: false, enableSSA: false },\r\n  },\r\n\r\n  PUDDLE_THIN_FILM: {\r\n    id: \"PUDDLE_THIN_FILM\",\r\n    surface: {\r\n      mode: \"THIN_FILM\",\r\n      swellEnergy01: 0.00,\r\n      chopEnergy01: 0.06,\r\n      dampingPerSec: 0.35,\r\n      flowSpeedMps: 0.0,\r\n      flowDirXZ: new THREE.Vector2(1, 0),\r\n      boundary: \"CLOSED\",\r\n    },\r\n    optics: {\r\n      ior: 1.333,\r\n      absorptionRGB: v3(0.10, 0.06, 0.04),\r\n      scatteringRGB: v3(0.01, 0.01, 0.01),\r\n      gHG: 0.75,\r\n      refractionStrength: 0.010,\r\n      roughnessWater: 0.01,\r\n      foamTint: c3(0.98, 0.99, 1.0),\r\n      foamRoughness: 0.25,\r\n    },\r\n    fx: {\r\n      foamPersistence: 0.30,\r\n      sprayAmount: 0.00,\r\n      bubbleAmount: 0.05,\r\n      ssaAmount: 0.00,\r\n      maxSprayDraw: 0,\r\n      foamRes: 256,\r\n      bubbleRes: 256,\r\n      ssaRes: 256,\r\n    },\r\n    shore: {\r\n      swashEnabled: false,\r\n      swashBandMeters: 0.8,\r\n      waveImpulseGain: 0.0,\r\n      friction: 6.0,\r\n      infiltration: 1.4,\r\n      wetDryPerSec: 0.35,\r\n      foamDepositGain: 0.0,\r\n    },\r\n    lod: { enableUnderwater: false, enableCaustics: false, enableSprayLighting: false, enableSSA: false },\r\n  },\r\n};\r\n\r\nexport function getWaterType(id: WaterTypeId) {\r\n  const t = WATER_TYPES[id];\r\n  if (!t) throw new Error(`Unknown WaterTypeId: ${id}`);\r\n  return t;\r\n}\r\n\r\n4.3 Optional blending: Weight map + packed uniforms\r\nWeight map convention (GPU)\r\n\r\nuWaterTypeWeightMap RGBA = weights for 4 active types in this scene patch.\r\n\r\nuActiveTypeIds[4] tells which profiles correspond to RGBA channels.\r\n\r\nsrc/water/types/WaterTypePacking.ts\r\nimport type { WaterTypeProfile } from \"./WaterTypeProfile\";\r\n\r\nexport interface PackedWaterTypeParams {\r\n  // Each array is float[16] = vec4[4] flattened (4 active types)\r\n  opticsA: number[]; // (σa.r, σa.g, σa.b, ior)\r\n  opticsS: number[]; // (σs.r, σs.g, σs.b, g)\r\n  surf:   number[];  // (refractionStrength, roughnessWater, foamRoughness, _)\r\n  foam:   number[];  // (foamTint.r, foamTint.g, foamTint.b, foamPersistence)\r\n  fxCaps: number[];  // (sprayAmount, bubbleAmount, ssaAmount, maxSprayDrawNorm)\r\n}\r\n\r\nexport function pack4(types: WaterTypeProfile[], maxSprayDrawRef = 262144): PackedWaterTypeParams {\r\n  if (types.length !== 4) throw new Error(\"pack4 requires exactly 4 active types\");\r\n\r\n  const opticsA:number[] = [];\r\n  const opticsS:number[] = [];\r\n  const surf:number[] = [];\r\n  const foam:number[] = [];\r\n  const fxCaps:number[] = [];\r\n\r\n  for (const t of types) {\r\n    opticsA.push(t.optics.absorptionRGB.x, t.optics.absorptionRGB.y, t.optics.absorptionRGB.z, t.optics.ior);\r\n    opticsS.push(t.optics.scatteringRGB.x, t.optics.scatteringRGB.y, t.optics.scatteringRGB.z, t.optics.gHG);\r\n    surf.push(t.optics.refractionStrength, t.optics.roughnessWater, t.optics.foamRoughness, 0);\r\n\r\n    foam.push(t.optics.foamTint.r, t.optics.foamTint.g, t.optics.foamTint.b, t.fx.foamPersistence);\r\n\r\n    const sprayNorm = Math.min(1, t.fx.maxSprayDraw / maxSprayDrawRef);\r\n    fxCaps.push(t.fx.sprayAmount, t.fx.bubbleAmount, t.fx.ssaAmount, sprayNorm);\r\n  }\r\n\r\n  return { opticsA, opticsS, surf, foam, fxCaps };\r\n}\r\n\r\nShader-side resolver (GLSL snippet)\r\nuniform sampler2D uWaterTypeWeightMap; // RGBA weights\r\nuniform float uOpticsA4[16]; // vec4[4] flattened\r\nuniform float uOpticsS4[16];\r\nuniform float uSurf4[16];\r\nuniform float uFoam4[16];\r\nuniform float uFxCaps4[16];\r\n\r\nvec4 load4(const float a[16], int idx){\r\n  int o = idx * 4;\r\n  return vec4(a[o+0], a[o+1], a[o+2], a[o+3]);\r\n}\r\n\r\nvoid resolveParams(vec2 uv, out vec3 sigmaA, out vec3 sigmaS, out float ior, out float gHG, out vec3 foamTint){\r\n  vec4 w = texture2D(uWaterTypeWeightMap, uv);\r\n  float s = w.r + w.g + w.b + w.a;\r\n  w = (s > 1e-4) ? (w / s) : vec4(1.0,0.0,0.0,0.0);\r\n\r\n  vec4 A0 = load4(uOpticsA4, 0);\r\n  vec4 A1 = load4(uOpticsA4, 1);\r\n  vec4 A2 = load4(uOpticsA4, 2);\r\n  vec4 A3 = load4(uOpticsA4, 3);\r\n\r\n  vec4 S0 = load4(uOpticsS4, 0);\r\n  vec4 S1 = load4(uOpticsS4, 1);\r\n  vec4 S2 = load4(uOpticsS4, 2);\r\n  vec4 S3 = load4(uOpticsS4, 3);\r\n\r\n  vec4 F0 = load4(uFoam4, 0);\r\n  vec4 F1 = load4(uFoam4, 1);\r\n  vec4 F2 = load4(uFoam4, 2);\r\n  vec4 F3 = load4(uFoam4, 3);\r\n\r\n  vec4 A = w.r*A0 + w.g*A1 + w.b*A2 + w.a*A3;\r\n  vec4 S = w.r*S0 + w.g*S1 + w.b*S2 + w.a*S3;\r\n  vec4 F = w.r*F0 + w.g*F1 + w.b*F2 + w.a*F3;\r\n\r\n  sigmaA = A.rgb; ior = A.a;\r\n  sigmaS = S.rgb; gHG = S.a;\r\n  foamTint = F.rgb;\r\n}\r\n\r\n\r\nThis gives you smooth biome transitions with no branchy “if ocean then …”.\r\n\r\n4.4 How profiles connect to your existing systems (one truth)\r\n\r\nSharedWaterLighting comes from OpticsProfile (σa/σs/g/ior).\r\n\r\nFoam/spray/bubbles/SSA systems take type multipliers + caps from SecondaryFXProfile.\r\n\r\nShore swash uses ShoreProfile.\r\n\r\nGenesis/breach stays driven by SF/EBT; you can optionally choose a GenesisPreset bank per WaterTypeId (surf vs river impact vs puddle splash), but don’t tune feedback here.\r\n\r\n5) Validation checklist\r\nVisual sweeps\r\n\r\nOcean→coastal transition:\r\n\r\nunderwater gets greener/milkier (σs up, σa up), caustics soften, foam persists more near shore.\r\n\r\nRiver:\r\n\r\nsurface is directional/advective; chop looks like flow ripples (not ocean swell).\r\n\r\nbanks wet correctly; minimal spray lighting.\r\n\r\nLake:\r\n\r\ncalmer surface; bounded feel; caustics visible in clear lake, not in murky.\r\n\r\nPuddle:\r\n\r\nthin refraction, minimal volume fog; no ocean-style spray.\r\n\r\nPerf / no-stall\r\n\r\nWeight-map blending adds one texture sample and a few vec4 mixes—cheap.\r\n\r\nCaps apply correctly:\r\n\r\nspray draw count clamps by type\r\n\r\nfoam/bubble/ssa RT tiers obey profile and distance LOD\r\n\r\nRegression safety\r\n\r\nIf no weight map, fall back to a single active type (w = (1,0,0,0)).\r\n\r\nIf a type is missing, default to OCEAN_DEEP_CLEAR (safe) and log once.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nRIVERS:\r\n1) What we’re changing (to absorb the article’s ideas)\r\n\r\nAdd a River/Rapids surface stack: (Flow Field → Surface Detail Waves → Foam/Scum Advection → Rapids spray triggers).\r\n\r\nTreat “river motion” as a 2D velocity field problem first (with vortices + obstacles), and only then layer wave detail + shading.\r\n\r\nAdopt “no-UV” or “multi-phase UV” strategies for advected detail to avoid visible pulsing/restart artifacts.\r\n\r\nThis dovetails with our existing hybrid plan (multi-scale base + localized high-fidelity detail) .\r\n\r\n2) What the River Editor article is saying (distilled)\r\nA) Wave Particles = “stacked moving wavelets” as surface detail\r\n\r\nGrenier’s key observation: a lot of convincing complexity appears if you layer many simple traveling “wave particles” on the surface. He found this intuitive to author and visually strong.\r\n\r\nThat’s grounded in Yuksel et al.’s method: wave particles are an unconditionally stable way to evolve surface waves, aert particles → heightfield** (plus horizontal warping for local wave-induced flow).\r\n\r\nEngine takeaway: this is a detail-wave generator for rivers/rapids that can sit on top of our base water surface without requiring expensive 3D fluids.\r\n\r\nB) The “vector field” is the heart of the river look (vortices matter)\r\n\r\nGrenier tried:\r\n\r\nDistance-field / flow-map style (Portal 2 lineage) but notes it doesn’t naturally create vortices.\r\n\r\nStable fluids (Eulerian Navier–Stokes advection) for richer behavior.\r\n\r\nThen lands on Lattice Boltzmann (LBM) because it parallelizes well on GPU and captures vorticity nicely; he also notes LBM can be used toward shallow-water style behaviors.\r\n\r\nHe calls out the main drawback: memory teaches you humility (D2Q9 = 9 components, ping-pong doubles it).\r\n\r\nEngine takeaway: for rivers, don’t start with “ocean spectrum.” Start with a 2D flow solver / flow bake, because that’s what produces the characteristic swirling + streaking + curling foam.\r\n\r\nC) Foam advection is worth it; advecting height/normals tends to “pulse”\r\n\r\nGrenier advects:\r\n\r\nfoam amount + two UV sets (and blends between them as stretching grows).\r\nHe explicitly reports that advecting wave height + normals produced an “annoying pulsing.”\r\n\r\nThis mirrors older flow-map practice (two-phase / noise-masked repetition management). Portal 2’s talk literally names pulsing + repetition as the core problems and shows a two-layer phased solution with noise.\r\n\r\nMore advanced fix direction:\r\n\r\nNeyret-style “advected textures” family (multi-coordinate sets / distortion minimization) is one line of attack (Grenier references it).\r\n\r\nYu et al. propose Lagrangian texture advection to preserve spectral properties while following the velocity field locally.\r\n\r\nA river-specific survey thread: Advected River Textures summarizes limitations/tradeoffs for large-scale rivers.\r\n\r\nEngine takeaway: advect foam/scum and maybe streak normals, but be cautious about fully advecting heightfields. Prefer procedural wave detail that doesn’t depend on UV stretching.\r\n\r\nD) “Wave Profile Buffers / wavelets” = coherent detail without UV stretching\r\n\r\nGrenier’s “aha” moment: Wave Profile Buffers (from Jeschke’s SIGGRAPH 2018-era work) avoid UV tearing because sampling uses world position + time + direction, not advection UVs.\r\n\r\nRelated published direction (ISTA “Water Surface Wavelets” page): it reframes wave simulation in variables that change more slowly than height, easing CFL/Nyquist constraints and supporting large domains + obstacles + art control.\r\n\r\nEngine takeaway: for high-frequency detail on rivers/ocean, “profile/wavelet” approaches are extremely attractive as a detail-normal/displacement source.\r\n\r\nE) Lighting: “standard spec + cheap volumetric scattering trick”\r\n\r\nGrenier describes:\r\n\r\nSpecular as environment (cubemap from atmosphere shader).\r\n\r\nA volumetric scattering approximation: treat average incoming luminance as two “infinite planes” (top/sky tinted and bottom/ground tinted with depth extinction), using exponential integral approximations (credited to patapom).\r\n\r\nExtra tip scattering at grazing sun angles by refracting to sky luminance.\r\n\r\nEngine takeaway: this is a great production-friendly underwater/riverbody scattering hack: controllable, cheap, and visually plausible.\r\n\r\n3) How we fold this into our water engine (small, shippable increments)\r\nIncrement 1 — RiverFlowField (runtime or baked)\r\n\r\nGoal: a 2D velocity texture V(x,z) + derived vorticity ω + optionally depth/obstacle mask.\r\n\r\nH0 path: baked flow map + authored vortices (cheap, stable).\r\n\r\nH1 path: low-res runtime solver (Stable Fluids or LBM) only in near/mid tiles.\r\n\r\nH2 path: higher-res + obstacle coupling (still 2D).\r\n\r\nNo-stall contract: all sampling stays on GPU; no per-frame readbacks.\r\n\r\nIncrement 2 — Surface detail layer: WaveParticles or Wavelet/Profile detail\r\n\r\nTwo viable “River Editor–style” options:\r\n\r\nWaveParticles detail (fast to prototype): spawn/advect a set of wavelets along V(x,z), sum into a displacement/normal RT.\r\n\r\nWavelet/Profile detail (higher ceiling): a “no-UV” micro detail normal/displacement source (especially good for avoiding pulsing).\r\n\r\nIncrement 3 — Foam/scum advection (the high ROI layer)\r\n\r\nMaintain a foam density field F(x,z) advected by V:\r\n\r\n𝐹\r\n𝑡\r\n+\r\nΔ\r\n𝑡\r\n(\r\n𝑥\r\n)\r\n=\r\n𝐹\r\n𝑡\r\n(\r\n𝑥\r\n−\r\nΔ\r\n𝑡\r\n \r\n𝑉\r\n(\r\n𝑥\r\n)\r\n)\r\n⋅\r\n𝑒\r\n−\r\nΔ\r\n𝑡\r\n/\r\n𝜏\r\n+\r\n𝑆\r\n(\r\n𝑥\r\n)\r\nF\r\nt+Δt\r\n\t​\r\n\r\n(x)=F\r\nt\r\n\t​\r\n\r\n(x−ΔtV(x))⋅e\r\n−Δt/τ\r\n+S(x)\r\n\r\nWhere S(x) is injection from curvature/velocity/shear/obstacles.\r\n\r\nUse either:\r\n\r\nTwo-phase UV blending (Portal 2 style) to suppress restart/pulsing.\r\n\r\nOr Lagrangian-style advection if we ever need higher fidelity (more complex).\r\n\r\nIncrement 4 — Rapids spray triggers (bridge to our Splash/MPM layer)\r\n\r\nUse the flow + surface metrics to emit “breach/splash” events at:\r\n\r\nobstacle impact zones (high |∇V|, high ω, high speed into obstacle normal),\r\n\r\nhydraulic jumps / steep gradients,\r\n\r\ncresting regions (if we have local height detail).\r\n\r\nThis aligns with “Uncharted 4 rapids” thinking: deconstruct motion into inexpensive procedural components + offline-informed flow.\r\n\r\n4) Code skeleton (TS/R3F + GLSL), with file boundaries\r\nsrc/water/river/RiverFlowField.ts\r\nexport type RiverFlowFieldConfig = {\r\n  simRes: number;          // e.g. 256 (near tiles), 128 (mid)\r\n  dt: number;              // fixed step\r\n  iterations: number;      // solver steps per tick\r\n  useRuntimeSolve: boolean;// else baked textures\r\n};\r\n\r\nexport class RiverFlowField {\r\n  // ping/pong velocity + aux (foam, vorticity, etc.)\r\n  readonly texVel: [WebGLTexture, WebGLTexture];\r\n  readonly texFoam: [WebGLTexture, WebGLTexture];\r\n\r\n  constructor(private gl: WebGL2RenderingContext, private cfg: RiverFlowFieldConfig) {}\r\n\r\n  stepFixed(): void {\r\n    if (!this.cfg.useRuntimeSolve) return;\r\n    // run N iterations: advect + project (or LBM collide/stream)\r\n    // IMPORTANT: no readbacks; render-to-texture fullscreen passes only\r\n  }\r\n}\r\n\r\nsrc/water/river/shaders/foamAdvect.frag\r\n// Inputs: velTex (RG = velocity), foamTex (R = foam density)\r\nvec2 v = texture(uVelTex, uv).rg;\r\nvec2 prevUV = uv - uDt * v * uTexelScale;   // uTexelScale maps world->uv\r\nfloat F = texture(uFoamTex, prevUV).r;\r\nF *= exp(-uDt / uFoamHalfLife);\r\nF += uInject * injectionMask(uv);           // obstacles/rapids injection\r\noutColor = vec4(F, 0.0, 0.0, 1.0);\r\n\r\nsrc/water/river/shaders/riverScatter.glsl\r\n\r\nUse the “two planes” idea Grenier references (top/sky + bottom/ground with extinction) as a cheap volumetric term.\r\n\r\n5) Validation checklist (River Editor features → our gates)\r\nVisual sweeps\r\n\r\nVortices around obstacles (rocks, banks): do we get curling foam streaks?\r\n\r\nNo “pulsing” in advected detail: especially normals/foam patterns.\r\n\r\nRapids readability: do we see coherent streaklines + turbulent foam bands?\r\n\r\nPerf / no-stall\r\n\r\nVerify zero synchronous readback in the river loop.\r\n\r\nMeasure passes/frame (flow solve + foam advect + detail synthesis).\r\n\r\nHard caps: max tiles simulated, max iterations, max wave particles.\r\n\r\nRegression safety\r\n\r\nToggle: river.flowMode = baked | runtime\r\n\r\nToggle: river.detailMode = waveParticles | waveletProfile | off\r\n\r\nToggle: foam.advection = on/off\r\n\r\n6) Telemetry / debug views to add\r\n\r\nFlow vectors (L1 overlay): arrows or hue-encoded direction + speed.\r\n\r\nVorticity ω heatmap (where rapids “live”).\r\n\r\nFoam density F with decay/injection visualization.\r\n\r\nTile LOD state (which tiles are simulated vs baked).\r\n\r\nBest follow-up links to research (high leverage)\r\n\r\nThese are the “next clicks” implied by the River Editor post:\r\n\r\nWave Particles (method + GPU heightfield conversion).\r\n\r\nWater Surface Wavelets / profile-buffer direction (no-UV coherent detail + obstacles).\r\n\r\nPortal 2 Water Flow (practical flowmap authoring + repetition/pulsing fixes).\r\n\r\nLattice Boltzmann for shallow water (if we choose LBM runtime solves).\r\n\r\nLagrangian Texture Advection (if we need higher-end advection).\r\n\r\nAdvected River Textures (river-specific constraints + survey of approaches).\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n## 1) What we’re changing\r\n\r\n* Add a **River/Rapids water type** built around **(Flow field → Foam advection → No-UV surface detail → Rapids spray triggers)**.\r\n* Implement the **two core “River Editor” insights**:\r\n\r\n  1. **vorticity-rich flow** is what makes rivers look alive (not ocean spectra) ([80.lv][1])\r\n  2. **advect foam, not height/normals**; use **no-UV detail** (profile buffers / wavelets) to avoid pulsing/tearing ([80.lv][1])\r\n* Add the **cheap volumetric scattering trick** (two “imaginary planes” + exponential-integral approximation) into our river shader ([80.lv][1])\r\n\r\n---\r\n\r\n## 2) Why\r\n\r\nGrenier’s article is basically a production blueprint:\r\n\r\n* **Surface complexity from stacking wave particles** is visually powerful and intuitive ([80.lv][1])\r\n* For motion, flowmaps alone struggle to produce **interesting vortices**, so he moves from flowmaps → stable fluids → **LBM** for strong vorticity (GPU-friendly but memory-hungry) ([80.lv][1])\r\n* He explicitly says: **advecting height + normals produced “annoying pulsing”**, while he successfully advects **foam amount + 2 UV sets** (blended) ([80.lv][1])\r\n* He adopts **Wave Profile Buffers / Wavelets** because they are **world-pos + time + direction** (no UV), giving coherent detail with no stretching/tearing ([80.lv][1])\r\n* For lighting, he uses a **standard spec term** and a cheap **volume scattering approximation** with two planes + Ei approximation ([80.lv][1])\r\n\r\nSo our engine should treat rivers as **a flow-driven phenomenon** with **persistent foam** and **coherent micro-detail**, and only then connect to Splash/spray.\r\n\r\n---\r\n\r\n## 3) Implementation steps (small, shippable increments)\r\n\r\n### R0 — Baked flow field (MV, no extra passes)\r\n\r\n**Goal:** ship rivers with believable motion fast.\r\n\r\n* Inputs per river tile:\r\n\r\n  * `VelTex`: RG = velocity in world XZ (m/s), B = depth proxy, A = mask\r\n  * `ObstacleTex` (optional): banks/rocks\r\n* Provide a RiverEditor authoring path (offline, Houdini or tooling) like Portal’s flowmap pipeline \r\n* **Gate:** flow debug overlay shows coherent direction + speed; foam streaks follow.\r\n\r\n### R1 — Foam RT advection (persistent, bounded)\r\n\r\n**Goal:** foam/scum streaklines that **stick and advect**.\r\n\r\n* Ping-pong `FoamRT` (R16F): scalar density `F`\r\n* Semi-Lagrangian advection:\r\n  [\r\n  F^{n+1}(x)=F^n(x-\\Delta t,v(x)),e^{-\\Delta t/\\tau} + \\Delta t,S(x)\r\n  ]\r\n* Inject `S(x)` from:\r\n\r\n  * speed threshold\r\n  * vorticity / shear around obstacles\r\n* **Gate:** no pulsing; foam forms persistent streaks.\r\n\r\n### R2 — No-UV surface detail (profile/wavelet micro-displacement)\r\n\r\n**Goal:** “alive surface” without UV stretching.\r\n\r\n* Implement **profile-buffer style sampling** (world pos + time + direction) as the primary river micro-normal source ([80.lv][1])\r\n* Use **flow direction** as the dominant wave direction; add a small angular spread.\r\n\r\n**Gate:** detail stays coherent even in high vorticity; no UV tearing.\r\n\r\n### R3 — Rapids spray triggers → our existing EBT pipeline\r\n\r\n**Goal:** connect river turbulence to Splash without stalls.\r\n\r\n* Compute trigger scalars (GPU):\r\n\r\n  * speed (|v|)\r\n  * vorticity (\\omega = \\partial v_z/\\partial x - \\partial v_x/\\partial z)\r\n  * shear (|\\nabla v|)\r\n* Emit EBT events from rapids zones (high (|v|), high (|\\omega|), obstacle impacts), with genesis velocities taken from flow direction.\r\n\r\n**Gate:** rapids produce localized spray/sheet bursts that inherit flow, not random.\r\n\r\n### R4 (optional) — Runtime solver tiles (H1/H2)\r\n\r\nIf we want interactive rocks/boats to perturb flow like Grenier’s demo:\r\n\r\n* Start with **Stable Fluids tiles** (cheaper), upgrade to **LBM tiles** later (vorticity-rich but heavy memory) ([80.lv][1])\r\n\r\n---\r\n\r\n## 4) Code (TS/R3F + GLSL) — file boundaries\r\n\r\n### `src/water/river/RiverSystem.ts`\r\n\r\n```ts\r\nexport type RiverBudgets = {\r\n  foamResNear: number;     // e.g. 256\r\n  foamResMid: number;      // e.g. 128\r\n  foamHz: number;          // e.g. 30 (fixed tick)\r\n  maxTilesNear: number;    // hard cap\r\n};\r\n\r\nexport type RiverInputs = {\r\n  velTex: THREE.Texture;        // RG=velXZ (m/s), B=depth, A=mask\r\n  obstacleTex?: THREE.Texture;  // R=solid mask\r\n  domainMinXZ: THREE.Vector2;\r\n  domainSizeXZ: THREE.Vector2;\r\n};\r\n\r\nexport class RiverSystem {\r\n  readonly foam: RiverFoamSim;\r\n  readonly material: THREE.ShaderMaterial;\r\n\r\n  constructor(gl: THREE.WebGLRenderer, budgets: RiverBudgets, inputs: RiverInputs) {\r\n    this.foam = new RiverFoamSim(gl, budgets, inputs);\r\n    this.material = makeRiverMaterial(inputs, this.foam);\r\n  }\r\n\r\n  stepFixed(dt: number, timeSec: number) {\r\n    this.foam.stepFixed(dt, timeSec);\r\n  }\r\n}\r\n```\r\n\r\n### `src/water/river/RiverFoamSim.ts` (no-stall ping-pong)\r\n\r\n```ts\r\nexport class RiverFoamSim {\r\n  rtA: THREE.WebGLRenderTarget;\r\n  rtB: THREE.WebGLRenderTarget;\r\n  active = 0;\r\n\r\n  private advectPass = new RiverFoamAdvectPass();\r\n  private injectPass = new RiverFoamInjectPass();\r\n\r\n  constructor(private gl: THREE.WebGLRenderer, private budgets: any, private inputs: any) {\r\n    const res = budgets.foamResNear;\r\n    this.rtA = makeR16FRT(res);\r\n    this.rtB = makeR16FRT(res);\r\n  }\r\n\r\n  get tex(): THREE.Texture {\r\n    return (this.active === 0 ? this.rtA.texture : this.rtB.texture);\r\n  }\r\n\r\n  stepFixed(dt: number, timeSec: number) {\r\n    const src = this.active === 0 ? this.rtA : this.rtB;\r\n    const dst = this.active === 0 ? this.rtB : this.rtA;\r\n\r\n    // Pass 1: advect + decay\r\n    this.advectPass.run(this.gl, {\r\n      srcFoam: src.texture,\r\n      velTex: this.inputs.velTex,\r\n      obstacleTex: this.inputs.obstacleTex,\r\n      dt,\r\n      tau: 2.5,\r\n      domainMinXZ: this.inputs.domainMinXZ,\r\n      domainSizeXZ: this.inputs.domainSizeXZ,\r\n    }, dst);\r\n\r\n    // Pass 2: inject rapids foam (optional / cheap)\r\n    this.injectPass.run(this.gl, {\r\n      srcFoam: dst.texture,\r\n      velTex: this.inputs.velTex,\r\n      obstacleTex: this.inputs.obstacleTex,\r\n      dt,\r\n    }, dst);\r\n\r\n    this.active = 1 - this.active;\r\n  }\r\n}\r\n```\r\n\r\n### `src/water/river/shaders/foamAdvect.frag`\r\n\r\n```glsl\r\n// R16F foam density\r\nuniform sampler2D uSrcFoam;\r\nuniform sampler2D uVelTex;      // RG vel (m/s), A mask\r\nuniform sampler2D uObstacleTex; // optional\r\n\r\nuniform float uDt;\r\nuniform float uTau;\r\nuniform vec2 uDomainMin;\r\nuniform vec2 uDomainSize;\r\n\r\nvarying vec2 vUv;\r\n\r\nvec2 velAt(vec2 uv){\r\n  vec4 v = texture2D(uVelTex, uv);\r\n  return v.rg; // m/s in world XZ\r\n}\r\n\r\nvoid main(){\r\n  // world step in UV units\r\n  vec2 v = velAt(vUv);\r\n  vec2 duv = (uDt * v) / max(vec2(1e-3), uDomainSize); // convert m -> uv\r\n  vec2 prevUv = vUv - duv;\r\n\r\n  float F = texture2D(uSrcFoam, prevUv).r;\r\n\r\n  // decay\r\n  F *= exp(-uDt / max(1e-3, uTau));\r\n\r\n  // obstacle damping (cheap)\r\n  #ifdef USE_OBS\r\n    float solid = texture2D(uObstacleTex, vUv).r;\r\n    F *= (1.0 - solid);\r\n  #endif\r\n\r\n  gl_FragColor = vec4(F,0.0,0.0,1.0);\r\n}\r\n```\r\n\r\n### River micro-detail: profile-buffer style sampling (no UV)\r\n\r\nThis mirrors Grenier’s “world position, time, direction” claim ([80.lv][1]) :\r\n\r\n`src/water/river/shaders/profileDetail.glsl`\r\n\r\n```glsl\r\nuniform sampler2D uProfile1D; // 1D profile packed in a 2D texture row\r\n\r\n// phase in [0,1)\r\nfloat sampleProfile(float phase){\r\n  return texture2D(uProfile1D, vec2(phase, 0.5)).r * 2.0 - 1.0;\r\n}\r\n\r\nfloat waveDetail(vec2 xz, vec2 dir, float lambda, float speed, float t){\r\n  float k = 1.0 / lambda;\r\n  float phase = fract(k * dot(dir, xz) - (speed * k) * t);\r\n  return sampleProfile(phase);\r\n}\r\n```\r\n\r\n### River shading: add the “two planes” scattering term\r\n\r\nGrenier’s exact structure (TopPlane/BottomPlane, Ei approximation) is in the article ([80.lv][1]) . We’ll port it into our water material as `ComputeAmbientColor()` and then add a small “tip boost” at grazing sun angles (also described) ([80.lv][1]) .\r\n\r\n---\r\n\r\n## 5) Validation checklist\r\n\r\n### Visual sweeps\r\n\r\n* Flow vectors create **vortices around obstacles** (even with baked textures, you should *see* curling foam).\r\n* Foam **persists and advects**; doesn’t pulse like advected heights/normals ([80.lv][1])\r\n* Micro detail stays coherent (no UV tearing) thanks to profile/wavelet sampling ([80.lv][1])\r\n* Lighting: spec + volume term reads as “water volume,” not flat plastic ([80.lv][1])\r\n\r\n### Perf / no-stall\r\n\r\n* All steps are render-to-texture; **no synchronous readbacks**.\r\n* Hard caps: tiles simulated, foam RT res, update Hz.\r\n\r\n### Regression toggles\r\n\r\n* `river.foam.enabled`\r\n* `river.detail.mode = off | profile | waveParticles`\r\n* `river.spray.enabled` (EBT emission)\r\n\r\n---\r\n\r\n## 6) Telemetry / debug views added\r\n\r\n* `DEBUG.RIVER_FLOW`: direction hue + speed value from `VelTex`\r\n* `DEBUG.RIVER_FOAM`: foam density RT\r\n* `DEBUG.RIVER_VORTICITY`: ω heatmap (derived in shader)\r\n* `DEBUG.RIVER_DETAIL`: profile/wavelet contribution\r\n\r\n---\r\n\r\n## Research threads worth pulling next (directly implied by the article)\r\n\r\n* Grenier’s full “River Editor” breakdown (wave particles + LBM + foam advection + profile buffers + lighting) ([80.lv][1])\r\n* Valve’s “Water Flow in Portal 2” (two-layer blending + noise to solve pulsing/repetition) \r\n* **Water Surface Wavelets** (the wavelet/profile-buffer direction formalized, obstacles + large domains) ([Visual Computing][2])\r\n* Wave Particles implementation sketch (fast, stable surface waves; supports interactions) ([history.siggraph.org][3])\r\n* Lagrangian Texture Advection (high-quality, but can be expensive due to splatting/overdraw — exactly the caveat Grenier hints at) ([PubMed][4])\r\n\r\nIf you “proceed” again, I’ll lock **one concrete MV milestone** (baked flow + foam RT + profile-detail + scattering) and map it to **exact render passes + budgets + presets** so it drops into our existing engine without pass creep.\r\n\r\n[1]: https://80.lv/articles/river-editor-water-simulation-in-real-time \"River Editor: Water Simulation in Real-Time\"\r\n[2]: https://visualcomputing.ist.ac.at/publications/2018/WSW/ \"ISTA Visual Computing\"\r\n[3]: https://history.siggraph.org/learning/implementing-wave-particles-for-real-time-water-waves-with-object-interaction-by-yuksel-house-and-keyser-2/ \"“Implementing wave particles for real-time water waves with object interaction” by Yuksel, House and Keyser – ACM SIGGRAPH HISTORY ARCHIVES\"\r\n[4]: https://pubmed.ncbi.nlm.nih.gov/21149889/?utm_source=chatgpt.com \"Lagrangian Texture Advection: Preserving Both Spectrum ...\"\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n1) What we’re changing\r\n\r\nWe’re locking a single MV River/Rapids milestone: Baked Velocity Field → Foam RT Advection → No-UV Surface Detail (Profile Buffers/Wavelets) → Cheap Volume Scattering, with strict budgets and no new readbacks.\r\n\r\nWe’re defining the exact render passes (and when they run), the RT formats, and the scene presets so this drops into the engine without pass creep.\r\n\r\nThis MV is directly aligned with Grenier’s “River Editor” pipeline: wave particles as a surface-detail idea, LBM/solver for vector field (we’ll start baked), advect foam + UV sets (we’ll advect foam only in MV), avoid pulsing from advected heights/normals, and use profile buffers for coherent no-UV detail + a cheap scattering approximation.\r\n\r\n2) Why\r\n\r\nRivers ≠ oceans: the “river look” comes from flow + vortices + advected foam streaks, not deep-water spectra. Grenier explicitly rejects pure flowmap approaches for lacking vortices and builds the system around a richer vector field.\r\n\r\nAdvecting height/normals pulses (he shows the artifact); foam advection is the high-ROI layer.\r\n\r\nProfile buffers / wavelets give coherent detail without UV stretching (world position + time + direction), which is exactly what we want for rapids.\r\n\r\n3) Implementation steps (MV scope, shippable)\r\nStep R-MV0 — Data contract (baked assets)\r\n\r\nTextures per river tile (or per river VT page):\r\n\r\nVelTex RG16F: velocity in world XZ (m/s), packed as (vx, vz)\r\n\r\nAuxTex RGBA8 (optional, cheap):\r\n\r\nA: wetted mask / channel mask\r\n\r\nB: depth proxy (0..1) or separate DepthTex R16F if needed\r\n\r\nMapping uniforms:\r\n\r\nuDomainMinXZ, uDomainSizeXZ (meters)\r\n\r\nuVelScale (if authoring in normalized units)\r\n\r\nStep R-MV1 — Foam sim (2 passes, throttled Hz, per-tile)\r\n\r\nPasses (per simulated tile update):\r\n\r\nRIVER_FOAM_ADVECT (fullscreen RT): semi-Lagrangian advect + exponential decay\r\n\r\nRIVER_FOAM_INJECT (fullscreen RT): inject foam from speed/vorticity/obstacles\r\n\r\nUpdate frequency:\r\n\r\nNear tiles: 30 Hz fixed tick (decoupled from render delta)\r\n\r\nMid tiles: 15 Hz\r\n\r\nFar: off (use static foam/noise)\r\n\r\nStep R-MV2 — No-UV surface detail (0 passes)\r\n\r\nIn the river material, add a profile-buffer / wavelet micro-normal term:\r\n\r\nsample using worldXZ, time, and local flow direction from VelTex\r\n\r\nno UV advection → no pulsing/tearing (matches Grenier’s adoption of profile buffers).\r\n\r\nStep R-MV3 — Cheap volume scattering (0 passes)\r\n\r\nIn the river material, add the “two infinite planes + Ei approximation” scattering term (Grenier cites Patapom and provides code).\r\n\r\nStep R-MV4 — Optional rapids → Splash bridge (reuses EBT, no stalls)\r\n\r\nCompute a RapidsScore (GPU) from |v|, |∇×v| (vorticity), obstacle proximity\r\n\r\nFeed that into the same EBT top-K + NMS event path we already built (just swap SF score → rapids score)\r\n\r\nMLS init velocities inherit flow direction instead of wave F\r\n\r\n(We can ship this as off-by-default in MV if you want the river layer first.)\r\n\r\n4) Exact pass budget + RT specs (the “no pass creep” contract)\r\nPer simulated tile (Near)\r\n\r\nRTs\r\n\r\nFoamRT: R16F, res 256×256, ping-pong (2 RTs)\r\n\r\nPasses\r\n\r\nRIVER_FOAM_ADVECT: 1 pass @ 30 Hz\r\n\r\nRIVER_FOAM_INJECT: 1 pass @ 30 Hz\r\n\r\nShader cost\r\n\r\nAdvect: 2 texture reads (Foam + Vel) + a few ALU\r\n\r\nInject: Vel reads + ddx/ddy for vorticity (or finite differences)\r\n\r\nMid\r\n\r\n128×128, same two passes @ 15 Hz\r\n\r\nFar\r\n\r\nNo sim passes. Material uses baked foam mask + procedural noise only.\r\n\r\nThis keeps river simulation strictly bounded and independent of Splash/MLS.\r\n\r\n5) Code (TS/R3F + GLSL) with file boundaries\r\n5.1 src/water/river/RiverBudgets.ts\r\nexport type RiverBudgets = {\r\n  nearRes: number;      // 256\r\n  midRes: number;       // 128\r\n  nearHz: number;       // 30\r\n  midHz: number;        // 15\r\n  maxNearTiles: number; // e.g. 6\r\n  maxMidTiles: number;  // e.g. 12\r\n};\r\n\r\n5.2 src/water/river/RiverTileSim.ts (2-pass foam ping-pong, throttled)\r\nimport * as THREE from \"three\";\r\n\r\nexport class RiverTileSim {\r\n  private a: THREE.WebGLRenderTarget;\r\n  private b: THREE.WebGLRenderTarget;\r\n  private ping = 0;\r\n\r\n  constructor(\r\n    private gl: THREE.WebGLRenderer,\r\n    private res: number,\r\n    private advectPass: RiverFoamAdvectPass,\r\n    private injectPass: RiverFoamInjectPass\r\n  ) {\r\n    const opts: THREE.WebGLRenderTargetOptions = {\r\n      type: THREE.HalfFloatType,\r\n      format: THREE.RedFormat,\r\n      depthBuffer: false,\r\n      stencilBuffer: false,\r\n      minFilter: THREE.LinearFilter,\r\n      magFilter: THREE.LinearFilter,\r\n    };\r\n    this.a = new THREE.WebGLRenderTarget(res, res, opts);\r\n    this.b = new THREE.WebGLRenderTarget(res, res, opts);\r\n  }\r\n\r\n  get foamTex(): THREE.Texture {\r\n    return (this.ping === 0 ? this.a.texture : this.b.texture);\r\n  }\r\n\r\n  step(dt: number, args: {\r\n    velTex: THREE.Texture;\r\n    obstacleTex?: THREE.Texture;\r\n    domainMinXZ: THREE.Vector2;\r\n    domainSizeXZ: THREE.Vector2;\r\n    tau: number;\r\n    injectStrength: number;\r\n  }) {\r\n    const src = this.ping === 0 ? this.a : this.b;\r\n    const dst = this.ping === 0 ? this.b : this.a;\r\n\r\n    this.advectPass.run(this.gl, { ...args, srcFoam: src.texture, dt }, dst);\r\n    this.injectPass.run(this.gl, { ...args, srcFoam: dst.texture, dt }, dst);\r\n\r\n    this.ping = 1 - this.ping;\r\n  }\r\n}\r\n\r\n5.3 src/water/river/hooks/useRiverSystem.ts (LOD + fixed tick scheduling)\r\nimport { useMemo, useRef } from \"react\";\r\nimport * as THREE from \"three\";\r\n\r\nexport function useRiverSystem(gl: THREE.WebGLRenderer, budgets: any) {\r\n  const clockAccNear = useRef(0);\r\n  const clockAccMid = useRef(0);\r\n\r\n  const advectPass = useMemo(() => new RiverFoamAdvectPass(), []);\r\n  const injectPass = useMemo(() => new RiverFoamInjectPass(), []);\r\n\r\n  // MV: single “hero” tile first, then expand to tiled set\r\n  const nearTile = useMemo(() => new RiverTileSim(gl, budgets.nearRes, advectPass, injectPass), [gl, budgets.nearRes]);\r\n  const midTile  = useMemo(() => new RiverTileSim(gl, budgets.midRes,  advectPass, injectPass), [gl, budgets.midRes]);\r\n\r\n  function step(dtRender: number, inputs: {\r\n    velTex: THREE.Texture;\r\n    obstacleTex?: THREE.Texture;\r\n    domainMinXZ: THREE.Vector2;\r\n    domainSizeXZ: THREE.Vector2;\r\n  }) {\r\n    // fixed ticks\r\n    const nearDt = 1 / budgets.nearHz;\r\n    const midDt  = 1 / budgets.midHz;\r\n\r\n    clockAccNear.current += dtRender;\r\n    while (clockAccNear.current >= nearDt) {\r\n      nearTile.step(nearDt, {\r\n        ...inputs,\r\n        tau: 2.5,\r\n        injectStrength: 1.0,\r\n      });\r\n      clockAccNear.current -= nearDt;\r\n    }\r\n\r\n    clockAccMid.current += dtRender;\r\n    while (clockAccMid.current >= midDt) {\r\n      midTile.step(midDt, {\r\n        ...inputs,\r\n        tau: 3.5,\r\n        injectStrength: 0.7,\r\n      });\r\n      clockAccMid.current -= midDt;\r\n    }\r\n  }\r\n\r\n  return {\r\n    step,\r\n    nearFoamTex: nearTile.foamTex,\r\n    midFoamTex: midTile.foamTex,\r\n  };\r\n}\r\n\r\n5.4 Shaders (key bits)\r\nsrc/water/river/shaders/riverFoamAdvect.frag\r\n\r\nUse semi-Lagrangian advection (Portal 2 also uses flow vectors to scroll/warp, but we’re simulating foam density here).\r\n\r\nuniform sampler2D uSrcFoam;  // R16F\r\nuniform sampler2D uVelTex;   // RG16F: vx,vz in m/s\r\n\r\nuniform float uDt;\r\nuniform float uTau;\r\nuniform vec2  uDomainSizeXZ; // meters\r\n\r\nvarying vec2 vUv;\r\n\r\nvoid main() {\r\n  vec2 v = texture2D(uVelTex, vUv).rg;\r\n  vec2 duv = (uDt * v) / max(uDomainSizeXZ, vec2(1e-3));\r\n  float F = texture2D(uSrcFoam, vUv - duv).r;\r\n  F *= exp(-uDt / max(1e-3, uTau));\r\n  gl_FragColor = vec4(F,0.0,0.0,1.0);\r\n}\r\n\r\nsrc/water/river/shaders/riverFoamInject.frag\r\n\r\nVorticity injection (cheap, local):\r\n\r\nuniform sampler2D uSrcFoam;\r\nuniform sampler2D uVelTex;\r\nuniform float uDt;\r\nuniform float uInjectStrength;\r\n\r\nvarying vec2 vUv;\r\n\r\nvoid main() {\r\n  float F = texture2D(uSrcFoam, vUv).r;\r\n\r\n  vec2 v = texture2D(uVelTex, vUv).rg;\r\n\r\n  // ddx/ddy are fine for full-screen quad in screen space; for strict UV-space,\r\n  // use finite differences with texel offsets.\r\n  float dvzdx = dFdx(v.y);\r\n  float dvxdy = dFdy(v.x);\r\n  float omega = dvzdx - dvxdy;\r\n\r\n  float speed = length(v);\r\n\r\n  float inject = uInjectStrength * smoothstep(0.8, 2.5, speed) * smoothstep(0.2, 1.0, abs(omega));\r\n  F = clamp(F + uDt * inject, 0.0, 1.0);\r\n\r\n  gl_FragColor = vec4(F,0.0,0.0,1.0);\r\n}\r\n\r\nsrc/water/river/shaders/riverMaterial.glsl (profile-buffer / wavelet detail)\r\n\r\nProfile buffers + wavelets are the “no UV pulsing” fix Grenier adopts.\r\n\r\n// sample flow direction\r\nvec2 flowDir(vec2 uv){\r\n  vec2 v = texture(uVelTex, uv).rg;\r\n  float len = max(1e-4, length(v));\r\n  return v / len;\r\n}\r\n\r\n// no-UV coherent micro detail\r\nfloat profileWave(vec2 worldXZ, vec2 dir, float lambda, float speed, float t){\r\n  float k = 1.0 / lambda;\r\n  float phase = fract(k * dot(dir, worldXZ) - (speed * k) * t);\r\n  return texture(uProfileTex, vec2(phase, 0.5)).r * 2.0 - 1.0;\r\n}\r\n\r\nScattering term (two planes + Ei)\r\n\r\nGrenier’s article includes the exact Ei approximation and the top/bottom plane idea; port that directly into the river material.\r\n\r\n5) Scene presets (MV defaults)\r\nSCENE.RIVER.CANAL_MV\r\n\r\nnearRes=256, nearHz=30, tau=2.5, injectStrength=1.0\r\n\r\nProfile detail: lambda=0.20–0.60 m, speed=0.8–1.6 m/s (scaled by |v|)\r\n\r\nScattering: ExtinctionCoeff tuned so shallow reads green/brown, deep reads blue\r\n\r\nSCENE.RIVER.RAPIDS_MV\r\n\r\nSame foam sim, but inject driven harder:\r\n\r\ninjectStrength=1.8, tau=3.0 (foam persists)\r\n\r\nProfile detail: shorter wavelength bias 0.10–0.35 m\r\n\r\n6) Validation checklist\r\nVisual\r\n\r\nFoam forms streaklines that wrap around obstacles and persist (no pulsing).\r\n\r\nMicro detail is coherent (no UV tearing) using profile/wavelet sampling.\r\n\r\nScattering makes water feel volumetric (shallow vs deep color separation).\r\n\r\nPerf / no-stall\r\n\r\nPass count is fixed: 2 passes per simulated tile tick.\r\n\r\nNo GPU readbacks anywhere in the river loop.\r\n\r\nTile caps enforced: maxNearTiles/maxMidTiles.\r\n\r\nRegression toggles\r\n\r\nriver.foam.enabled\r\n\r\nriver.detail.enabled\r\n\r\nriver.scattering.enabled\r\n\r\nriver.simHzScale (debug slow motion)\r\n\r\n7) Telemetry/debug views added\r\n\r\nDEBUG.RIVER_FLOW: arrows/hue for VelTex\r\n\r\nDEBUG.RIVER_FOAM: foam RT visualization\r\n\r\nDEBUG.RIVER_VORTICITY: |ω| heatmap\r\n\r\nDEBUG.RIVER_TILE_LOD: which tiles are active + their Hz/res\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n## 1) What we’re changing\r\n\r\n* Add a **WaveParticles detail layer** as an alternate River detail mode: `detailMode = \"profile\" | \"waveParticles\"`.\r\n* Implement it as a **bounded, GPU-only, no-stall** micro-surface system:\r\n\r\n  * **WP_UPDATE** (particle state ping-pong, fixed Hz)\r\n  * **WP_SPLAT_HEIGHT** (instanced additive splat into a small **DetailHeightRT**)\r\n  * **No extra normal pass**: normals come from sampling the height RT in the river material.\r\n* Wire emission to the same “interesting water” signals the River Editor emphasizes (flow/vorticity/obstacles), while keeping strict caps. ([80.lv][1])\r\n\r\n---\r\n\r\n## 2) Why\r\n\r\n* Grenier’s River Editor explicitly treats **wave particles / wavelets** as the easiest way to get rich surface detail, and notes that **advecting height/normals can pulse**—so we keep advection for foam, and do surface detail as coherent procedural/particle-driven detail. ([80.lv][1])\r\n* Wave Particles (Yuksel et al.) are designed to be **fast and unconditionally stable** for surface waves, which is exactly what we want for a game-ready river micro-layer. ([Cem Yuksel][2])\r\n* This layer complements (not replaces) your profile-buffer/wavelet path; it’s a second option with a different art-control feel. ([pub.ista.ac.at][3])\r\n\r\n---\r\n\r\n## 3) Implementation steps (small, shippable)\r\n\r\n### A) Add the River detail switch + budgets\r\n\r\n1. `RiverDetailMode = \"profile\" | \"waveParticles\" | \"off\"`\r\n2. Budgets (hard caps, MV-safe):\r\n\r\n   * Near tile: `P=4096` particles (64×64)\r\n   * Mid tile: `P=1024` (32×32)\r\n   * DetailHeightRT: `R16F` at `256²` near, `128²` mid\r\n   * Fixed tick: same as foam (30 Hz near / 15 Hz mid)\r\n\r\n### B) Wave particle state ping-pong (WP_UPDATE pass)\r\n\r\n3. Two RTs ping-ponged for particle state:\r\n\r\n   * `StateA (RGBA16F) = (x_uv, z_uv, lambda_m, amp)`\r\n   * `StateB (RGBA16F) = (dirx, dirz, phase, life)`\r\n4. Update pass:\r\n\r\n   * advect particle center by **flow velocity** (from VelTex) in UV units\r\n   * advance `phase += dt * speed / lambda`\r\n   * decay `amp` and `life`\r\n   * respawn deterministically when life ≤ 0 or out-of-bounds\r\n\r\n### C) Splat into DetailHeightRT (WP_SPLAT_HEIGHT pass)\r\n\r\n5. Render instanced quads (additive blending) into `DetailHeightRT`:\r\n\r\n   * each instance reads its particle state from StateA/StateB\r\n   * writes a compact wave bump:\r\n     [\r\n     h(\\Delta)=A \\cdot \\sin(2\\pi(\\hat{d}\\cdot\\Delta/\\lambda)+\\phi)\\cdot \\exp(-||\\Delta||^2/\\sigma^2)\r\n     ]\r\n   * clear DetailHeightRT each tick (renderer clear, not a shader pass)\r\n\r\n### D) Shading uses DetailHeightRT (no extra passes)\r\n\r\n6. In the river material:\r\n\r\n   * compute micro-normal from height finite differences\r\n   * blend with base normal + foam roughness\r\n\r\n---\r\n\r\n## 4) Code (TS/R3F + GLSL) with file boundaries\r\n\r\n### 4.1 `src/water/river/WaveParticles/WaveParticlesSim.ts`\r\n\r\n```ts\r\nimport * as THREE from \"three\";\r\n\r\nexport type WaveParticlesConfig = {\r\n  res: number;          // 64 near, 32 mid\r\n  dtHz: number;         // 30 / 15\r\n  lambdaMinM: number;   // 0.10\r\n  lambdaMaxM: number;   // 0.60\r\n  ampMax: number;       // 0.02 (meters)\r\n  lifeMinS: number;     // 0.8\r\n  lifeMaxS: number;     // 2.0\r\n};\r\n\r\nexport class WaveParticlesSim {\r\n  stateA0: THREE.WebGLRenderTarget;\r\n  stateB0: THREE.WebGLRenderTarget;\r\n  stateA1: THREE.WebGLRenderTarget;\r\n  stateB1: THREE.WebGLRenderTarget;\r\n  ping = 0;\r\n\r\n  private updatePass: WaveParticlesUpdatePass;\r\n\r\n  constructor(private gl: THREE.WebGLRenderer, private cfg: WaveParticlesConfig) {\r\n    const opts: THREE.WebGLRenderTargetOptions = {\r\n      type: THREE.HalfFloatType,\r\n      format: THREE.RGBAFormat,\r\n      depthBuffer: false,\r\n      stencilBuffer: false,\r\n      minFilter: THREE.NearestFilter,\r\n      magFilter: THREE.NearestFilter,\r\n    };\r\n    this.stateA0 = new THREE.WebGLRenderTarget(cfg.res, cfg.res, opts);\r\n    this.stateB0 = new THREE.WebGLRenderTarget(cfg.res, cfg.res, opts);\r\n    this.stateA1 = new THREE.WebGLRenderTarget(cfg.res, cfg.res, opts);\r\n    this.stateB1 = new THREE.WebGLRenderTarget(cfg.res, cfg.res, opts);\r\n\r\n    this.updatePass = new WaveParticlesUpdatePass();\r\n  }\r\n\r\n  get stateA(): THREE.Texture { return (this.ping === 0 ? this.stateA0.texture : this.stateA1.texture); }\r\n  get stateB(): THREE.Texture { return (this.ping === 0 ? this.stateB0.texture : this.stateB1.texture); }\r\n\r\n  step(dt: number, args: {\r\n    velTex: THREE.Texture;         // RG = vx,vz (m/s)\r\n    rapidsMaskTex?: THREE.Texture; // optional: where to respawn more\r\n    domainSizeXZ: THREE.Vector2;   // meters\r\n    timeSec: number;\r\n  }) {\r\n    const srcA = this.ping === 0 ? this.stateA0 : this.stateA1;\r\n    const srcB = this.ping === 0 ? this.stateB0 : this.stateB1;\r\n    const dstA = this.ping === 0 ? this.stateA1 : this.stateA0;\r\n    const dstB = this.ping === 0 ? this.stateB1 : this.stateB0;\r\n\r\n    this.updatePass.run(this.gl, {\r\n      srcA: srcA.texture,\r\n      srcB: srcB.texture,\r\n      velTex: args.velTex,\r\n      rapidsMaskTex: args.rapidsMaskTex ?? null,\r\n      dt,\r\n      timeSec: args.timeSec,\r\n      domainSizeXZ: args.domainSizeXZ,\r\n      cfg: this.cfg,\r\n    }, dstA, dstB);\r\n\r\n    this.ping = 1 - this.ping;\r\n  }\r\n}\r\n```\r\n\r\n### 4.2 `src/water/river/WaveParticles/WaveParticlesUpdatePass.ts`\r\n\r\n(Fullscreen pass writing to **two MRTs** is awkward in three.js; MV approach: run two fullscreen passes—one for A, one for B—still bounded and explicit.)\r\n\r\n```ts\r\n// Pass A writes new (x_uv,z_uv,lambda,amp)\r\n// Pass B writes new (dirx,dirz,phase,life)\r\n```\r\n\r\n#### `waveParticlesUpdateA.frag` (core logic)\r\n\r\n```glsl\r\nuniform sampler2D uSrcA;\r\nuniform sampler2D uSrcB;\r\nuniform sampler2D uVelTex;\r\nuniform sampler2D uRapidsMaskTex; // can be null; treat as 1\r\n\r\nuniform float uDt;\r\nuniform float uTime;\r\nuniform vec2  uDomainSizeXZ;\r\n\r\nuniform float uLambdaMinM, uLambdaMaxM;\r\nuniform float uAmpMax;\r\nuniform float uLifeMinS, uLifeMaxS;\r\n\r\nvarying vec2 vUv;\r\n\r\nfloat hash1(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }\r\n\r\nvec2 sampleVel(vec2 uv){\r\n  vec2 v = texture2D(uVelTex, uv).rg; // m/s in world XZ\r\n  return v;\r\n}\r\n\r\nvoid respawn(in vec2 id, out vec4 A, out vec4 B){\r\n  // Deterministic spawn UV from hash\r\n  float r1 = hash1(id + 17.0);\r\n  float r2 = hash1(id + 29.0);\r\n  vec2 uv = vec2(r1, r2);\r\n\r\n  // Optional rapids bias: reject/shift if mask low\r\n  float m = 1.0;\r\n  #ifdef USE_RAPIDS\r\n    m = texture2D(uRapidsMaskTex, uv).r;\r\n  #endif\r\n  // cheap bias: push toward high-mask by rehashing\r\n  if (m < 0.3) {\r\n    uv = vec2(hash1(id + 41.0), hash1(id + 53.0));\r\n  }\r\n\r\n  vec2 v = sampleVel(uv);\r\n  float sp = max(1e-3, length(v));\r\n  vec2 dir = v / sp;\r\n\r\n  float rr = hash1(id + 71.0);\r\n  float lambda = mix(uLambdaMinM, uLambdaMaxM, rr);\r\n  float amp = uAmpMax * mix(0.4, 1.0, hash1(id + 73.0));\r\n\r\n  float life = mix(uLifeMinS, uLifeMaxS, hash1(id + 91.0));\r\n  float phase = hash1(id + 101.0);\r\n\r\n  A = vec4(uv.x, uv.y, lambda, amp);\r\n  B = vec4(dir.x, dir.y, phase, life);\r\n}\r\n\r\nvoid main(){\r\n  vec4 A0 = texture2D(uSrcA, vUv);\r\n  vec4 B0 = texture2D(uSrcB, vUv);\r\n\r\n  vec2 uv = A0.xy;\r\n  float lambda = A0.z;\r\n  float amp = A0.w;\r\n\r\n  float phase = B0.z;\r\n  float life = B0.w;\r\n\r\n  // If dead or invalid, respawn\r\n  if (life <= 0.0 || uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {\r\n    vec4 A1; vec4 B1;\r\n    respawn(vUv + uTime, A1, B1);\r\n    gl_FragColor = A1;\r\n    return;\r\n  }\r\n\r\n  // Advect by flow\r\n  vec2 v = sampleVel(uv); // m/s\r\n  vec2 duv = (uDt * v) / max(uDomainSizeXZ, vec2(1e-3));\r\n  uv += duv;\r\n\r\n  // Decay amp slightly; life decreases\r\n  amp *= exp(-uDt * 0.35);\r\n  life -= uDt;\r\n\r\n  gl_FragColor = vec4(uv.x, uv.y, lambda, amp);\r\n}\r\n```\r\n\r\n#### `waveParticlesUpdateB.frag`\r\n\r\n```glsl\r\nuniform sampler2D uSrcA;\r\nuniform sampler2D uSrcB;\r\nuniform sampler2D uVelTex;\r\n\r\nuniform float uDt;\r\nuniform vec2  uDomainSizeXZ;\r\n\r\nvarying vec2 vUv;\r\n\r\nvec2 sampleVel(vec2 uv){ return texture2D(uVelTex, uv).rg; }\r\n\r\nvoid main(){\r\n  vec4 A0 = texture2D(uSrcA, vUv);\r\n  vec4 B0 = texture2D(uSrcB, vUv);\r\n\r\n  vec2 uv = A0.xy;\r\n  float lambda = A0.z;\r\n\r\n  float phase = B0.z;\r\n  float life = B0.w;\r\n\r\n  // If dead, keep whatever (respawn handled in A pass; B pass can be overwritten similarly if desired)\r\n  if (life <= 0.0) { gl_FragColor = B0; return; }\r\n\r\n  vec2 v = sampleVel(uv);\r\n  float sp = max(1e-3, length(v));\r\n  vec2 dir = v / sp;\r\n\r\n  // phase advance: speed / wavelength\r\n  phase = fract(phase + uDt * (sp / max(1e-3, lambda)));\r\n\r\n  gl_FragColor = vec4(dir.x, dir.y, phase, life);\r\n}\r\n```\r\n\r\n### 4.3 `src/water/river/WaveParticles/WaveParticlesSplat.ts`\r\n\r\nInstanced quads, additive blending into `DetailHeightRT`.\r\n\r\n* Instances = `cfg.res * cfg.res`\r\n* Vertex shader samples state textures by instance id.\r\n* Fragment shader outputs height contribution (additive).\r\n\r\n#### `waveParticlesSplat.vert` (sketch)\r\n\r\n```glsl\r\nattribute vec2 aQuad;              // (-1,-1)..(1,1) for a quad\r\nattribute float aInstanceId;       // 0..P-1\r\nuniform sampler2D uStateA;\r\nuniform sampler2D uStateB;\r\nuniform float uRes;                // 64\r\nuniform float uRadiusScale;        // maps lambda->splat radius in UV\r\n\r\nvarying vec2 vLocal;\r\nvarying vec4 vPA; // (uvx,uvy,lambda,amp)\r\nvarying vec4 vPB; // (dirx,dirz,phase,life)\r\n\r\nvec2 idToUv(float id){\r\n  float x = mod(id, uRes);\r\n  float y = floor(id / uRes);\r\n  return (vec2(x,y) + 0.5) / uRes;\r\n}\r\n\r\nvoid main(){\r\n  vec2 suv = idToUv(aInstanceId);\r\n  vPA = texture2D(uStateA, suv);\r\n  vPB = texture2D(uStateB, suv);\r\n\r\n  vec2 center = vPA.xy; // in [0,1]\r\n  float lambda = vPA.z;\r\n\r\n  float rUv = uRadiusScale * lambda; // lambda in meters; choose scale outside\r\n  vec2 offsetUv = aQuad * rUv;\r\n\r\n  vec2 uv = center + offsetUv;\r\n  vec2 ndc = uv * 2.0 - 1.0;\r\n\r\n  vLocal = aQuad;\r\n  gl_Position = vec4(ndc, 0.0, 1.0);\r\n}\r\n```\r\n\r\n#### `waveParticlesSplat.frag` (sketch)\r\n\r\n```glsl\r\nprecision highp float;\r\nvarying vec2 vLocal;\r\nvarying vec4 vPA;\r\nvarying vec4 vPB;\r\n\r\nconst float PI = 3.14159265;\r\n\r\nvoid main(){\r\n  float lambda = vPA.z;\r\n  float amp = vPA.w;\r\n  vec2 dir = normalize(vPB.xy);\r\n  float phase = vPB.z;\r\n\r\n  // radial falloff\r\n  float r2 = dot(vLocal, vLocal);\r\n  float falloff = exp(-r2 * 2.5); // tweak\r\n\r\n  // along-wave coordinate in local quad space (approx)\r\n  float s = dot(dir, vLocal);\r\n\r\n  float h = amp * sin(2.0 * PI * (s + phase)) * falloff;\r\n\r\n  gl_FragColor = vec4(h, 0.0, 0.0, 1.0); // additive into R16F target\r\n}\r\n```\r\n\r\n### 4.4 River material: use DetailHeightRT to perturb normals\r\n\r\nIn the river shader (pixel), compute gradient:\r\n\r\n```glsl\r\nfloat hC = texDetail(uv);\r\nfloat hX = texDetail(uv + vec2(du,0));\r\nfloat hZ = texDetail(uv + vec2(0,dv));\r\nvec3 nDetail = normalize(vec3(-(hX - hC), 1.0, -(hZ - hC)));\r\n```\r\n\r\nBlend it based on flow speed / foam amount.\r\n\r\n---\r\n\r\n## 5) Validation checklist\r\n\r\n### Visual gates\r\n\r\n* **No pulsing** in micro detail (should remain coherent while foam advects). ([80.lv][1])\r\n* Rapids zones show **denser, higher-frequency** shimmer; calm zones show subdued ripples.\r\n* Around obstacles, detail aligns with flow direction and vorticity streaks (looks “alive”).\r\n\r\n### Perf / no-stall gates\r\n\r\n* Near tile: **WP_UPDATE (2 fullscreen passes) @ 30 Hz** + **WP_SPLAT (1 instanced draw) @ 30 Hz**.\r\n* No GPU readback, no per-frame allocations.\r\n* Hard caps: particle count fixed by `res²`, DetailRT fixed resolution.\r\n\r\n### Regression toggles\r\n\r\n* `river.detailMode = off/profile/waveParticles`\r\n* `river.waveParticles.enabledNear/Mid`\r\n* `river.waveParticles.resNear/resMid`\r\n\r\n---\r\n\r\n## 6) Telemetry/debug views\r\n\r\n* `DEBUG.WP_STATE`: show StateA/StateB atlases (UV/amp/life)\r\n* `DEBUG.WP_DETAIL_HEIGHT`: visualize DetailHeightRT\r\n* `DEBUG.WP_COST`: counters (passes/tick, instance count, tile count)\r\n* `DEBUG.RIVER_COMPOSITE`: view normal components (base vs detail vs foam roughness)\r\n\r\n---\r\n\r\n\r\n\r\n\r\n\r\n\r
