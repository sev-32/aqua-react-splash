)}>Reset</ActionBtn>\n            <ActionBtn onClick={() => waterStore.set({ paused: !waterStore.get().paused })}>\n              {paused ? 'Resume' : 'Pause'}\n            </ActionBtn>\n          </div>\n          </>\n          )}\n        </div>\n\n      </motion.aside>\n\n      {/* Bottom-left interaction wording removed. */}\n\n      {/* Editorial credit overlay removed. */}\n\n      {/* Subtle horizon gradient */}\n      <div className=\"fixed inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-ink/60 to-transparent pointer-events-none z-[6]\" />\n    </>\n  );\n}\n","/src/hooks/useCaustics.ts":"import { useMemo, useRef, useCallback, useEffect } from 'react';\nimport * as THREE from 'three';\nimport { useThree } from '@react-three/fiber';\nimport {\n  causticsVertexShader,\n  causticsFragmentShader,\n} from '../shaders/waterShaders';\n\nconst CAUSTICS_SIZE = 1024;\nconst PLANE_DETAIL = 256;\n\nexport function useCaustics() {\n  const { gl } = useThree();\n\n  const target = useRef<THREE.WebGLRenderTarget>(null!);\n  const material = useRef<THREE.ShaderMaterial>(null!);\n  const scene = useMemo(() => new THREE.Scene(), []);\n  const camera = useMemo(() => new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), []);\n  const planeGeom = useMemo(() => new THREE.PlaneGeometry(2, 2, PLANE_DETAIL, PLANE_DETAIL), []);\n  const meshRef = useRef<THREE.Mesh>(null!);\n\n  useMemo(() => {\n    target.current = new THREE.WebGLRenderTarget(CAUSTICS_SIZE, CAUSTICS_SIZE, {\n      type: THREE.HalfFloatType,\n      minFilter: THREE.LinearFilter,\n      magFilter: THREE.LinearFilter,\n      format: THREE.RGBAFormat,\n      stencilBuffer: false,\n      depthBuffer: false,\n      generateMipmaps: false,\n    });\n\n    material.current = new THREE.ShaderMaterial({\n      vertexShader: causticsVertexShader,\n      fragmentShader: causticsFragmentShader,\n      uniforms: {\n        water: { value: null },\n        tiles: { value: null }, // unused but declared in helpers\n        causticTex: { value: null }, // unused but declared in helpers\n        light: { value: new THREE.Vector3(2, 2, -1).normalize() },\n        sphereCenter: { value: new THREE.Vector3() },\n        sphereRadius: { value: 0.25 },\n        poolHalfSize: { value: new THREE.Vector2(1, 1) },\n        poolDepthY: { value: 1.0 },\n        causticsEnabled: { value: 1.0 },\n      },\n      side: THREE.DoubleSide,\n      blending: THREE.NoBlending,\n      depthWrite: false,\n      depthTest: false,\n      extensions: { derivatives: true } as never,\n    });\n\n    meshRef.current = new THREE.Mesh(planeGeom, material.current);\n    scene.add(meshRef.current);\n  // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);\n\n  useEffect(() => () => {\n    target.current?.dispose();\n    material.current?.dispose();\n    planeGeom.dispose();\n  }, [planeGeom]);\n\n  const updateCaustics = useCallback((\n    waterTexture: THREE.Texture,\n    light: THREE.Vector3,\n    sphereCenter: THREE.Vector3,\n    sphereRadius: number,\n    poolHalfSize: THREE.Vector2,\n    poolDepthY = 1.0,\n    enabled = true,\n  ) => {\n    if (!enabled) return;\n    if (!material.current || !target.current) return;\n    material.current.uniforms.water.value = waterTexture;\n    material.current.uniforms.light.value.copy(light);\n    material.current.uniforms.sphereCenter.value.copy(sphereCenter);\n    material.current.uniforms.sphereRadius.value = sphereRadius;\n    material.current.uniforms.poolHalfSize.value.copy(poolHalfSize);\n    material.current.uniforms.poolDepthY.value = poolDepthY;\n    material.current.uniforms.causticsEnabled.value = enabled ? 1.0 : 0.0;\n\n    const prev = gl.getRenderTarget();\n    const prevClear = gl.getClearColor(new THREE.Color()).getHex();\n    const prevAlpha = gl.getClearAlpha();\n    gl.setRenderTarget(target.current);\n    gl.setClearColor(0x000000, 0);\n    gl.clear(true, false, false);\n    gl.render(scene, camera);\n    gl.setRenderTarget(prev);\n    gl.setClearColor(prevClear, prevAlpha);\n  }, [gl, scene, camera]);\n\n  const getTexture = useCallback(() => target.current?.texture, []);\n\n  return { updateCaustics, getTexture };\n}\n","/src/hooks/useMlsMpm.ts":"/**\n * useMlsMpm \u2014 owns the MLS-MPM solver lifecycle, runs the per-frame step,\n * exposes spawn helpers + the live particle buffer for the renderer, and\n * forwards settle events back into the height field as small ripple drops.\n */\nimport { useEffect, useMemo, useRef } from 'react';\nimport * as THREE from 'three';\nimport {\n  MlsMpmSolver,\n  SphereProbe,\n  MpmSurfaceSampler,\n  vec3ToProbe,\n  parcelRadius,\n  POOL_RIM_Y,\n} from '../lib/mlsmpm';\nimport { waterStore } from '../lib/waterStore';\n\nexport interface MpmHandle {\n  solver: MlsMpmSolver;\n  /** Run one physics step. */\n  step: (dt: number, sphere?: SphereProbe, surface?: MpmSurfaceSampler) => void;\n  /** Convenience: spawn helpers. */\n  crown: (cx: number, cz: number, impactSpeed: number, radius?: number) => void;\n  sheet: (cx: number, cz: number, yStart: number, upSpeed: number) => void;\n  impact: (cx: number, cz: number, energy?: number, count?: number) => void;\n  breach: (cx: number, cy: number, cz: number, radius: number, vx: number, vy: number, vz: number, intensity?: number) => void;\n  /** Drain settle events; calls onSettle(x,z,strength,radius) for each. */\n  drainSettleEvents: (onSettle: (x: number, z: number, strength: number, radius: number) => void) => void;\n  /** Live count of alive particles, for telemetry. */\n  liveCount: () => number;\n  /** Probe builder mirroring solver expectations. */\n  buildProbe: (pos: THREE.Vector3, vel: THREE.Vector3, radius: number) => SphereProbe;\n}\n\nexport function useMlsMpm(maxParticles = 9000): MpmHandle {\n  const solver = useMemo(() => new MlsMpmSolver(maxParticles), [maxParticles]);\n  const handleRef = useRef<MpmHandle>(null!);\n\n  if (!handleRef.current) {\n    handleRef.current = {\n      solver,\n      step: (dt, sphere, surface) => solver.step(dt, sphere, surface),\n      crown: (cx, cz, impactSpeed, radius = 0.23) => {\n        const p = waterStore.get().mpmParams;\n        if (impactSpeed < p.spawnThreshold) return;\n        solver.spawnCrown(cx, cz, impactSpeed, Math.round(72 * p.spawnCountMultiplier), radius);\n      },\n      sheet: (cx, cz, yStart, upSpeed) => {\n        const p = waterStore.get().mpmParams;\n        if (upSpeed < p.spawnThreshold) return;\n        solver.spawnSheet(cx, cz, yStart, upSpeed, Math.round(54 * p.spawnCountMultiplier));\n      },\n      impact: (cx, cz, energy = 1.0, count = 20) => {\n        const p = waterStore.get().mpmParams;\n        if (energy < p.spawnThreshold) return;\n        solver.spawnImpact(cx, cz, energy, Math.round(count * p.spawnCountMultiplier));\n      },\n      breach: (cx, cy, cz, radius, vx, vy, vz, intensity = 1.0) => {\n        const p = waterStore.get().mpmParams;\n        if (Math.hypot(vx, vy, vz) * intensity < p.spawnThreshold) return;\n        solver.spawnSphereBreach(cx, cy, cz, radius, vx, vy, vz, intensity * p.spawnCountMultiplier);\n      },\n      drainSettleEvents: (onSettle) => {\n        for (const e of solver.settleEvents) {\n          // Each settling parcel hits the heightfield as a droplet of its own\n          // carried volume: ripple radius follows the parcel radius and ripple\n          // strength follows its momentum (vol x impact speed). Big slow blobs\n          // thud wide and soft, fine fast spray stings small and sharp.\n          const p = waterStore.get().mpmParams;\n          const vol = e.vol ?? 1.4e-4;\n          const r = parcelRadius(vol);\n          const speed = Math.min(12, Math.abs(e.vy));\n          const radius = Math.max(0.016, Math.min(0.15, r * 2.4 * Math.max(0.2, (p.settleRippleRadius ?? 0.042) / 0.042)));\n          const raw = vol * 300 * Math.pow(speed, 1.12) * Math.max(0.55, e.weight) * Math.max(0, p.settleRippleGain ?? 1);\n          const strength = Math.min(Math.max(0.0004, p.settleRippleClamp ?? 0.075), Math.max(0.00012, raw));\n          onSettle(e.x, e.z, strength, radius);\n        }\n        solver.settleEvents.length = 0;\n      },\n      liveCount: () => {\n        const f = solver.particles.flags;\n        let n = 0;\n        for (let i = 0; i < solver.particles.count; i++) if (f[i] & 1) n++;\n        return n;\n      },\n      buildProbe: vec3ToProbe,\n    };\n  }\n\n  useEffect(() => () => {\n    // GC handled by JS \u2014 Float32Array + objects.\n  }, []);\n\n  return handleRef.current;\n}\n\nexport { POOL_RIM_Y };\n","/src/hooks/useWaterSimulation.ts":"import { useRef, useMemo, useCallback, useEffect } from 'react';\nimport * as THREE from 'three';\nimport { useThree } from '@react-three/fiber';\nimport { MpmParticles, FLAG_ALIVE } from '../lib/mlsmpm';\nimport { waterStore, HeightfieldGuidanceStats } from '../lib/waterStore';\nimport {\n  simulationVertexShader,\n  dropFragmentShader,\n  updateFragmentShader,\n  normalFragmentShader,\n  sphereDisplacementFragmentShader,\n} from '../shaders/waterShaders';\n\nconst TEXTURE_SIZE = 512;\nconst CPU_SAMPLE_SIZE = 128;\nconst CPU_SAMPLE_DELTA = 1 / CPU_SAMPLE_SIZE;\n\nconst clamp01 = (v: number) => Math.max(0, Math.min(1, v));\nconst clamp11 = (v: number) => Math.max(-1, Math.min(1, v));\n\n/**\n * Heightfield simulation over a rectangular world-space pool footprint.\n * Changing poolHalfSize expands the represented water area; it does not scale\n * tile/caustic/wave detail. Drop radii are evaluated in world meters, so a\n * radial splash remains radial even when width != depth.\n */\nexport function useWaterSimulation(poolHalfSize: THREE.Vector2 | number = 1.0) {\n  const { gl } = useThree();\n  const poolX = typeof poolHalfSize === 'number' ? poolHalfSize : poolHalfSize.x;\n  const poolZ = typeof poolHalfSize === 'number' ? poolHalfSize : poolHalfSize.y;\n\n  const toPoolUx = useCallback((x: number) => clamp01(x / (2 * Math.max(0.001, poolX)) + 0.5), [poolX]);\n  const toPoolUz = useCallback((z: number) => clamp01(z / (2 * Math.max(0.001, poolZ)) + 0.5), [poolZ]);\n  const toPoolCoordX = useCallback((x: number) => clamp11(x / Math.max(0.001, poolX)), [poolX]);\n  const toPoolCoordZ = useCallback((z: number) => clamp11(z / Math.max(0.001, poolZ)), [poolZ]);\n\n  const targetA = useRef<THREE.WebGLRenderTarget>(null!);\n  const targetB = useRef<THREE.WebGLRenderTarget>(null!);\n\n  const dropMaterial = useRef<THREE.ShaderMaterial>(null!);\n  const updateMaterial = useRef<THREE.ShaderMaterial>(null!);\n  const normalMaterial = useRef<THREE.ShaderMaterial>(null!);\n  const sphereMaterial = useRef<THREE.ShaderMaterial>(null!);\n\n  const scene = useMemo(() => new THREE.Scene(), []);\n  const camera = useMemo(() => new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), []);\n  const quadGeom = useMemo(() => new THREE.PlaneGeometry(2, 2), []);\n  const quadMesh = useRef<THREE.Mesh>(null!);\n  const cpuHeight = useRef(new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE));\n  const cpuVelocity = useRef(new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE));\n  const cpuScratchHeight = useRef(new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE));\n  const cpuScratchVelocity = useRef(new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE));\n  const guidanceFields = useRef({\n    sigma: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    prevSigma: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    sigmaDot: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    contact: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    pressure: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    risk: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    elongation: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    bodyFlux: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    wakeCurl: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    particles: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    absorb: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    // Aqua-phase-7 JIT reservoirs: failed-sheet volume, persistent exportable\n    // volume, and ejection energy. Particles are emitted FROM these fields.\n    failVol: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    jitVol: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n    eject: new Float32Array(CPU_SAMPLE_SIZE * CPU_SAMPLE_SIZE),\n  });\n  const guidanceFrame = useRef(0);\n  const lastGuidanceSnapshot = useRef(0);\n  const jitSpawnCarry = useRef(0);\n\n  const sampleArrayNearest = useCallback((field: Float32Array, x: number, z: number) => {\n    const ix = Math.max(0, Math.min(CPU_SAMPLE_SIZE - 1, Math.floor(toPoolUx(x) * CPU_SAMPLE_SIZE)));\n    const iz = Math.max(0, Math.min(CPU_SAMPLE_SIZE - 1, Math.floor(toPoolUz(z) * CPU_SAMPLE_SIZE)));\n    return field[iz * CPU_SAMPLE_SIZE + ix] || 0;\n  }, [toPoolUx, toPoolUz]);\n\n  const stampGuidanceField = useCallback((field: Float32Array, x: number, z: number, radius: number, strength: number) => {\n    const cx = toPoolUx(x);\n    const cz = toPoolUz(z);\n    const rr = Math.max(0.004, radius);\n    const rx = Math.max(rr / (2 * Math.max(0.001, poolX)), CPU_SAMPLE_DELTA);\n    const rz = Math.max(rr / (2 * Math.max(0.001, poolZ)), CPU_SAMPLE_DELTA);\n    const minX = Math.max(0, Math.floor((cx - rx) * CPU_SAMPLE_SIZE));\n    const maxX = Math.min(CPU_SAMPLE_SIZE - 1, Math.ceil((cx + rx) * CPU_SAMPLE_SIZE));\n    const minZ = Math.max(0, Math.floor((cz - rz) * CPU_SAMPLE_SIZE));\n    const maxZ = Math.min(CPU_SAMPLE_SIZE - 1, Math.ceil((cz + rz) * CPU_SAMPLE_SIZE));\n    for (let j = minZ; j <= maxZ; j++) {\n      const wz = (((j + 0.5) / CPU_SAMPLE_SIZE) - cz) * 2 * poolZ;\n      for (let i = minX; i <= maxX; i++) {\n        const wx = (((i + 0.5) / CPU_SAMPLE_SIZE) - cx) * 2 * poolX;\n        const d = Math.hypot(wx, wz);\n        if (d > rr) continue;\n        const q = 1 - d / rr;\n        const w = q * q * (3 - 2 * q);\n        const id = j * CPU_SAMPLE_SIZE + i;\n        field[id] = Math.max(field[id], Math.abs(strength) * w);\n      }\n    }\n  }, [toPoolUx, toPoolUz, poolX, poolZ]);\n\n  useMemo(() => {\n    const supportsFloatLinear = gl.capabilities.isWebGL2;\n    const opts: THREE.RenderTargetOptions = {\n      type: supportsFloatLinear ? THREE.HalfFloatType : THREE.HalfFloatType,\n      minFilter: THREE.LinearFilter,\n      magFilter: THREE.LinearFilter,\n      format: THREE.RGBAFormat,\n      stencilBuffer: false,\n      depthBuffer: false,\n      generateMipmaps: false,\n      wrapS: THREE.ClampToEdgeWrapping,\n      wrapT: THREE.ClampToEdgeWrapping,\n    };\n\n    targetA.current = new THREE.WebGLRenderTarget(TEXTURE_SIZE, TEXTURE_SIZE, opts);\n    targetB.current = new THREE.WebGLRenderTarget(TEXTURE_SIZE, TEXTURE_SIZE, opts);\n\n    const clearMat = new THREE.ShaderMaterial({\n      vertexShader: simulationVertexShader,\n      fragmentShader: `\n        precision highp float;\n        varying vec2 vCoord;\n        void main() { gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0); }\n      `,\n    });\n    const tmpMesh = new THREE.Mesh(quadGeom, clearMat);\n    scene.add(tmpMesh);\n    const prevTarget = gl.getRenderTarget();\n    gl.setRenderTarget(targetA.current); gl.render(scene, camera);\n    gl.setRenderTarget(targetB.current); gl.render(scene, camera);\n    gl.setRenderTarget(prevTarget);\n    scene.remove(tmpMesh);\n    clearMat.dispose();\n\n    dropMaterial.current = new THREE.ShaderMaterial({\n      vertexShader: simulationVertexShader,\n      fragmentShader: dropFragmentShader,\n      uniforms: {\n        tSim: { value: null },\n        center: { value: new THREE.Vector2() },\n        radius: { value: 0.03 },\n        strength: { value: 0.01 },\n        poolHalfSize: { value: new THREE.Vector2(poolX, poolZ) },\n      },\n    });\n\n    updateMaterial.current = new THREE.ShaderMaterial({\n      vertexShader: simulationVertexShader,\n      fragmentShader: updateFragmentShader,\n      uniforms: {\n        tSim: { value: null },\n        delta: { value: new THREE.Vector2(1 / TEXTURE_SIZE, 1 / TEXTURE_SIZE) },\n      },\n    });\n\n    normalMaterial.current = new THREE.ShaderMaterial({\n      vertexShader: simulationVertexShader,\n      fragmentShader: normalFragmentShader,\n      uniforms: {\n        tSim: { value: null },\n        delta: { value: new THREE.Vector2(1 / TEXTURE_SIZE, 1 / TEXTURE_SIZE) },\n      },\n    });\n\n    sphereMaterial.current = new THREE.ShaderMaterial({\n      vertexShader: simulationVertexShader,\n      fragmentShader: sphereDisplacementFragmentShader,\n      uniforms: {\n        tSim: { value: null },\n        oldCenter: { value: new THREE.Vector3() },\n        newCenter: { value: new THREE.Vector3() },\n        radius: { value: 0.25 },\n        poolHalfSize: { value: new THREE.Vector2(poolX, poolZ) },\n      },\n    });\n\n    quadMesh.current = new THREE.Mesh(quadGeom, dropMaterial.current);\n    scene.add(quadMesh.current);\n  // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);\n\n  useEffect(() => () => {\n    targetA.current?.dispose();\n    targetB.current?.dispose();\n    dropMaterial.current?.dispose();\n    updateMaterial.current?.dispose();\n    normalMaterial.current?.dispose();\n    sphereMaterial.current?.dispose();\n    quadGeom.dispose();\n  }, [quadGeom]);\n\n  const renderPass = useCallback((mat: THREE.ShaderMaterial) => {\n    quadMesh.current.material = mat;\n    const prev = gl.getRenderTarget();\n    gl.setRenderTarget(targetB.current);\n    gl.render(scene, camera);\n    gl.setRenderTarget(prev);\n    const tmp = targetA.current;\n    targetA.current = targetB.current;\n    targetB.current = tmp;\n  }, [gl, scene, camera]);\n\n  const addCpuDrop = useCallback((x: number, z: number, radius = 0.03, strength = 0.01) => {\n    const waveScale = Math.max(0.05, waterStore.get().waveScale || 1.0);\n    const worldRadius = Math.max(0.0005, radius * waveScale);\n    const height = cpuHeight.current;\n    const cx = toPoolUx(x);\n    const cz = toPoolUz(z);\n    const rx = Math.max(worldRadius / (2 * Math.max(0.001, poolX)), CPU_SAMPLE_DELTA);\n    const rz = Math.max(worldRadius / (2 * Math.max(0.001, poolZ)), CPU_SAMPLE_DELTA);\n    const minX = Math.max(0, Math.floor((cx - rx) * CPU_SAMPLE_SIZE));\n    const maxX = Math.min(CPU_SAMPLE_SIZE - 1, Math.ceil((cx + rx) * CPU_SAMPLE_SIZE));\n    const minZ = Math.max(0, Math.floor((cz - rz) * CPU_SAMPLE_SIZE));\n    const maxZ = Math.min(CPU_SAMPLE_SIZE - 1, Math.ceil((cz + rz) * CPU_SAMPLE_SIZE));\n    for (let j = minZ; j <= maxZ; j++) {\n      const v = (j + 0.5) / CPU_SAMPLE_SIZE;\n      const wz = (v - cz) * 2 * poolZ;\n      for (let i = minX; i <= maxX; i++) {\n        const u = (i + 0.5) / CPU_SAMPLE_SIZE;\n        const wx = (u - cx) * 2 * poolX;\n        let drop = Math.max(0, 1 - Math.hypot(wx, wz) / worldRadius);\n        drop = 0.5 - Math.cos(drop * Math.PI) * 0.5;\n        height[j * CPU_SAMPLE_SIZE + i] += drop * strength;\n      }\n    }\n  }, [toPoolUx, toPoolUz, poolX, poolZ]);\n\n  const addDrop = useCallback((x: number, z: number, radius = 0.03, strength = 0.01) => {\n    if (!targetA.current) return;\n    const waveScale = Math.max(0.05, waterStore.get().waveScale || 1.0);\n    const worldRadius = Math.max(0.0005, radius * waveScale);\n    addCpuDrop(x, z, radius, strength);\n    dropMaterial.current.uniforms.tSim.value = targetA.current.texture;\n    dropMaterial.current.uniforms.center.value.set(toPoolCoordX(x), toPoolCoordZ(z));\n    dropMaterial.current.uniforms.radius.value = worldRadius;\n    dropMaterial.current.uniforms.strength.value = strength;\n    dropMaterial.current.uniforms.poolHalfSize.value.set(poolX, poolZ);\n    renderPass(dropMaterial.current);\n  }, [addCpuDrop, renderPass, toPoolCoordX, toPoolCoordZ, poolX, poolZ]);\n\n  const moveSphere = useCallback((oldCenter: THREE.Vector3, newCenter: THREE.Vector3, radius: number) => {\n    if (!targetA.current) return;\n    sphereMaterial.current.uniforms.tSim.value = targetA.current.texture;\n    sphereMaterial.current.uniforms.oldCenter.value.copy(oldCenter);\n    sphereMaterial.current.uniforms.newCenter.value.copy(newCenter);\n    sphereMaterial.current.uniforms.radius.value = radius;\n    sphereMaterial.current.uniforms.poolHalfSize.value.set(poolX, poolZ);\n    renderPass(sphereMaterial.current);\n  }, [renderPass, poolX, poolZ]);\n\n  const stepCpuSimulation = useCallback(() => {\n    const h = cpuHeight.current;\n    const v = cpuVelocity.current;\n    const nextH = cpuScratchHeight.current;\n    const nextV = cpuScratchVelocity.current;\n    nextH.set(h);\n    nextV.set(v);\n    for (let z = 1; z < CPU_SAMPLE_SIZE - 1; z++) {\n      const row = z * CPU_SAMPLE_SIZE;\n      for (let x = 1; x < CPU_SAMPLE_SIZE - 1; x++) {\n        const idx = row + x;\n        const avg = (h[idx - 1] + h[idx + 1] + h[idx - CPU_SAMPLE_SIZE] + h[idx + CPU_SAMPLE_SIZE]) * 0.25;\n        const vel = (v[idx] + (avg - h[idx]) * 2.0) * 0.995;\n        nextV[idx] = vel;\n        nextH[idx] = h[idx] + vel;\n      }\n    }\n    cpuHeight.current = nextH;\n    cpuVelocity.current = nextV;\n    cpuScratchHeight.current = h;\n    cpuScratchVelocity.current = v;\n  }, []);\n\n  const stepSimulation = useCallback(() => {\n    if (!targetA.current) return;\n    stepCpuSimulation();\n    updateMaterial.current.uniforms.tSim.value = targetA.current.texture;\n    renderPass(updateMaterial.current);\n  }, [renderPass, stepCpuSimulation]);\n\n  const coupleMpmParticles = useCallback((particles: MpmParticles) => {\n    const params = waterStore.get().mpmParams;\n    const gain = Math.max(0, params.particleRippleGain);\n    if (gain <= 0 || params.particleMaxStamps <= 0) return;\n\n    const height = cpuHeight.current;\n    const maxY = cpuScratchVelocity.current;\n    maxY.fill(-Infinity);\n\n    for (let i = 0; i < particles.count; i++) {\n      if (!(particles.flags[i] & FLAG_ALIVE)) continue;\n      if (Math.abs(particles.px[i]) > poolX || Math.abs(particles.pz[i]) > poolZ) continue;\n      const ix = Math.max(0, Math.min(CPU_SAMPLE_SIZE - 1, Math.floor(toPoolUx(particles.px[i]) * CPU_SAMPLE_SIZE)));\n      const iz = Math.max(0, Math.min(CPU_SAMPLE_SIZE - 1, Math.floor(toPoolUz(particles.pz[i]) * CPU_SAMPLE_SIZE)));\n      const idx = iz * CPU_SAMPLE_SIZE + ix;\n      if (particles.py[i] > maxY[idx]) maxY[idx] = particles.py[i];\n    }\n\n    let changed = 0;\n    const blend = Math.max(0, Math.min(1, params.particleHeightBlend)) * gain;\n    if (blend > 0) {\n      for (let z = 1; z < CPU_SAMPLE_SIZE - 1; z++) {\n        for (let x = 1; x < CPU_SAMPLE_SIZE - 1; x++) {\n          let sum = 0;\n          let count = 0;\n          for (let dz = -1; dz <= 1; dz++) {\n            for (let dx = -1; dx <= 1; dx++) {\n              const y = maxY[(z + dz) * CPU_SAMPLE_SIZE + x + dx];\n              if (Number.isFinite(y) && y > 0) { sum += y; count++; }\n            }\n          }\n          if (count > 0) {\n            const idx = z * CPU_SAMPLE_SIZE + x;\n            const eta = sum / count;\n            height[idx] += (eta - height[idx]) * blend;\n            changed++;\n          }\n        }\n      }\n    } else {\n      for (let i = 0; i < maxY.length; i++) if (Number.isFinite(maxY[i]) && maxY[i] > 0) changed++;\n    }\n\n    if (changed > 0) {\n      const maxStamps = Math.max(1, Math.round(params.particleMaxStamps));\n      const stride = Math.max(1, Math.ceil(changed / maxStamps));\n      const radius = Math.max(0.002, params.particleRippleRadius);\n      const clamp = Math.max(0.0001, params.particleRippleClamp);\n      let n = 0;\n      for (let z = 1; z < CPU_SAMPLE_SIZE - 1; z++) {\n        for (let x = 1; x < CPU_SAMPLE_SIZE - 1; x++) {\n          const y = maxY[z * CPU_SAMPLE_SIZE + x];\n          if (!Number.isFinite(y) || y <= 0 || (n++ % stride) !== 0) continue;\n          const wx = (((x + 0.5) / CPU_SAMPLE_SIZE) * 2 - 1) * poolX;\n          const wz = (((z + 0.5) / CPU_SAMPLE_SIZE) * 2 - 1) * poolZ;\n          const rawStrength = y * 0.012 * gain;\n          const strength = Math.min(clamp, Math.max(0.0001, rawStrength));\n          addDrop(wx, wz, radius, strength);\n        }\n      }\n    }\n  }, [addDrop, poolX, poolZ, toPoolUx, toPoolUz]);\n\n\n  const recordMpmAbsorb = useCallback((x: number, z: number, strength = 1.0, radius = 0.08) => {\n    const f = guidanceFields.current;\n    stampGuidanceField(f.absorb, x, z, radius, Math.max(0.05, Math.abs(strength) * 18.0));\n    stampGuidanceField(f.contact, x, z, radius * 1.25, Math.max(0.05, Math.abs(strength) * 12.0));\n    stampGuidanceField(f.risk, x, z, radius * 1.5, Math.max(0.04, Math.abs(strength) * 9.0));\n  }, [stampGuidanceField]);\n\n  const updateHeightfieldGuidance = useCallback((center: THREE.Vector3, velocity: THREE.Vector3, radius: number, particles?: MpmParticles, dt = 1 / 60) => {\n    const state = waterStore.get();\n    const fields = guidanceFields.current;\n    const height = cpuHeight.current;\n    const hVel = cpuVelocity.current;\n    const dtSafe = Math.max(1 / 240, dt);\n    const mem = Math.exp(-dtSafe * 5.2);\n    const decayFast = Math.exp(-dtSafe * 7.5);\n    const decayAbsorb = Math.exp(-dtSafe * 4.2);\n    const jitLeak = Math.exp(-dtSafe * 3.7);\n    const jitRiskGain = Math.max(0, state.mpmParams.jitRiskGain ?? 1.05);\n    fields.prevSigma.set(fields.sigma);\n    fields.particles.fill(0);\n\n    if (particles) {\n      for (let i = 0; i < particles.count; i++) {\n        if (!(particles.flags[i] & FLAG_ALIVE)) continue;\n        if (Math.abs(particles.px[i]) > poolX || Math.abs(particles.pz[i]) > poolZ) continue;\n        const ix = Math.max(0, Math.min(CPU_SAMPLE_SIZE - 1, Math.floor(toPoolUx(particles.px[i]) * CPU_SAMPLE_SIZE)));\n        const iz = Math.max(0, Math.min(CPU_SAMPLE_SIZE - 1, Math.floor(toPoolUz(particles.pz[i]) * CPU_SAMPLE_SIZE)));\n        const id = iz * CPU_SAMPLE_SIZE + ix;\n        fields.particles[id] += Math.max(0.04, Math.min(1.6, particles.density[i] / 1000));\n      }\n    }\n\n    let maxRisk = 0, maxContact = 0, maxPressure = 0, maxElongation = 0, maxAbsorb = 0;\n    let candidateArea = 0, particleDensity = 0, maxJitVol = 0;\n    const speed = Math.hypot(velocity.x, velocity.y, velocity.z);\n    const hSpeed = Math.hypot(velocity.x, velocity.z);\n    const r2 = Math.max(0.0001, radius * radius);\n    const cellArea = (2 * poolX / CPU_SAMPLE_SIZE) * (2 * poolZ / CPU_SAMPLE_SIZE);\n\n    for (let z = 0; z < CPU_SAMPLE_SIZE; z++) {\n      const wz = (((z + 0.5) / CPU_SAMPLE_SIZE) * 2 - 1) * poolZ;\n      const row = z * CPU_SAMPLE_SIZE;\n      for (let x = 0; x < CPU_SAMPLE_SIZE; x++) {\n        const id = row + x;\n        const wx = (((x + 0.5) / CPU_SAMPLE_SIZE) * 2 - 1) * poolX;\n        const dx = wx - center.x;\n        const dz = wz - center.z;\n        const rr = dx * dx + dz * dz;\n        const inside = rr < r2;\n        const surfaceY = height[id];\n        let sigma = 0;\n        let bodyFlux = fields.bodyFlux[id] * decayFast;\n        let contact = fields.contact[id] * decayFast;\n        let pressure = fields.pressure[id] * decayFast;\n        let wakeCurl = fields.wakeCurl[id] * decayFast;\n        let risk = fields.risk[id] * decayFast;\n        const absorb = fields.absorb[id] * decayAbsorb;\n        fields.absorb[id] = absorb;\n\n        if (inside) {\n          const chord = Math.sqrt(Math.max(0, r2 - rr));\n          const bottom = center.y - chord;\n          const top = center.y + chord;\n          const span = Math.max(0.001, top - bottom);\n          const wet = Math.max(0, Math.min(span, surfaceY - bottom));\n          sigma = wet / span;\n          const radialLen = Math.sqrt(Math.max(1e-8, rr));\n          const nx = radialLen > 1e-5 ? dx / radialLen : 0;\n          const nz = radialLen > 1e-5 ? dz / radialLen : 0;\n          const radialVel = velocity.x * nx + velocity.z * nz;\n          const verticalEntry = Math.max(0, -velocity.y);\n          const waterlineBand = 4 * sigma * (1 - sigma);\n          const contactNow = Math.max(0, Math.min(1, waterlineBand * (0.35 + Math.min(1.5, speed) * 0.35 + verticalEntry * 0.25)));\n          const sigmaDot = (sigma - fields.prevSigma[id]) / dtSafe;\n          const normalFlux = radialVel * waterlineBand + velocity.y * Math.max(0, sigmaDot) * 0.05;\n          const tangential = Math.abs(velocity.x * -nz + velocity.z * nx);\n          bodyFlux = Math.max(-2.5, Math.min(2.5, bodyFlux * 0.35 + normalFlux));\n          wakeCurl = Math.max(-2.5, Math.min(2.5, wakeCurl * 0.55 + (tangential * waterlineBand * Math.sign(radialVel || 1))));\n          contact = Math.max(contact, contactNow);\n          pressure = Math.max(pressure, Math.min(2.5, contactNow * (0.28 + verticalEntry * 0.45 + hSpeed * 0.18) + Math.max(0, sigmaDot) * 0.006 + Math.abs(hVel[id]) * 2.0));\n          fields.sigmaDot[id] = sigmaDot;\n        } else {\n          fields.sigmaDot[id] *= decayFast;\n        }\n\n        fields.sigma[id] = sigma;\n        fields.bodyFlux[id] = bodyFlux;\n        fields.wakeCurl[id] = wakeCurl;\n        fields.contact[id] = contact;\n        fields.pressure[id] = pressure;\n\n        const particleTerm = Math.min(1.8, fields.particles[id] * 0.18);\n        particleDensity = Math.max(particleDensity, fields.particles[id]);\n        const sourceRisk = Math.max(0, -fields.sigmaDot[id]) * 0.004 + Math.abs(bodyFlux) * 0.08 + Math.abs(wakeCurl) * 0.06;\n        const targetElong = Math.max(0, contact * 0.35 + pressure * 0.22 + sourceRisk + absorb * 0.20);\n        fields.elongation[id] = Math.min(2.0, fields.elongation[id] * mem + targetElong * (1 - mem));\n        risk = Math.min(2.5, Math.max(risk, contact * 0.38 + pressure * 0.34 + fields.elongation[id] * 0.22 + particleTerm + absorb * 0.26));\n        fields.risk[id] = risk;\n\n        // \u2500\u2500 JIT reservoir update (aqua phase 7): risk beyond the threshold\n        // converts to failed-sheet volume; the reservoir persists with a slow\n        // leak; wave energy (|d-eta/dt| + crest height) sets ejection speed.\n        // Emission is damped where airborne particles are already dense so the\n        // settle->absorb->risk loop cannot self-sustain as rain. \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n        const thr = state.guidanceRiskThreshold;\n        const riskOver = Math.max(0, risk - thr) / Math.max(0.2, 2.5 - thr);\n        const neck = Math.min(2.2,\n          contact * 0.30 + pressure * 0.22 + fields.elongation[id] * 0.26 +\n          Math.abs(bodyFlux) * 0.12 + Math.abs(wakeCurl) * 0.08 + absorb * 0.08);\n        const waveEnergy = Math.abs(hVel[id]) * 26 + Math.max(0, surfaceY) * 1.6;\n        const crowding = 1 / (1 + fields.particles[id] * 0.5);\n        const failNow = riskOver * neck * jitRiskGain * (0.55 + Math.min(1.2, waveEnergy * 0.35)) * crowding;\n        fields.failVol[id] = Math.min(0.02, failNow * 0.0032);\n        fields.jitVol[id] = Math.max(fields.jitVol[id] * jitLeak, fields.failVol[id]);\n        fields.eject[id] = Math.min(3.0,\n          (Math.abs(bodyFlux) * 0.38 + pressure * 0.24 + waveEnergy * 0.30 +\n           fields.elongation[id] * 0.14 + absorb * 0.06) * (0.35 + riskOver));\n        if (fields.jitVol[id] > maxJitVol) maxJitVol = fields.jitVol[id];\n\n        maxRisk = Math.max(maxRisk, risk);\n        maxContact = Math.max(maxContact, contact);\n        maxPressure = Math.max(maxPressure, pressure);\n        maxElongation = Math.max(maxElongation, fields.elongation[id]);\n        maxAbsorb = Math.max(maxAbsorb, absorb);\n        if (risk > state.guidanceRiskThreshold) candidateArea += cellArea;\n      }\n    }\n\n    const localRisk = sampleArrayNearest(fields.risk, center.x, center.z);\n    const localContact = sampleArrayNearest(fields.contact, center.x, center.z);\n    const localPressure = sampleArrayNearest(fields.pressure, center.x, center.z);\n    const localElongation = sampleArrayNearest(fields.elongation, center.x, center.z);\n    const localBodyFlux = sampleArrayNearest(fields.bodyFlux, center.x, center.z);\n    const localWakeCurl = sampleArrayNearest(fields.wakeCurl, center.x, center.z);\n    const riskExcess = Math.max(0, localRisk - state.guidanceRiskThreshold);\n    const releaseGate = state.heightfieldGuidanceEnabled\n      ? Math.max(0.15, 1 + state.guidanceReleaseGain * (riskExcess + localPressure * state.guidancePressureGain + localElongation * state.guidanceElongationGain) * 0.65)\n      : 1;\n    const stats: HeightfieldGuidanceStats = {\n      localRisk,\n      localContact,\n      localPressure,\n      localElongation,\n      localBodyFlux,\n      localWakeCurl,\n      maxRisk,\n      maxContact,\n      maxPressure,\n      maxElongation,\n      maxAbsorb,\n      candidateArea,\n      releaseGate,\n      particleDensity,\n      maxJitVol,\n      jitEmitted: state.heightfieldGuidance?.jitEmitted ?? 0,\n      frame: ++guidanceFrame.current,\n    };\n\n    const now = performance.now();\n    if (now - lastGuidanceSnapshot.current > 95) {\n      lastGuidanceSnapshot.current = now;\n      waterStore.set({\n        heightfieldGuidance: stats,\n        heightfieldMap: {\n          size: CPU_SAMPLE_SIZE,\n          mode: state.heightfieldOverlayMode,\n          fields: {\n            height,\n            velocity: hVel,\n            sigma: fields.sigma,\n            sigmaDot: fields.sigmaDot,\n            contact: fields.contact,\n            pressure: fields.pressure,\n            risk: fields.risk,\n            elongation: fields.elongation,\n            bodyFlux: fields.bodyFlux,\n            wakeCurl: fields.wakeCurl,\n            particles: fields.particles,\n            absorb: fields.absorb,\n            failVol: fields.failVol,\n            jitVol: fields.jitVol,\n            eject: fields.eject,\n          },\n          stats,\n          poolHalfSize: [poolX, poolZ],\n          updatedAt: now,\n        },\n      });\n    } else {\n      waterStore.get().heightfieldGuidance = stats;\n    }\n    return stats;\n  }, [poolX, poolZ, sampleArrayNearest, toPoolUx, toPoolUz]);\n\n  const updateNormals = useCallback(() => {\n    if (!targetA.current) return;\n    normalMaterial.current.uniforms.tSim.value = targetA.current.texture;\n    renderPass(normalMaterial.current);\n  }, [renderPass]);\n\n  const sampleHeight = useCallback((x: number, z: number) => {\n    const u = Math.max(0, Math.min(CPU_SAMPLE_SIZE - 1.001, toPoolUx(x) * CPU_SAMPLE_SIZE - 0.5));\n    const v = Math.max(0, Math.min(CPU_SAMPLE_SIZE - 1.001, toPoolUz(z) * CPU_SAMPLE_SIZE - 0.5));\n    const x0 = Math.floor(u), z0 = Math.floor(v);\n    const x1 = Math.min(CPU_SAMPLE_SIZE - 1, x0 + 1), z1 = Math.min(CPU_SAMPLE_SIZE - 1, z0 + 1);\n    const tx = u - x0, tz = v - z0;\n    const h = cpuHeight.current;\n    const h00 = h[z0 * CPU_SAMPLE_SIZE + x0], h10 = h[z0 * CPU_SAMPLE_SIZE + x1];\n    const h01 = h[z1 * CPU_SAMPLE_SIZE + x0], h11 = h[z1 * CPU_SAMPLE_SIZE + x1];\n    return (h00 * (1 - tx) + h10 * tx) * (1 - tz) + (h01 * (1 - tx) + h11 * tx) * tz;\n  }, [toPoolUx, toPoolUz]);\n\n  /**\n   * Continuous JIT emission from the heightfield energy layer (aqua phase 7).\n   *\n   * Instead of only multiplying discrete sphere-event spawns, the exportable\n   * reservoir (jitVol) and ejection-energy field decide where separated water\n   * is born. Cells are tournament-selected (hottest reservoir x energy x risk\n   * wins), the parcel carries the reservoir's volume, and the reservoir is\n   * depleted so the same cell cannot machine-gun. Fractional spawn budget\n   * accumulates in a carry so weak fields still fizz occasionally.\n   */\n  const emitFieldSplashes = useCallback((\n    dt: number,\n    sphereCenter: THREE.Vector3,\n    sphereVelocity: THREE.Vector3,\n    emit: (x: number, y: number, z: number, vx: number, vy: number, vz: number, vol: number, foam: boolean) => void,\n  ) => {\n    const state = waterStore.get();\n    if (!state.heightfieldGuidanceEnabled) return 0;\n    const params = state.mpmParams;\n    const gain = Math.max(0, params.jitSpawnGain ?? 1.0) * Math.max(0, state.splashIntensity);\n    if (gain <= 0) return 0;\n    const f = guidanceFields.current;\n    const dtSafe = Math.max(1 / 240, dt);\n    const launch = Math.max(0.08, params.launchSpeedScale ?? 1.0) * Math.sqrt(Math.max(0.35, (state.worldScale ?? 1.0) / 2.6));\n\n    let want = 0;\n    for (let i = 0; i < f.jitVol.length; i += 3) {\n      const excess = f.jitVol[i] - 0.00018;\n      if (excess > 0) want += excess * (0.3 + f.eject[i]);\n    }\n    jitSpawnCarry.current = Math.min(60, jitSpawnCarry.current + want * gain * dtSafe * 640);\n    const count = Math.min(26, Math.floor(jitSpawnCarry.current));\n    jitSpawnCarry.current -= count;\n\n    let emitted = 0;\n    const thr = state.guidanceRiskThreshold;\n    for (let n = 0; n < count; n++) {\n      let best = -1;\n      let bv = 0;\n      for (let k = 0; k < 18; k++) {\n        const ii = (Math.random() * f.jitVol.length) | 0;\n        const v = f.jitVol[ii] * (0.3 + f.eject[ii]) * Math.max(0, f.risk[ii] - thr * 0.82);\n        if (v > bv) { bv = v; best = ii; }\n      }\n      if (best < 0 || bv <= 1e-7) break;\n      const izc = Math.floor(best / CPU_SAMPLE_SIZE);\n      const ixc = best - izc * CPU_SAMPLE_SIZE;\n      const wx = (((ixc + 0.5) / CPU_SAMPLE_SIZE) * 2 - 1) * poolX + (Math.random() - 0.5) * (2 * poolX / CPU_SAMPLE_SIZE);\n      const wz = (((izc + 0.5) / CPU_SAMPLE_SIZE) * 2 - 1) * poolZ + (Math.random() - 0.5) * (2 * poolZ / CPU_SAMPLE_SIZE);\n      const e = Math.min(3, f.eject[best]);\n\n      // Launch = radial escape from the body + tangential shear + downhill\n      // surface-flow proxy (-grad h) + a bite of body velocity; lift from\n      // ejection energy. All Froude-scaled so worldScale keeps arcs coherent.\n      const dxs = wx - sphereCenter.x;\n      const dzs = wz - sphereCenter.z;\n      const rl = Math.hypot(dxs, dzs) + 1e-6;\n      const nx = dxs / rl;\n      const nz = dzs / rl;\n      const gxh = (sampleHeight(wx + 0.06, wz) - sampleHeight(wx - 0.06, wz)) / 0.12;\n      const gzh = (sampleHeight(wx, wz + 0.06) - sampleHeight(wx, wz - 0.06)) / 0.12;\n      const side = Math.random() - 0.5;\n      const vx = (nx * e * 0.42 - nz * side * 0.55 - gxh * 1.6 + sphereVelocity.x * 0.10) * launch;\n      const vz = (nz * e * 0.42 + nx * side * 0.55 - gzh * 1.6 + sphereVelocity.z * 0.10) * launch;\n      const vy = (0.34 + e * 0.58 + Math.random() * 0.18) * launch;\n      const vol = Math.min(9.5e-4, Math.max(8e-6, f.jitVol[best] * 0.9 * (0.5 + Math.random() * 0.9)));\n      emit(wx, sampleHeight(wx, wz) + 0.012, wz, vx, vy, vz, vol, e > 1.15 || Math.random() < 0.3);\n      f.jitVol[best] *= 0.72;\n      f.failVol[best] *= 0.8;\n      emitted++;\n    }\n    waterStore.get().heightfieldGuidance.jitEmitted = emitted;\n    return emitted;\n  }, [poolX, poolZ, sampleHeight]);\n\n  const getTexture = useCallback(() => targetA.current?.texture, []);\n\n  return { addDrop, moveSphere, stepSimulation, updateNormals, getTexture, sampleHeight, coupleMpmParticles, updateHeightfieldGuidance, recordMpmAbsorb, emitFieldSplashes };\n}\n","/src/lib/mlsmpm.ts":"/**\n * Reference-style MLS-MPM splash solver for the pool hybrid.\n *\n * This follows the provided WebGPU MLS-MPM blueprint much more closely than\n * the failed shortcut version:\n *   1. clear sparse grid\n *   2. P2G mass + APIC momentum\n *   3. density gather + pressure/viscosity stress P2G\n *   4. grid forces/boundaries/sphere collider\n *   5. G2P APIC transfer + particle advection\n *\n * Particles are stored in pool/world coordinates, while the MLS-MPM kernel\n * evaluates the same quadratic 3x3x3 stencil in grid-cell coordinates used by\n * the reference. The grid remains sparse: only nodes touched by particles are\n * processed or cleared, so MLS-MPM stays event-local around splashes/breaches.\n */\n\nimport * as THREE from 'three';\nimport { waterStore } from './waterStore';\n\nexport const MPM_GRID_RES = 128;\nexport const MPM_GRID_X = 128;\nexport const MPM_GRID_Y = 96;\nexport const MPM_GRID_Z = 128;\n\n// Large enough for scaled pool/sphere worlds while keeping particles at a fixed valid kernel size.\nexport const MPM_DOMAIN_XZ_MIN = -5.2;\nexport const MPM_DOMAIN_XZ_MAX = 5.2;\nexport const MPM_DOMAIN_Y_MIN = -4.2;\nexport const MPM_DX = (MPM_DOMAIN_XZ_MAX - MPM_DOMAIN_XZ_MIN) / MPM_GRID_X;\nexport const MPM_INV_DX = 1.0 / MPM_DX;\nexport const MPM_DOMAIN_Y_MAX = MPM_DOMAIN_Y_MIN + MPM_GRID_Y * MPM_DX;\n\nexport const POOL_FLOOR_Y = -1.0;\nexport const POOL_RIM_Y = 2.0 / 12.0;\nexport const POOL_HALF_EXTENT = 1.0;\nconst runtimePoolHalfExtents = () => {\n  const s = waterStore.get();\n  return {\n    x: Math.max(0.5, Math.min(20.0, (s.poolWidth ?? s.poolScale) * (s.worldScale ?? 1.0))),\n    z: Math.max(0.5, Math.min(20.0, (s.poolDepth ?? s.poolScale) * (s.worldScale ?? 1.0))),\n  };\n};\nconst runtimePoolFloorY = () => {\n  const s = waterStore.get();\n  return -Math.max(0.25, Math.min(10.0, (s.poolWaterDepth ?? 1.0) * (s.worldScale ?? 1.0)));\n};\n\nconst PARTICLE_MASS = 1.0;\nconst REST_DENSITY = 3.0;\nconst STIFFNESS = 50.0;\nconst DYNAMIC_VISCOSITY = 0.1;\nconst DEFAULT_GRAVITY = -3.4;\nconst WALL_STIFFNESS = 18.0;\nconst WALL_DAMPING = 0.42;\nconst PARTICLE_LIFETIME = 3.2;\nconst DEFAULT_MAX_VELOCITY = 8.5;\nconst SURFACE_Y = 0.0;\nconst GOLDEN_ANGLE = Math.PI * (3.0 - Math.sqrt(5.0));\n\n// \u2500\u2500 True particle-relative scale: parcels carry real fluid volume \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Rendered droplet radius derives from carried volume (r = cbrt(3V/4pi)), so\n// splash thickness is set by the energy and volume of the ejected fluid and by\n// how it breaks up, not by a global sprite size.\nexport const DEFAULT_PARCEL_VOL = 1.4e-4; // ~3.2cm-radius parcel\nexport const MIN_PARCEL_VOL = 4.0e-6;     // ~1cm-radius mist floor\nexport const parcelRadius = (vol: number) => Math.cbrt(Math.max(1e-9, vol) * 0.2387324);\n\n// Froude-consistent scaling: launch speeds ~ sqrt(L), gravity ~ L, relative to\n// the tuned baseline worldScale so default behavior is unchanged at 2.6.\nconst BASE_WORLD_SCALE = 2.6;\nconst froudeSpeedScale = () => Math.sqrt(Math.max(0.35, (waterStore.get().worldScale ?? 1.0) / BASE_WORLD_SCALE));\nexport const gravityWorldScale = () => Math.max(0.35, (waterStore.get().worldScale ?? 1.0) / BASE_WORLD_SCALE);\n\nexport const FLAG_ALIVE = 1 << 0;\nexport const FLAG_AIRBORNE = 1 << 1;\nexport const FLAG_FOAM = 1 << 2;\n\nexport class MpmParticles {\n  capacity: number;\n  count = 0;\n  next = 0;\n\n  px: Float32Array; py: Float32Array; pz: Float32Array;\n  vx: Float32Array; vy: Float32Array; vz: Float32Array;\n  cxx: Float32Array; cxy: Float32Array; cxz: Float32Array;\n  cyx: Float32Array; cyy: Float32Array; cyz: Float32Array;\n  czx: Float32Array; czy: Float32Array; czz: Float32Array;\n  density: Float32Array;\n  life: Float32Array;\n  floorAge: Float32Array;\n  flags: Uint8Array;\n  /** Carried fluid volume per parcel; the renderer derives droplet radius from it. */\n  vol: Float32Array;\n\n  constructor(capacity: number) {\n    this.capacity = capacity;\n    const f = () => new Float32Array(capacity);\n    this.px = f(); this.py = f(); this.pz = f();\n    this.vx = f(); this.vy = f(); this.vz = f();\n    this.cxx = f(); this.cxy = f(); this.cxz = f();\n    this.cyx = f(); this.cyy = f(); this.cyz = f();\n    this.czx = f(); this.czy = f(); this.czz = f();\n    this.density = f();\n    this.life = f();\n    this.floorAge = f();\n    this.flags = new Uint8Array(capacity);\n    this.vol = f();\n  }\n\n  spawn(x: number, y: number, z: number, vx: number, vy: number, vz: number, foam = false, vol = DEFAULT_PARCEL_VOL): number {\n    let i: number;\n    if (this.count < this.capacity) {\n      i = this.count++;\n    } else {\n      i = this.next;\n      this.next = (this.next + 1) % this.capacity;\n    }\n\n    this.px[i] = x; t
