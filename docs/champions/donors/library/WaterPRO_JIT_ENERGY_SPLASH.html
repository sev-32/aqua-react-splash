  <script type="application/json" id="water-source-archive">{"/src/components/DraggableSphere.tsx":"import { useRef, useState, useMemo } from 'react';\nimport * as THREE from 'three';\nimport { useFrame, useThree, ThreeEvent } from '@react-three/fiber';\nimport { sphereVertexShader, sphereRenderFragmentShader } from '../shaders/waterShaders';\n\ninterface DraggableSphereProps {\n  position: THREE.Vector3;\n  radius: number;\n  waterTexture: THREE.Texture | undefined;\n  causticsTexture: THREE.Texture | undefined;\n  tilesTexture: THREE.Texture;\n  light: THREE.Vector3;\n  poolHalfSize: THREE.Vector2;\n  poolDepthY: number;\n  causticsEnabled: boolean;\n  onMove: (position: THREE.Vector3) => void;\n}\n\nexport function DraggableSphere({\n  position,\n  radius,\n  waterTexture,\n  causticsTexture,\n  tilesTexture,\n  light,\n  poolHalfSize,\n  poolDepthY,\n  causticsEnabled,\n  onMove,\n}: DraggableSphereProps) {\n  const { camera, raycaster } = useThree();\n  const hitMeshRef = useRef<THREE.Mesh>(null);\n  const [isDragging, setIsDragging] = useState(false);\n  const dragPlane = useRef(new THREE.Plane());\n  const dragOffset = useRef(new THREE.Vector3());\n\n  // Unit sphere \u2014 vertex shader scales/positions in world space.\n  const geometry = useMemo(() => new THREE.SphereGeometry(1, 64, 64), []);\n\n  const material = useMemo(() => new THREE.ShaderMaterial({\n    vertexShader: sphereVertexShader,\n    fragmentShader: sphereRenderFragmentShader,\n    uniforms: {\n      water: { value: null },\n      tiles: { value: tilesTexture },\n      causticTex: { value: null },\n      light: { value: new THREE.Vector3() },\n      sphereCenter: { value: new THREE.Vector3() },\n      sphereRadius: { value: radius },\n      sphereCenterU: { value: new THREE.Vector3() },\n      sphereRadiusU: { value: radius },\n      poolHalfSize: { value: poolHalfSize.clone() },\n      poolDepthY: { value: poolDepthY },\n      causticsEnabled: { value: causticsEnabled ? 1.0 : 0.0 },\n    },\n  }), [radius, tilesTexture, poolHalfSize, poolDepthY, causticsEnabled]);\n\n  const hitMaterial = useMemo(() => new THREE.MeshBasicMaterial({\n    transparent: true,\n    opacity: 0,\n    depthWrite: false,\n  }), []);\n\n  useFrame(() => {\n    if (waterTexture) material.uniforms.water.value = waterTexture;\n    material.uniforms.causticTex.value = causticsEnabled ? (causticsTexture ?? null) : null;\n    material.uniforms.light.value.copy(light);\n    material.uniforms.sphereCenter.value.copy(position);\n    material.uniforms.sphereCenterU.value.copy(position);\n    material.uniforms.sphereRadius.value = radius;\n    material.uniforms.sphereRadiusU.value = radius;\n    material.uniforms.poolHalfSize.value.copy(poolHalfSize);\n    material.uniforms.poolDepthY.value = poolDepthY;\n    material.uniforms.causticsEnabled.value = causticsEnabled ? 1.0 : 0.0;\n\n    if (hitMeshRef.current) {\n      hitMeshRef.current.position.copy(position);\n      hitMeshRef.current.scale.setScalar(radius);\n    }\n  });\n\n  const handlePointerDown = (event: ThreeEvent<PointerEvent>) => {\n    event.stopPropagation();\n    setIsDragging(true);\n    (event.target as Element).setPointerCapture?.(event.pointerId);\n\n    const cameraDirection = new THREE.Vector3();\n    camera.getWorldDirection(cameraDirection);\n    dragPlane.current.setFromNormalAndCoplanarPoint(cameraDirection.negate(), position);\n\n    const intersection = new THREE.Vector3();\n    raycaster.ray.intersectPlane(dragPlane.current, intersection);\n    dragOffset.current.subVectors(position, intersection);\n  };\n\n  const handlePointerMove = (event: ThreeEvent<PointerEvent>) => {\n    if (!isDragging) return;\n\n    const intersection = new THREE.Vector3();\n    if (raycaster.ray.intersectPlane(dragPlane.current, intersection)) {\n      const newPosition = intersection.add(dragOffset.current);\n      newPosition.x = Math.max(radius - poolHalfSize.x, Math.min(poolHalfSize.x - radius, newPosition.x));\n      newPosition.y = Math.max(radius - poolDepthY, Math.min(1, newPosition.y));\n      newPosition.z = Math.max(radius - poolHalfSize.y, Math.min(poolHalfSize.y - radius, newPosition.z));\n      onMove(newPosition);\n    }\n  };\n\n  const handlePointerUp = () => setIsDragging(false);\n\n  return (\n    <>\n      <mesh geometry={geometry} material={material} raycast={() => null} />\n      <mesh\n        ref={hitMeshRef}\n        geometry={geometry}\n        material={hitMaterial}\n        onPointerDown={handlePointerDown}\n        onPointerMove={handlePointerMove}\n        onPointerUp={handlePointerUp}\n        onPointerLeave={handlePointerUp}\n      />\n    </>\n  );\n}\n","/src/components/NavLink.tsx":"import { NavLink as RouterNavLink, NavLinkProps } from \"react-router-dom\";\nimport { forwardRef } from \"react\";\nimport { cn } from \"@/lib/utils\";\n\ninterface NavLinkCompatProps extends Omit<NavLinkProps, \"className\"> {\n  className?: string;\n  activeClassName?: string;\n  pendingClassName?: string;\n}\n\nconst NavLink = forwardRef<HTMLAnchorElement, NavLinkCompatProps>(\n  ({ className, activeClassName, pendingClassName, to, ...props }, ref) => {\n    return (\n      <RouterNavLink\n        ref={ref}\n        to={to}\n        className={({ isActive, isPending }) =>\n          cn(className, isActive && activeClassName, isPending && pendingClassName)\n        }\n        {...props}\n      />\n    );\n  },\n);\n\nNavLink.displayName = \"NavLink\";\n\nexport { NavLink };\n","/src/components/PoolEnvironment.tsx":"import { useMemo } from 'react';\nimport * as THREE from 'three';\nimport { useFrame } from '@react-three/fiber';\nimport { cubeVertexShader, cubeFragmentShader } from '../shaders/waterShaders';\n\ninterface PoolEnvironmentProps {\n  waterTexture: THREE.Texture | undefined;\n  causticsTexture: THREE.Texture | undefined;\n  tilesTexture: THREE.Texture;\n  light: THREE.Vector3;\n  sphereCenter: THREE.Vector3;\n  sphereRadius: number;\n  poolHalfSize: THREE.Vector2;\n  poolDepthY: number;\n  causticsEnabled: boolean;\n}\n\n/**\n * Open-top unit cube in [-1,1]\u00b3, with the +Y face removed.\n * The vertex shader remaps y via ((1 - y) * 7/12 - 1) so:\n *   - original y = +1 \u2192 world y = -1   (pool floor)\n *   - original y = -1 \u2192 world y = 2/12 \u2248 0.167  (top of walls, just above water)\n * Rendered with FrontSide because we removed the ceiling and view from outside.\n */\nfunction createOpenCube(halfX = 1, halfZ = 1): THREE.BufferGeometry {\n  // 6 faces \u00d7 2 tris \u00d7 3 verts = 36 verts \u2014 but we omit +Y face (6 verts)\n  // CCW winding when viewed from outside the cube.\n  const v = (x: number, y: number, z: number) => [x * halfX, y, z * halfZ];\n\n  const positions: number[] = [];\n\n  const push = (a: number[], b: number[], c: number[]) => {\n    positions.push(...a, ...b, ...c);\n  };\n\n  // -Y (floor in source space, becomes top of walls after remap, y=2/12)\n  // We KEEP this \u2014 it's the inner ceiling? No \u2014 we want to keep what's visible.\n  // The original removed the +Y face. After the y-remap, +Y(=1) \u2192 world y=-1 (floor).\n  // So the removed face would actually be the FLOOR after remap. That's wrong.\n  // Let me re-check: splice(4, 2) on GL.Mesh.cube \u2014 depends on face order.\n  // Empirically: in the original demo you SEE the pool floor and walls, not a roof.\n  // So the kept faces include the floor. Let me just build all 6 and remove the\n  // one that becomes the visible \"ceiling\" after remap (i.e., original -Y, which\n  // maps to world y = 2/12, and would face downward = invisible from above anyway,\n  // but visible from below \u2014 that's the rim ceiling we don't want).\n  //\n  // CONCLUSION: remove the original -Y face (so original Y range becomes (-,1]\n  // and after remap world Y range becomes [-1, 2/12) where the ceiling at 2/12\n  // is open). Keep: +Y (floor), \u00b1X, \u00b1Z (walls).\n\n  // +Y face (original) \u2192 world y=-1 (FLOOR) \u2014 KEEP. Normal points +Y in source, but\n  // after y-flip in remap the visible side faces upward (toward camera). We want\n  // the inside surface visible. With FrontSide rendering, winding must be CCW from\n  // the camera/inside. After the remap inverts Y, original CCW becomes CW. So we\n  // build with CW in source space to end up CCW after the flip.\n  //\n  // Easier: just use DoubleSide and not worry about it. Performance is fine.\n\n  // +Y face (source y=1)  \u2192 world y=-1 (FLOOR)\n  push(v(-1, 1, -1), v( 1, 1, -1), v( 1, 1,  1));\n  push(v(-1, 1, -1), v( 1, 1,  1), v(-1, 1,  1));\n\n  // -X face (source x=-1) \u2192 wall\n  push(v(-1, -1, -1), v(-1, 1, -1), v(-1, 1,  1));\n  push(v(-1, -1, -1), v(-1, 1,  1), v(-1, -1,  1));\n\n  // +X face\n  push(v( 1, -1,  1), v( 1, 1,  1), v( 1, 1, -1));\n  push(v( 1, -1,  1), v( 1, 1, -1), v( 1, -1, -1));\n\n  // -Z face\n  push(v(-1, -1, -1), v( 1, -1, -1), v( 1, 1, -1));\n  push(v(-1, -1, -1), v( 1, 1, -1), v(-1, 1, -1));\n\n  // +Z face\n  push(v( 1, -1,  1), v(-1, -1,  1), v(-1, 1,  1));\n  push(v( 1, -1,  1), v(-1, 1,  1), v( 1, 1,  1));\n\n  // We do NOT push the -Y face \u2014 that's the open top.\n\n  const geom = new THREE.BufferGeometry();\n  geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));\n  geom.computeVertexNormals();\n  return geom;\n}\n\nexport function PoolEnvironment({\n  waterTexture,\n  causticsTexture,\n  tilesTexture,\n  light,\n  sphereCenter,\n  sphereRadius,\n  poolHalfSize,\n  poolDepthY,\n  causticsEnabled,\n}: PoolEnvironmentProps) {\n  const geometry = useMemo(() => createOpenCube(poolHalfSize.x, poolHalfSize.y), [poolHalfSize.x, poolHalfSize.y]);\n\n  const material = useMemo(() => new THREE.ShaderMaterial({\n    vertexShader: cubeVertexShader,\n    fragmentShader: cubeFragmentShader,\n    uniforms: {\n      water: { value: null },\n      tiles: { value: tilesTexture },\n      causticTex: { value: null },\n      light: { value: new THREE.Vector3() },\n      sphereCenter: { value: new THREE.Vector3() },\n      sphereRadius: { value: 0.25 },\n      poolDepthY: { value: poolDepthY },\n      causticsEnabled: { value: causticsEnabled ? 1.0 : 0.0 },\n      poolHalfSize: { value: poolHalfSize.clone() },\n    },\n    side: THREE.BackSide,\n  }), [tilesTexture, poolHalfSize, poolDepthY, causticsEnabled]);\n\n  useFrame(() => {\n    if (waterTexture) material.uniforms.water.value = waterTexture;\n    material.uniforms.causticTex.value = causticsEnabled ? (causticsTexture ?? null) : null;\n    material.uniforms.light.value.copy(light);\n    material.uniforms.sphereCenter.value.copy(sphereCenter);\n    material.uniforms.sphereRadius.value = sphereRadius;\n    material.uniforms.poolHalfSize.value.copy(poolHalfSize);\n    material.uniforms.poolDepthY.value = poolDepthY;\n    material.uniforms.causticsEnabled.value = causticsEnabled ? 1.0 : 0.0;\n  });\n\n  return <mesh geometry={geometry} material={material} renderOrder={0} />;\n}\n","/src/components/SplashParticles.tsx":"import { useEffect, useMemo, useRef } from 'react';\nimport * as THREE from 'three';\nimport { useFrame } from '@react-three/fiber';\nimport { MarchingCubes } from 'three-stdlib';\nimport { splashWaterFragmentShader, splashWaterVertexShader } from '../shaders/waterShaders';\nimport { MpmConnectivityGraph } from '../lib/mpmConnectivity';\nimport { waterStore } from '../lib/waterStore';\nimport {\n  MlsMpmSolver,\n  FLAG_ALIVE,\n  FLAG_FOAM,\n  MPM_DOMAIN_Y_MAX,\n} from '../lib/mlsmpm';\n\ninterface SplashParticlesProps {\n  solver: MlsMpmSolver;\n  light: THREE.Vector3;\n  waterTexture: THREE.Texture | undefined;\n  causticsTexture: THREE.Texture | undefined;\n  tilesTexture: THREE.Texture;\n  skyTexture: THREE.CubeTexture;\n  eye: THREE.Vector3;\n  sphereCenter: THREE.Vector3;\n  sphereRadius: number;\n  poolHalfSize: THREE.Vector2;\n  poolDepthY: number;\n  causticsEnabled: boolean;\n}\n\nconst MAX_SURFACE_SAMPLES = 1400;\nconst MARCH_RESOLUTION = 96;\n\n/**\n * JIT tight-fit render volume.\n *\n * The old renderer stretched one MarchingCubes lattice over the whole MPM\n * domain, so a voxel was ~0.11 world units and no droplet or tendril could\n * render thinner than ~2 voxels \u2014 that is why splash fluid looked fat and why\n * shrinking the kernel below 1 collapsed into diamond artifacts.\n *\n * Now the lattice is re-fit every frame to the axis-aligned bounds of the LIVE\n * particles (a cube, so voxels stay isotropic and normals stay valid). A\n * localized crown splash gets voxels ~4-10x finer, which is what lets true\n * fine spray and hair-thin tendrils exist. Droplet radii are specified in\n * world units derived from each parcel's carried fluid volume, and converted\n * to metaball strength against the current box size, so droplet size is\n * invariant to how the box breathes. Growth snaps instantly (never clip a new\n * splash), contraction eases slowly (no visible pumping).\n */\ninterface FitBox {\n  has: boolean;\n  minX: number; maxX: number;\n  minY: number; maxY: number;\n  minZ: number; maxZ: number;\n  emptyFrames: number;\n}\n\nconst MIN_HALF = 0.55;\nconst MAX_HALF = 8.0;\nconst SHRINK_RATE = 0.055;\n\nconst clamp01 = (v: number) => Math.max(0.001, Math.min(0.999, v));\n\nexport function SplashParticles({\n  solver,\n  light,\n  waterTexture,\n  causticsTexture,\n  tilesTexture,\n  skyTexture,\n  eye,\n  sphereCenter,\n  sphereRadius,\n  poolHalfSize,\n  poolDepthY,\n  causticsEnabled,\n}: SplashParticlesProps) {\n  const material = useMemo(() => new THREE.ShaderMaterial({\n    vertexShader: splashWaterVertexShader,\n    fragmentShader: splashWaterFragmentShader,\n    uniforms: {\n      water: { value: null as THREE.Texture | null },\n      tiles: { value: tilesTexture },\n      causticTex: { value: null as THREE.Texture | null },\n      sky: { value: skyTexture },\n      eye: { value: new THREE.Vector3() },\n      light: { value: new THREE.Vector3() },\n      sphereCenter: { value: new THREE.Vector3() },\n      sphereRadius: { value: sphereRadius },\n      uReflectionStrength: { value: 1.0 },\n      uRefractionStrength: { value: 1.0 },\n      uColorMix: { value: 1.0 },\n      poolHalfSize: { value: poolHalfSize.clone() },\n      poolDepthY: { value: poolDepthY },\n      causticsEnabled: { value: causticsEnabled ? 1.0 : 0.0 },\n    },\n    side: THREE.DoubleSide,\n    depthWrite: true,\n  }), [tilesTexture, skyTexture, sphereRadius, poolHalfSize, poolDepthY, causticsEnabled]);\n\n  const surface = useMemo(() => {\n    const mesh = new MarchingCubes(MARCH_RESOLUTION, material, false, false, 220000);\n    mesh.isolation = 80;\n    mesh.frustumCulled = false;\n    mesh.renderOrder = 4;\n    mesh.visible = false;\n    return mesh;\n  }, [material]);\n\n  const scratch = useRef({\n    ids: new Int32Array(MAX_SURFACE_SAMPLES),\n    connectivity: new MpmConnectivityGraph(),\n    box: { has: false, minX: 0, maxX: 0, minY: 0, maxY: 0, minZ: 0, maxZ: 0, emptyFrames: 0 } as FitBox,\n  });\n\n  useEffect(() => () => {\n    surface.geometry.dispose();\n    material.dispose();\n  }, [surface, material]);\n\n  useFrame(() => {\n    const P = solver.particles;\n    const S = scratch.current;\n    const store = waterStore.get();\n    const params = store.mpmParams;\n    const kernelMul = Math.max(0.2, params.particleSize || 1.0);\n\n    // \u2500\u2500 1. Select live samples and measure their bounds \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    let samples = 0;\n    let minX = Infinity, maxX = -Infinity;\n    let minY = Infinity, maxY = -Infinity;\n    let minZ = Infinity, maxZ = -Infinity;\n    let maxVol = 0;\n    for (let i = 0; i < P.count && samples < MAX_SURFACE_SAMPLES; i++) {\n      if (!(P.flags[i] & FLAG_ALIVE)) continue;\n      if (P.py[i] < -poolDepthY - 0.25 || P.py[i] > MPM_DOMAIN_Y_MAX - 0.03) continue;\n      S.ids[samples] = i;\n      samples++;\n      if (P.px[i] < minX) minX = P.px[i];\n      if (P.px[i] > maxX) maxX = P.px[i];\n      if (P.py[i] < minY) minY = P.py[i];\n      if (P.py[i] > maxY) maxY = P.py[i];\n      if (P.pz[i] < minZ) minZ = P.pz[i];\n      if (P.pz[i] > maxZ) maxZ = P.pz[i];\n      if (P.vol[i] > maxVol) maxVol = P.vol[i];\n    }\n\n    const box = S.box;\n    if (samples === 0) {\n      box.emptyFrames++;\n      if (box.emptyFrames > 40) box.has = false;\n      surface.visible = false;\n      return;\n    }\n    box.emptyFrames = 0;\n\n    // \u2500\u2500 2. Fit the render cube: instant growth, eased contraction \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    const maxParcelR = Math.cbrt(Math.max(1e-9, maxVol) * 0.2387324) * kernelMul;\n    const pad = Math.max(0.16, params.breakRadius * 1.35, maxParcelR * 3.0);\n    const tMinX = minX - pad, tMaxX = maxX + pad;\n    const tMinY = minY - pad, tMaxY = maxY + pad;\n    const tMinZ = minZ - pad, tMaxZ = maxZ + pad;\n    if (!box.has) {\n      box.has = true;\n      box.minX = tMinX; box.maxX = tMaxX;\n      box.minY = tMinY; box.maxY = tMaxY;\n      box.minZ = tMinZ; box.maxZ = tMaxZ;\n    } else {\n      box.minX = tMinX < box.minX ? tMinX : box.minX + (tMinX - box.minX) * SHRINK_RATE;\n      box.maxX = tMaxX > box.maxX ? tMaxX : box.maxX + (tMaxX - box.maxX) * SHRINK_RATE;\n      box.minY = tMinY < box.minY ? tMinY : box.minY + (tMinY - box.minY) * SHRINK_RATE;\n      box.maxY = tMaxY > box.maxY ? tMaxY : box.maxY + (tMaxY - box.maxY) * SHRINK_RATE;\n      box.minZ = tMinZ < box.minZ ? tMinZ : box.minZ + (tMinZ - box.minZ) * SHRINK_RATE;\n      box.maxZ = tMaxZ > box.maxZ ? tMaxZ : box.maxZ + (tMaxZ - box.maxZ) * SHRINK_RATE;\n    }\n    const cx = (box.minX + box.maxX) * 0.5;\n    const cy = (box.minY + box.maxY) * 0.5;\n    const cz = (box.minZ + box.maxZ) * 0.5;\n    const half = Math.min(MAX_HALF, Math.max(\n      MIN_HALF,\n      (box.maxX - box.minX) * 0.5,\n      (box.maxY - box.minY) * 0.5,\n      (box.maxZ - box.minZ) * 0.5,\n    ));\n\n    const mapX = (x: number) => clamp01((x - (cx - half)) / (2 * half));\n    const mapY = (y: number) => clamp01((y - (cy - half)) / (2 * half));\n    const mapZ = (z: number) => clamp01((z - (cz - half)) / (2 * half));\n\n    surface.position.set(cx, cy, cz);\n    surface.scale.set(half, half, half);\n    surface.reset();\n    const iso = Math.max(10, params.metaballIsolation);\n    surface.isolation = iso;\n\n    // World radius -> metaball strength for the current box. Single-ball\n    // isosurface sits where strength/d^2 - subtract = isolation, so\n    // d_iso = sqrt(strength/(subtract+iso)) in normalized [0,1] box space.\n    const voxel = (2 * half) / MARCH_RESOLUTION;\n    const dropletFloorR = 0.85 * voxel;   // voxel floor: never emit sub-cell diamonds\n    const tendrilFloorR = 0.7 * voxel;\n    const maxR = half * 0.45;\n    const strengthFor = (worldR: number, subtract: number) => {\n      const rn = worldR / (2 * half);\n      return (subtract + iso) * rn * rn;\n    };\n\n    // \u2500\u2500 3. Tendrils + Rayleigh-Plateau satellites \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    S.connectivity.update(S.ids, samples, P.px, P.py, P.pz, params, 1 / 60);\n\n    const breaks = S.connectivity.breakEvents;\n    for (let k = 0; k < breaks.length && k < 24; k++) {\n      const e = breaks[k];\n      if (!(P.flags[e.a] & FLAG_ALIVE) || !(P.flags[e.b] & FLAG_ALIVE)) continue;\n      // A stretched filament snapped: pinch bridge fluid off both parents and\n      // release it as a satellite droplet with the bridge's velocity.\n      const pinch = Math.min(P.vol[e.a], P.vol[e.b]) * 0.16;\n      if (pinch < 2.5e-6) continue;\n      P.vol[e.a] = Math.max(2e-6, P.vol[e.a] - pinch * 0.5);\n      P.vol[e.b] = Math.max(2e-6, P.vol[e.b] - pinch * 0.5);\n      const t = 0.5 + (Math.random() - 0.5) * 0.24;\n      solver.spawnParcel(\n        P.px[e.a] + (P.px[e.b] - P.px[e.a]) * t,\n        P.py[e.a] + (P.py[e.b] - P.py[e.a]) * t,\n        P.pz[e.a] + (P.pz[e.b] - P.pz[e.a]) * t,\n        (P.vx[e.a] + P.vx[e.b]) * 0.5 + (Math.random() - 0.5) * 0.14,\n        (P.vy[e.a] + P.vy[e.b]) * 0.5 + (Math.random() - 0.5) * 0.10,\n        (P.vz[e.a] + P.vz[e.b]) * 0.5 + (Math.random() - 0.5) * 0.14,\n        pinch,\n        Math.random() < 0.5,\n      );\n    }\n\n    // \u2500\u2500 4. Droplets: radius from carried volume (true particle-relative) \u2500\u2500\u2500\n    const dropletSubtract = 14;\n    for (let n = 0; n < samples; n++) {\n      const i = S.ids[n];\n      const speed = Math.hypot(P.vx[i], P.vy[i], P.vz[i]);\n      let r = Math.cbrt(Math.max(1e-9, P.vol[i]) * 0.2387324) * kernelMul;\n      // Aerodynamic thinning: fast ejecta read slightly leaner in flight.\n      r *= 1 / (1 + Math.min(0.5, speed * 0.05));\n      r = Math.min(maxR, Math.max(dropletFloorR, r));\n      surface.addBall(mapX(P.px[i]), mapY(P.py[i]), mapZ(P.pz[i]), strengthFor(r, dropletSubtract), dropletSubtract);\n    }\n\n    // \u2500\u2500 5. Tendril bridges: volume-conserving waists that thin as they\n    //       stretch (Rayleigh-Plateau), never fatter than their parents \u2500\u2500\u2500\u2500\u2500\n    const tendrilSubtract = 24;\n    for (const c of S.connectivity.connections.values()) {\n      const L = Math.max(0.02, c.distance);\n      const bridgeVol = (P.vol[c.a] + P.vol[c.b]) * 0.5 * 0.62 * c.strength;\n      const rCore = Math.sqrt(bridgeVol / (Math.PI * L));\n      const parentR = Math.min(\n        Math.cbrt(Math.max(1e-9, P.vol[c.a]) * 0.2387324),\n        Math.cbrt(Math.max(1e-9, P.vol[c.b]) * 0.2387324),\n      ) * kernelMul;\n      const stretch = Math.max(0, Math.min(1, (c.distance - params.formRadius) / Math.max(1e-5, params.breakRadius - params.formRadius)));\n      const samplesAlong = Math.max(1, Math.round(params.tendrilSamples * (1 + stretch)));\n      for (let s = 1; s <= samplesAlong; s++) {\n        const t = s / (samplesAlong + 1);\n        const waist = Math.pow(Math.sin(Math.PI * t), params.tendrilThinPower);\n        let rT = rCore * (0.55 + 0.45 * waist) * kernelMul;\n        rT = Math.min(parentR * 0.85, Math.max(tendrilFloorR, rT));\n        surface.addBall(\n          mapX(P.px[c.a] + (P.px[c.b] - P.px[c.a]) * t),\n          mapY(P.py[c.a] + (P.py[c.b] - P.py[c.a]) * t),\n          mapZ(P.pz[c.a] + (P.pz[c.b] - P.pz[c.a]) * t),\n          strengthFor(rT, tendrilSubtract),\n          tendrilSubtract,\n        );\n      }\n    }\n\n    if (waterTexture) material.uniforms.water.value = waterTexture;\n    material.uniforms.causticTex.value = causticsEnabled ? (causticsTexture ?? null) : null;\n    material.uniforms.eye.value.copy(eye);\n    material.uniforms.light.value.copy(light);\n    material.uniforms.sphereCenter.value.copy(sphereCenter);\n    material.uniforms.sphereRadius.value = sphereRadius;\n    material.uniforms.poolHalfSize.value.copy(poolHalfSize);\n    material.uniforms.poolDepthY.value = poolDepthY;\n    material.uniforms.causticsEnabled.value = causticsEnabled ? 1.0 : 0.0;\n    material.uniforms.uReflectionStrength.value = params.reflectionStrength;\n    material.uniforms.uRefractionStrength.value = params.refractionStrength;\n    material.uniforms.uColorMix.value = params.colorMix;\n\n    surface.visible = true;\n    surface.update();\n  });\n\n  return <primitive object={surface} />;\n}\n","/src/components/WaterScene.tsx":"import { useRef, useEffect, useState, useMemo } from 'react';\nimport * as THREE from 'three';\nimport { useFrame, useThree } from '@react-three/fiber';\nimport { useWaterSimulation } from '../hooks/useWaterSimulation';\nimport { useCaustics } from '../hooks/useCaustics';\nimport { useMlsMpm } from '../hooks/useMlsMpm';\nimport { WaterSurface } from './WaterSurface';\nimport { PoolEnvironment } from './PoolEnvironment';\nimport { DraggableSphere } from './DraggableSphere';\nimport { SplashParticles } from './SplashParticles';\nimport { waterStore, waterCommands, useWaterStore } from '../lib/waterStore';\nimport { generateProceduralSky, generateTilesTexture } from '../lib/proceduralAssets';\n\n/**\n * WaterScene \u2014 orchestrates the hybrid sim.\n *\n * Layers:\n *   1. Height-field GPU sim (existing) \u2014 calm pool surface, ripples, refraction.\n *   2. MLS-MPM CPU particle sim (new) \u2014 splashes that spawn on impact events\n *      and settle back into the height field as small ripple drops.\n *   3. Sphere two-way coupling \u2014 sphere displaces height-field volume AND\n *      pushes particles. On water-line crossings, it spawns crown/sheet\n *      droplets and stamps a strong ripple.\n */\nexport function WaterScene() {\n  const { camera, gl, scene } = useThree();\n  const worldScale = useWaterStore((s) => s.worldScale ?? 1.0);\n  const basePoolWidth = useWaterStore((s) => s.poolWidth ?? s.poolScale);\n  const basePoolDepth = useWaterStore((s) => s.poolDepth ?? s.poolScale);\n  const basePoolDepthY = useWaterStore((s) => s.poolWaterDepth);\n  const poolWidth = basePoolWidth * worldScale;\n  const poolDepth = basePoolDepth * worldScale;\n  const poolDepthY = basePoolDepthY * worldScale;\n  const causticsEnabled = useWaterStore((s) => s.causticsEnabled);\n  const poolHalfSize = useMemo(() => new THREE.Vector2(poolWidth, poolDepth), [poolWidth, poolDepth]);\n  const waterSim = useWaterSimulation(poolHalfSize);\n  const caustics = useCaustics();\n  const mpm = useMlsMpm(14000);\n\n  const [initialized, setInitialized] = useState(false);\n  const lightDir = useRef(new THREE.Vector3(2.0, 2.0, -1.0).normalize());\n\n  const sphereCenter = useRef(new THREE.Vector3(-0.4 * worldScale, -0.75 * worldScale, 0.2 * worldScale));\n  const oldSphereCenter = useRef(new THREE.Vector3(-0.4 * worldScale, -0.75 * worldScale, 0.2 * worldScale));\n  const sphereVelocity = useRef(new THREE.Vector3());\n  const lastSphereY = useRef(sphereCenter.current.y);\n  const baseSphereRadius = useWaterStore((s) => s.sphereRadius);\n  const sphereRadius = baseSphereRadius * worldScale;\n  const lastWorldScale = useRef(worldScale);\n\n  const rippleCountRef = useRef(0);\n  const splashCountRef = useRef(0);\n  const fpsAccum = useRef({ frames: 0, last: performance.now() });\n  const lastFrameTime = useRef(performance.now());\n\n  // Procedural assets \u2014 no external files.\n  const tilesTexture = useMemo(() => generateTilesTexture(512), []);\n  const skyTexture = useMemo(() => generateProceduralSky(gl, 512), [gl]);\n\n  // Set the procedural sky as the scene background\n  useEffect(() => {\n    scene.background = skyTexture;\n    return () => { scene.background = null; };\n  }, [scene, skyTexture]);\n\n  useEffect(() => {\n    const prev = Math.max(1e-6, lastWorldScale.current);\n    const ratio = worldScale / prev;\n    if (Number.isFinite(ratio) && Math.abs(ratio - 1) > 1e-5) {\n      sphereCenter.current.multiplyScalar(ratio);\n      oldSphereCenter.current.multiplyScalar(ratio);\n      lastSphereY.current = sphereCenter.current.y;\n      const P = mpm.solver.particles;\n      for (let i = 0; i < P.count; i++) P.kill(i);\n      waterStore.set({ spherePos: [sphereCenter.current.x, sphereCenter.current.y, sphereCenter.current.z] });\n    }\n    lastWorldScale.current = worldScale;\n    camera.position.set(0.35 * worldScale, 1.15 * worldScale, 2.45 * worldScale);\n    camera.near = 0.01;\n    camera.far = Math.max(100, 90 * worldScale);\n    camera.updateProjectionMatrix();\n  }, [camera, mpm.solver.particles, worldScale]);\n\n  const seedDrops = (count = 20) => {\n    for (let i = 0; i < count; i++) {\n      const st = waterStore.get();\n      const width = (st.poolWidth ?? st.poolScale) * (st.worldScale ?? 1.0);\n      const depth = (st.poolDepth ?? st.poolScale) * (st.worldScale ?? 1.0);\n      const x = (Math.random() * 2 - 1) * width;\n      const y = (Math.random() * 2 - 1) * depth;\n      waterSim.addDrop(x, y, 0.03, (i & 1) ? 0.01 : -0.01);\n    }\n    rippleCountRef.current += count;\n    waterStore.set({ rippleCount: rippleCountRef.current });\n  };\n\n  useEffect(() => {\n    if (!initialized) {\n      seedDrops(20);\n      const p = sphereCenter.current;\n      waterStore.set({ spherePos: [p.x, p.y, p.z] });\n      setInitialized(true);\n    }\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [initialized]);\n\n  useEffect(() => {\n    const off = waterCommands.on((cmd) => {\n      const state = waterStore.get();\n      const intensity = state.splashIntensity;\n      const width = (state.poolWidth ?? state.poolScale) * (state.worldScale ?? 1.0);\n      const depth = (state.poolDepth ?? state.poolScale) * (state.worldScale ?? 1.0);\n      const coupling = state.mpmParams;\n      if (cmd === 'reset') {\n        rippleCountRef.current = 0;\n        splashCountRef.current = 0;\n        waterStore.set({ rippleCount: 0, splashEvents: 0 });\n        // Kill all live particles\n        const P = mpm.solver.particles;\n        for (let i = 0; i < P.count; i++) P.kill(i);\n        for (let i = 0; i < 8; i++) {\n          waterSim.addDrop((Math.random() * 2 - 1) * width, (Math.random() * 2 - 1) * depth, coupling.impactWaveRadius, 0.005 * coupling.impactWaveGain);\n        }\n      } else if (cmd === 'storm') {\n        seedDrops(40);\n        // Storm also spawns scattered splashes\n        for (let i = 0; i < 6; i++) {\n          const x = (Math.random() * 2 - 1) * width * 0.85;\n          const z = (Math.random() * 2 - 1) * depth * 0.85;\n          mpm.impact(x, z, 1.6 * intensity);\n          waterSim.addDrop(x, z, coupling.impactWaveRadius, 0.025 * coupling.impactWaveGain);\n        }\n        splashCountRef.current += 6;\n        waterStore.set({ splashEvents: splashCountRef.current });\n      } else if (cmd === 'single-drop' || cmd === 'splash') {\n        const x = (Math.random() * 1.6 - 0.8) * width;\n        const z = (Math.random() * 1.6 - 0.8) * depth;\n        waterSim.addDrop(x, z, coupling.impactWaveRadius, 0.022 * coupling.impactWaveGain);\n        mpm.impact(x, z, (cmd === 'splash' ? 2.2 : 1.2) * intensity);\n        rippleCountRef.current += 1;\n        splashCountRef.current += 1;\n        waterStore.set({ rippleCount: rippleCountRef.current, splashEvents: splashCountRef.current });\n      }\n    });\n    return () => { off(); };\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);\n\n  useFrame(() => {\n    if (!initialized) return;\n\n    const state = waterStore.get();\n    const intensity = state.splashIntensity;\n    const coupling = state.mpmParams;\n\n    // \u2500\u2500 Time step \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    const now = performance.now();\n    const dt = Math.min(0.033, (now - lastFrameTime.current) / 1000);\n    lastFrameTime.current = now;\n\n    // \u2500\u2500 Light direction from azimuth + elevation \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    const az = (state.lightAngle * Math.PI) / 180;\n    const el = (state.lightElevation * Math.PI) / 180;\n    lightDir.current.set(\n      Math.cos(el) * Math.cos(az),\n      Math.sin(el),\n      Math.cos(el) * Math.sin(az),\n    ).normalize();\n\n    if (!state.paused) {\n      // \u2500\u2500 Sphere velocity (finite difference) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      sphereVelocity.current.subVectors(sphereCenter.current, oldSphereCenter.current).divideScalar(Math.max(dt, 1e-4));\n\n      // \u2500\u2500 Phase8-derived 2D heightfield guidance \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      // This keeps the src evolution sim as authority, but uses diagnostic\n      // fields (contact/pressure/risk/elongation/body flux/wake curl) as\n      // release sensors for MLS-MPM instead of spawning purely from raw speed.\n      const guidance = waterSim.updateHeightfieldGuidance(\n        sphereCenter.current,\n        sphereVelocity.current,\n        sphereRadius,\n        mpm.solver.particles,\n        dt,\n      );\n      const releaseGate = state.heightfieldGuidanceEnabled ? guidance.releaseGate : 1.0;\n\n      // \u2500\u2500 Aqua-phase-7 JIT path: continuous splash emission FROM the\n      // heightfield energy layer. The exportable reservoir + ejection energy\n      // decide where separated water is born; each parcel carries reservoir\n      // volume, so droplet size is set by the fluid released, not a knob. \u2500\u2500\u2500\u2500\n      const fieldEmitted = waterSim.emitFieldSplashes(\n        dt,\n        sphereCenter.current,\n        sphereVelocity.current,\n        (x, y, z, vx, vy, vz, vol, foam) => {\n          mpm.solver.spawnParcel(x, y, z, vx, vy, vz, vol, foam);\n        },\n      );\n      if (fieldEmitted > 0) splashCountRef.current += 1;\n\n      // \u2500\u2500 Breach detection (radius-aware) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      // Submerged depth = how far the sphere bottom is below y=0 (clamped to diameter).\n      const yPrev = lastSphereY.current;\n      const yNow = sphereCenter.current.y;\n      const subPrev = Math.max(0, Math.min(2 * sphereRadius, sphereRadius - yPrev));\n      const subNow  = Math.max(0, Math.min(2 * sphereRadius, sphereRadius - yNow));\n      const dSub = subNow - subPrev;             // >0 entering, <0 exiting\n      const speed = sphereVelocity.current.length();\n      const downSpeed = -sphereVelocity.current.y;\n      const upSpeed = sphereVelocity.current.y;\n\n      // Entry: bottom plunges further into water this frame\n      if (dSub > 0.005 && downSpeed > 0.4) {\n        const energy = downSpeed * (0.5 + subNow / sphereRadius);\n        mpm.crown(sphereCenter.current.x, sphereCenter.current.z, energy * intensity * releaseGate, sphereRadius);\n        mpm.breach(\n          sphereCenter.current.x, sphereCenter.current.y, sphereCenter.current.z, sphereRadius,\n          sphereVelocity.current.x, sphereVelocity.current.y, sphereVelocity.current.z, intensity * releaseGate,\n        );\n        waterSim.addDrop(\n          sphereCenter.current.x,\n          sphereCenter.current.z,\n          coupling.entryWaveRadius,\n          0.055 * Math.min(2.4, downSpeed) * coupling.entryWaveGain * Math.min(2.5, releaseGate),\n        );\n        splashCountRef.current += 1;\n      }\n      // Exit: bottom rises out, sheet of water trailing up\n      if (dSub < -0.005 && upSpeed > 0.35 && subPrev > 0.02) {\n        mpm.sheet(sphereCenter.current.x, sphereCenter.current.z, Math.max(-0.02, yNow - sphereRadius * 0.3), upSpeed * 0.9 * intensity * releaseGate);\n        mpm.breach(\n          sphereCenter.current.x, sphereCenter.current.y, sphereCenter.current.z, sphereRadius,\n          sphereVelocity.current.x, sphereVelocity.current.y, sphereVelocity.current.z, intensity * 0.85 * releaseGate,\n        );\n        waterSim.addDrop(\n          sphereCenter.current.x,\n          sphereCenter.current.z,\n          coupling.exitSuctionRadius,\n          -0.022 * coupling.exitSuctionGain * Math.min(2.0, releaseGate),\n        );\n        splashCountRef.current += 1;\n      }\n\n      // High-velocity wake while submerged: MLS-MPM foam shed from the waterline\n      if (subNow > sphereRadius * 0.28 && speed > coupling.wakeThreshold) {\n        mpm.breach(\n          sphereCenter.current.x, sphereCenter.current.y, sphereCenter.current.z, sphereRadius,\n          sphereVelocity.current.x, sphereVelocity.current.y, sphereVelocity.current.z, intensity * 0.35 * coupling.wakeFoamGain * Math.min(2.2, releaseGate),\n        );\n        if (coupling.wakeRippleGain > 0 && Math.random() < Math.min(0.55, dt * 20 * Math.max(0, speed - coupling.wakeThreshold + 0.1))) {\n          const back = sphereVelocity.current.lengthSq() > 1e-6\n            ? sphereVelocity.current.clone().normalize().multiplyScalar(-sphereRadius * 0.65)\n            : new THREE.Vector3();\n          waterSim.addDrop(\n            sphereCenter.current.x + back.x,\n            sphereCenter.current.z + back.z,\n            coupling.wakeRippleRadius,\n            0.008 * Math.min(3.0, speed) * coupling.wakeRippleGain * Math.min(2.0, releaseGate),\n          );\n          rippleCountRef.current += 1;\n        }\n      }\n\n      // High-velocity wake while submerged: small foam particles trail\n      if (subNow > sphereRadius * 0.4 && speed > 1.2 && coupling.wakeFoamGain > 0) {\n        if (Math.random() < Math.min(0.85, (speed - 1.0) * 0.3 * coupling.wakeFoamGain)) {\n          const back = sphereVelocity.current.clone().normalize().multiplyScalar(-sphereRadius * 0.9);\n          mpm.solver.particles.spawn(\n            sphereCenter.current.x + back.x + (Math.random() - 0.5) * 0.05,\n            Math.min(-0.01, sphereCenter.current.y + 0.05),\n            sphereCenter.current.z + back.z + (Math.random() - 0.5) * 0.05,\n            (Math.random() - 0.5) * 0.4,\n            0.4 + Math.random() * 0.4,\n            (Math.random() - 0.5) * 0.4,\n            true,\n          );\n        }\n      }\n\n      lastSphereY.current = yNow;\n\n      // \u2500\u2500 Height-field sphere displacement (existing) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      waterSim.moveSphere(oldSphereCenter.current, sphereCenter.current, sphereRadius);\n      oldSphereCenter.current.copy(sphereCenter.current);\n\n      waterSim.stepSimulation();\n      waterSim.stepSimulation();\n      waterSim.updateNormals();\n\n      const waterTexture = waterSim.getTexture();\n      if (waterTexture) {\n        caustics.updateCaustics(waterTexture, lightDir.current, sphereCenter.current, sphereRadius, poolHalfSize, poolDepthY, causticsEnabled);\n      }\n\n      // \u2500\u2500 MLS-MPM particle step with sphere coupling \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      const probe = mpm.buildProbe(sphereCenter.current, sphereVelocity.current, sphereRadius);\n      mpm.step(dt * Math.max(0.01, state.splashSpeed), probe, { heightAt: waterSim.sampleHeight });\n\n      // \u2500\u2500 Re-couple active MPM splash mass \u2192 heightfield lift/ripples \u2500\u2500\u2500\u2500\u2500\n      waterSim.coupleMpmParticles(mpm.solver.particles);\n\n      // \u2500\u2500 Re-couple settled particles \u2192 height-field as tiny ripples \u2500\u2500\u2500\u2500\u2500\u2500\n      mpm.drainSettleEvents((x, z, strength, radius) => {\n        // Only water-area contacts absorb into the heightfield. Missed pool splashes fall to the floor.\n        if (Math.abs(x) <= poolHalfSize.x && Math.abs(z) <= poolHalfSize.y) {\n          waterSim.recordMpmAbsorb(x, z, strength, radius);\n          waterSim.addDrop(x, z, radius, strength);\n          rippleCountRef.current += 1;\n        }\n      });\n    }\n\n    // \u2500\u2500 Telemetry \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    fpsAccum.current.frames++;\n    const dtMs = now - fpsAccum.current.last;\n    if (dtMs >= 500) {\n      const fps = (fpsAccum.current.frames * 1000) / dtMs;\n      waterStore.set({\n        fps,\n        particleCount: mpm.liveCount(),\n        splashEvents: splashCountRef.current,\n      });\n      fpsAccum.current.frames = 0;\n      fpsAccum.current.last = now;\n    }\n  });\n\n\n  const handleSphereMove = (position: THREE.Vector3) => {\n    sphereCenter.current.copy(position);\n    waterStore.set({ spherePos: [position.x, position.y, position.z] });\n  };\n\n  const waterTexture = waterSim.getTexture();\n  const causticsTexture = caustics.getTexture();\n\n  return (\n    <group>\n      <PoolEnvironment\n        waterTexture={waterTexture}\n        causticsTexture={causticsTexture}\n        tilesTexture={tilesTexture}\n        light={lightDir.current}\n        sphereCenter={sphereCenter.current}\n        sphereRadius={sphereRadius}\n        poolHalfSize={poolHalfSize}\n        poolDepthY={poolDepthY}\n        causticsEnabled={causticsEnabled}\n      />\n\n      <WaterSurface\n        waterTexture={waterTexture}\n        causticsTexture={causticsTexture}\n        tilesTexture={tilesTexture}\n        skyTexture={skyTexture}\n        eye={camera.position}\n        light={lightDir.current}\n        sphereCenter={sphereCenter.current}\n        sphereRadius={sphereRadius}\n        poolHalfSize={poolHalfSize}\n        poolDepthY={poolDepthY}\n        causticsEnabled={causticsEnabled}\n      />\n\n      <DraggableSphere\n        position={sphereCenter.current}\n        radius={sphereRadius}\n        waterTexture={waterTexture}\n        causticsTexture={causticsTexture}\n        tilesTexture={tilesTexture}\n        light={lightDir.current}\n        poolHalfSize={poolHalfSize}\n        poolDepthY={poolDepthY}\n        causticsEnabled={causticsEnabled}\n        onMove={handleSphereMove}\n      />\n\n      {/* MLS-MPM splash fluid \u2014 implicit connected droplet surface */}\n      <SplashParticles\n        solver={mpm.solver}\n        light={lightDir.current}\n        waterTexture={waterTexture}\n        causticsTexture={causticsTexture}\n        tilesTexture={tilesTexture}\n        skyTexture={skyTexture}\n        eye={camera.position}\n        sphereCenter={sphereCenter.current}\n        sphereRadius={sphereRadius}\n        poolHalfSize={poolHalfSize}\n        poolDepthY={poolDepthY}\n        causticsEnabled={causticsEnabled}\n      />\n    </group>\n  );\n}\n","/src/components/WaterSurface.tsx":"import { useMemo } from 'react';\nimport * as THREE from 'three';\nimport { useFrame } from '@react-three/fiber';\nimport {\n  waterVertexShader,\n  waterAboveFragmentShader,\n  waterBelowFragmentShader,\n} from '../shaders/waterShaders';\n\ninterface WaterSurfaceProps {\n  waterTexture: THREE.Texture | undefined;\n  causticsTexture: THREE.Texture | undefined;\n  tilesTexture: THREE.Texture;\n  skyTexture: THREE.CubeTexture;\n  eye: THREE.Vector3;\n  light: THREE.Vector3;\n  sphereCenter: THREE.Vector3;\n  sphereRadius: number;\n  poolHalfSize: THREE.Vector2;\n  poolDepthY: number;\n  causticsEnabled: boolean;\n}\n\nconst ignoreRaycast = () => null;\n\nconst buildUniforms = (tiles: THREE.Texture, sky: THREE.CubeTexture, poolHalfSize: THREE.Vector2, poolDepthY: number, causticsEnabled: boolean) => ({\n  water: { value: null as THREE.Texture | null },\n  tiles: { value: tiles },\n  causticTex: { value: null as THREE.Texture | null },\n  sky: { value: sky },\n  eye: { value: new THREE.Vector3() },\n  light: { value: new THREE.Vector3() },\n  sphereCenter: { value: new THREE.Vector3() },\n  sphereRadius: { value: 0.25 },\n  poolHalfSize: { value: poolHalfSize.clone() },\n  poolDepthY: { value: poolDepthY },\n  causticsEnabled: { value: causticsEnabled ? 1.0 : 0.0 },\n});\n\nexport function WaterSurface({\n  waterTexture,\n  causticsTexture,\n  tilesTexture,\n  skyTexture,\n  eye,\n  light,\n  sphereCenter,\n  sphereRadius,\n  poolHalfSize,\n  poolDepthY,\n  causticsEnabled,\n}: WaterSurfaceProps) {\n  // Plane geometry on XY in [-1,1] \u2014 the vertex shader swizzles to XZ.\n  const geometry = useMemo(() => {\n    const segX = Math.min(768, Math.max(96, Math.round(128 * poolHalfSize.x)));\n    const segZ = Math.min(768, Math.max(96, Math.round(128 * poolHalfSize.y)));\n    return new THREE.PlaneGeometry(poolHalfSize.x * 2, poolHalfSize.y * 2, segX, segZ);\n  }, [poolHalfSize.x, poolHalfSize.y]);\n\n\n  const aboveMaterial = useMemo(() => new THREE.ShaderMaterial({\n    vertexShader: waterVertexShader,\n    fragmentShader: waterAboveFragmentShader,\n    uniforms: buildUniforms(tilesTexture, skyTexture, poolHalfSize, poolDepthY, causticsEnabled),\n    side: THREE.DoubleSide,\n  }), [tilesTexture, skyTexture, poolHalfSize, poolDepthY, causticsEnabled]);\n\n  const belowMaterial = useMemo(() => new THREE.ShaderMaterial({\n    vertexShader: waterVertexShader,\n    fragmentShader: waterBelowFragmentShader,\n    uniforms: buildUniforms(tilesTexture, skyTexture, poolHalfSize, poolDepthY, causticsEnabled),\n    side: THREE.DoubleSide,\n  }), [tilesTexture, skyTexture, poolHalfSize, poolDepthY, causticsEnabled]);\n\n\n\n  useFrame(() => {\n    [aboveMaterial, belowMaterial].forEach((m) => {\n      if (waterTexture) m.uniforms.water.value = waterTexture;\n      m.uniforms.causticTex.value = causticsEnabled ? (causticsTexture ?? null) : null;\n      m.uniforms.eye.value.copy(eye);\n      m.uniforms.light.value.copy(light);\n      m.uniforms.sphereCenter.value.copy(sphereCenter);\n      m.uniforms.sphereRadius.value = sphereRadius;\n      m.uniforms.poolHalfSize.value.copy(poolHalfSize);\n      m.uniforms.poolDepthY.value = poolDepthY;\n      m.uniforms.causticsEnabled.value = causticsEnabled ? 1.0 : 0.0;\n    });\n  });\n\n\n  return (\n    <group>\n      <mesh geometry={geometry} material={aboveMaterial} raycast={ignoreRaycast} renderOrder={2} frustumCulled={false} />\n      <mesh geometry={geometry} material={belowMaterial} raycast={ignoreRaycast} renderOrder={1} frustumCulled={false} />\n\n    </group>\n  );\n}\n","/src/components/WaterUI.tsx":"import { motion } from 'framer-motion';\nimport { useRef, useState, useEffect } from 'react';\nimport { useWaterStore, waterStore, waterCommands } from '../lib/waterStore';\n\nfunction Stat({ label, value, unit }: { label: string; value: string; unit?: string }) {\n  return (\n    <div className=\"flex items-baseline justify-between gap-3 py-1.5 border-b border-bone/10 last:border-0\">\n      <span className=\"font-mono text-[10px] uppercase tracking-[0.18em] text-muted-foreground\">{label}</span>\n      <span className=\"font-mono text-xs text-bone tabular-nums\">\n        {value}\n        {unit && <span className=\"text-muted-foreground ml-1\">{unit}</span>}\n      </span>\n    </div>\n  );\n}\n\nfunction Dial({\n  label, value, min, max, onChange, suffix, step = 1, decimals = 0,\n}: { label: string; value: number; min: number; max: number; onChange: (v: number) => void; suffix?: string; step?: number; decimals?: number }) {\n  return (\n    <div className=\"space-y-1.5\">\n      <div className=\"flex items-baseline justify-between\">\n        <label className=\"font-mono text-[10px] uppercase tracking-[0.18em] text-muted-foreground\">{label}</label>\n        <span className=\"font-mono text-xs text-primary tabular-nums\">\n          {value.toFixed(decimals)}{suffix}\n        </span>\n      </div>\n      <input\n        type=\"range\"\n        min={min}\n        max={max}\n        step={step}\n        value={value}\n        onChange={(e) => onChange(Number(e.target.value))}\n        className=\"w-full h-[2px] bg-bone/15 appearance-none cursor-pointer accent-primary\n                   [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3\n                   [&::-webkit-slider-thumb]:bg-primary [&::-webkit-slider-thumb]:rounded-none\n                   [&::-webkit-slider-thumb]:shadow-[0_0_10px_hsl(var(--primary)/0.6)]\n                   [&::-moz-range-thumb]:w-3 [&::-moz-range-thumb]:h-3 [&::-moz-range-thumb]:bg-primary [&::-moz-range-thumb]:rounded-none [&::-moz-range-thumb]:border-0\"\n      />\n    </div>\n  );\n}\n\nfunction ActionBtn({ children, onClick, variant = 'ghost' }: { children: React.ReactNode; onClick: () => void; variant?: 'ghost' | 'primary' }) {\n  return (\n    <button\n      onClick={onClick}\n      className={`pointer-events-auto group relative px-3 py-2 font-mono text-[10px] uppercase tracking-[0.2em] transition-all\n        ${variant === 'primary'\n          ? 'text-ink bg-primary hover:bg-primary-glow shadow-[0_0_20px_hsl(var(--primary)/0.4)]'\n          : 'text-bone bg-bone/[0.03] hover:bg-bone/[0.08] border border-bone/15 hover:border-primary/40'}`}\n    >\n      <span className=\"relative z-10\">{children}</span>\n    </button>\n  );\n}\n\nconst HF_OVERLAY_MODES = [\n  'height', 'velocity', 'sigma', 'sigmaDot', 'contact', 'pressure',\n  'risk', 'elongation', 'bodyFlux', 'wakeCurl', 'particles', 'absorb',\n  'failVol', 'jitVol', 'eject',\n] as const;\n\nfunction HeightfieldMapCanvas({ snapshot, mode }: { snapshot: any; mode: string }) {\n  const canvasRef = useRef<HTMLCanvasElement>(null);\n\n  useEffect(() => {\n    const canvas = canvasRef.current;\n    if (!canvas) return;\n    const ctx = canvas.getContext('2d');\n    if (!ctx) return;\n    const size = snapshot?.size || 128;\n    if (canvas.width !== size) canvas.width = size;\n    if (canvas.height !== size) canvas.height = size;\n    const img = ctx.createImageData(size, size);\n    const fields = snapshot?.fields || {};\n    const data: Float32Array | undefined = fields[mode] || fields.risk || fields.height;\n    if (!data) {\n      ctx.fillStyle = '#031016';\n      ctx.fillRect(0, 0, size, size);\n      ctx.fillStyle = '#86f7ff';\n      ctx.font = '8px monospace';\n      ctx.fillText('waiting for field map', 6, 14);\n      return;\n    }\n    const signed = mode === 'height' || mode === 'velocity' || mode === 'sigmaDot' || mode === 'bodyFlux' || mode === 'wakeCurl';\n    let max = 1e-5;\n    for (let i = 0; i < data.length; i += 1) max = Math.max(max, Math.abs(data[i] || 0));\n    for (let z = 0; z < size; z += 1) {\n      for (let x = 0; x < size; x += 1) {\n        const src = z * size + x;\n        const dst = ((size - 1 - z) * size + x) * 4;\n        const v = data[src] || 0;\n        let p = signed ? 0.5 + 0.5 * v / max : v / max;\n        p = Math.max(0, Math.min(1, p));\n        let r = 0, g = 0, b = 0;\n        if (signed) {\n          r = 255 * p;\n          b = 255 * (1 - p);\n          g = 90 * Math.sin(p * Math.PI);\n        } else if (mode === 'sigma' || mode === 'contact') {\n          r = 220 * p; g = 100 * p; b = 35 * p;\n        } else if (mode === 'pressure' || mode === 'risk' || mode === 'elongation' || mode === 'particles' || mode === 'absorb') {\n          r = 255 * p; g = 170 * Math.pow(p, 0.72); b = 28 * (1 - p);\n        } else {\n          r = 35 * p; g = 210 * p; b = 255 * p;\n        }\n        img.data[dst] = r;\n        img.data[dst + 1] = g;\n        img.data[dst + 2] = b;\n        img.data[dst + 3] = 255;\n      }\n    }\n    ctx.imageSmoothingEnabled = false;\n    ctx.putImageData(img, 0, 0);\n  }, [snapshot, snapshot?.updatedAt, mode]);\n\n  return (\n    <canvas\n      ref={canvasRef}\n      width={128}\n      height={128}\n      className=\"w-full aspect-square border border-bone/15 bg-ink/80 [image-rendering:pixelated]\"\n    />\n  );\n}\n\nexport function WaterUI() {\n  const [panelOpen, setPanelOpen] = useState(true);\n  const sphere = useWaterStore((s) => s.spherePos);\n  const fps = useWaterStore((s) => s.fps);\n  const ripples = useWaterStore((s) => s.rippleCount);\n  const angle = useWaterStore((s) => s.lightAngle);\n  const elev = useWaterStore((s) => s.lightElevation);\n  const particleCount = useWaterStore((s) => s.particleCount);\n  const splashEvents = useWaterStore((s) => s.splashEvents);\n  const splashIntensity = useWaterStore((s) => s.splashIntensity);\n  const splashSpeed = useWaterStore((s) => s.splashSpeed);\n  const worldScale = useWaterStore((s) => s.worldScale ?? 1.0);\n  const poolWidth = useWaterStore((s) => s.poolWidth ?? s.poolScale);\n  const poolDepth = useWaterStore((s) => s.poolDepth ?? s.poolScale);\n  const poolWaterDepth = useWaterStore((s) => s.poolWaterDepth);\n  const waveScale = useWaterStore((s) => s.waveScale);\n  const causticsEnabled = useWaterStore((s) => s.causticsEnabled);\n  const sphereRadius = useWaterStore((s) => s.sphereRadius);\n  const paused = useWaterStore((s) => s.paused);\n  const mpmParams = useWaterStore((s) => s.mpmParams);\n  const hfOverlayMode = useWaterStore((s) => s.heightfieldOverlayMode);\n  const hfMap = useWaterStore((s) => s.heightfieldMap);\n  const hfGuidance = useWaterStore((s) => s.heightfieldGuidance);\n  const hfGuidanceEnabled = useWaterStore((s) => s.heightfieldGuidanceEnabled);\n  const guidanceReleaseGain = useWaterStore((s) => s.guidanceReleaseGain);\n  const guidanceRiskThreshold = useWaterStore((s) => s.guidanceRiskThreshold);\n  const guidancePressureGain = useWaterStore((s) => s.guidancePressureGain);\n  const guidanceElongationGain = useWaterStore((s) => s.guidanceElongationGain);\n\n  const updateMpm = (patch: Partial<typeof mpmParams>) => {\n    waterStore.set({ mpmParams: { ...waterStore.get().mpmParams, ...patch } });\n  };\n\n\n  return (\n    <>\n      {/* Vignette + grain overlays */}\n      <div className=\"fixed inset-0 vignette pointer-events-none z-[5]\" />\n      <div className=\"fixed inset-0 grain pointer-events-none z-[5]\" />\n\n      {/* Left-side editorial/hint overlays removed for unobstructed simulation view. */}\n\n      {/* Right instrument panel */}\n      <motion.aside\n        initial={{ opacity: 0, x: 30 }}\n        animate={{ opacity: 1, x: 0 }}\n        transition={{ duration: 0.8, delay: 0.3, ease: [0.16, 1, 0.3, 1] }}\n        className=\"fixed top-6 right-6 z-20 w-[280px] pointer-events-none max-h-[calc(100vh-3rem)]\"\n      >\n        <div className={`relative panel corner-bracket pointer-events-auto max-h-[calc(100vh-3rem)] overflow-x-hidden transition-all ${panelOpen ? 'p-5 overflow-y-auto' : 'p-3 overflow-hidden'}`}>\n          <button\n            type=\"button\"\n            onClick={() => setPanelOpen((v) => !v)}\n            className=\"pointer-events-auto w-full flex items-center justify-between gap-3 text-left\"\n            aria-expanded={panelOpen}\n            title={panelOpen ? 'Collapse settings' : 'Open settings'}\n          >\n            <div>\n              <div className=\"font-mono text-[9px] uppercase tracking-[0.25em] text-muted-foreground\">Settings</div>\n              <div className=\"font-display text-lg text-bone leading-tight\">Controls</div>\n            </div>\n            <div className=\"font-mono text-[12px] text-primary\">{panelOpen ? '\u2212' : '+'}</div>\n          </button>\n\n          {panelOpen && (\n          <>\n          <div className=\"mt-4 space-y-0\">\n            <Stat label=\"Frame Rate\" value={fps.toFixed(0)} unit=\"fps\" />\n            <Stat label=\"Disturbances\" value={ripples.toString()} />\n            <Stat label=\"Splash Events\" value={splashEvents.toString()} />\n            <Stat label=\"Particles \u00b7 MPM\" value={particleCount.toString()} />\n            <Stat label=\"Probe \u00b7 X\" value={sphere[0].toFixed(3)} />\n            <Stat label=\"Probe \u00b7 Y\" value={sphere[1].toFixed(3)} />\n            <Stat label=\"Probe \u00b7 Z\" value={sphere[2].toFixed(3)} />\n          </div>\n\n          <div className=\"my-5 h-px bg-bone/10\" />\n\n          <div className=\"space-y-4\">\n            <Dial\n              label=\"Sun \u00b7 Azimuth\"\n              value={angle}\n              min={0}\n              max={360}\n              suffix=\"\u00b0\"\n              onChange={(v) => waterStore.set({ lightAngle: v })}\n            />\n            <Dial\n              label=\"Sun \u00b7 Elevation\"\n              value={elev}\n              min={5}\n              max={85}\n              suffix=\"\u00b0\"\n              onChange={(v) => waterStore.set({ lightElevation: v })}\n            />\n            <Dial\n              label=\"Splash \u00b7 Intensity\"\n              value={splashIntensity * 100}\n              min={0}\n              max={200}\n              suffix=\"%\"\n              onChange={(v) => waterStore.set({ splashIntensity: v / 100 })}\n            />\n            <Dial\n              label=\"Splash \u00b7 Speed\"\n              value={splashSpeed}\n              min={0.1}\n              max={3}\n              step={0.05}\n              decimals={2}\n              suffix=\"\u00d7\"\n              onChange={(v) => waterStore.set({ splashSpeed: v })}\n            />\n            <Dial\n              label=\"Everything Scale vs Particles\"\n              value={worldScale}\n              min={1.0}\n              max={3.8}\n              step={0.05}\n              decimals={2}\n              suffix=\"\u00d7\"\n              onChange={(v) => waterStore.set({ worldScale: v })}\n            />\n            <details className=\"group pt-1\">\n              <summary className=\"flex cursor-pointer list-none items-center justify-between font-mono text-[10px] uppercase tracking-[0.18em] text-copper\">\n                Base Scene Shape\n                <span className=\"text-muted-foreground transition-transform group-open:rotate-90\">\u203a</span>\n              </summary>\n              <div className=\"mt-3 space-y-4\">\n                <div className=\"font-mono text-[9px] uppercase tracking-[0.16em] text-muted-foreground/90 leading-relaxed\">\n                  These are base dimensions. The main scale control above enlarges pool, sphere, water and camera relative to fixed metaballs.\n                </div>\n                <Dial label=\"Base Pool Width\" value={poolWidth * 2} min={1.0} max={8.0} step={0.05} decimals={2} suffix=\" m\" onChange={(v) => waterStore.set({ poolWidth: v / 2, poolScale: v / 2 })} />\n                <Dial label=\"Base Pool Length\" value={poolDepth * 2} min={1.0} max={8.0} step={0.05} decimals={2} suffix=\" m\" onChange={(v) => waterStore.set({ poolDepth: v / 2 })} />\n                <Dial label=\"Base Water Depth\" value={poolWaterDepth} min={0.35} max={4.0} step={0.05} decimals={2} suffix=\" m\" onChange={(v) => waterStore.set({ poolWaterDepth: v })} />\n                <Dial label=\"Wave Size\" value={waveScale} min={0.2} max={4.0} step={0.05} decimals={2} suffix=\"\u00d7\" onChange={(v) => waterStore.set({ waveScale: v })} />\n                <ActionBtn onClick={() => waterStore.set({ causticsEnabled: !waterStore.get().causticsEnabled })} variant={causticsEnabled ? 'primary' : 'ghost'}>\n                  Caustics {causticsEnabled ? 'On' : 'Off'}\n                </ActionBtn>\n              </div>\n            </details>\n            <Dial\n              label=\"Base Sphere Size\"\n              value={sphereRadius}\n              min={0.05}\n              max={0.6}\n              step={0.01}\n              decimals={2}\n              onChange={(v) => waterStore.set({ sphereRadius: v })}\n            />\n            <details className=\"group pt-1\" open>\n              <summary className=\"flex cursor-pointer list-none items-center justify-between font-mono text-[10px] uppercase tracking-[0.18em] text-copper\">\n                Metaball Splash\n                <span className=\"text-muted-foreground transition-transform group-open:rotate-90\">\u203a</span>\n              </summary>\n              <div className=\"mt-3 space-y-4\">\n                <div className=\"font-mono text-[9px] uppercase tracking-[0.16em] text-muted-foreground/90 leading-relaxed\">\n                  Droplet size now derives from each parcel's carried fluid volume (energy-dependent Weber breakup). The render volume is JIT tight-fit, so sizes below 1 stay round instead of turning into
