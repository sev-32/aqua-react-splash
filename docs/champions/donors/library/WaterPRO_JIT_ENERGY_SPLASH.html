\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n1) What we’re changing\r\n\r\nWe’re adding runtime flow tiles for rivers/rapids: a GPU 2D solver that outputs a live velocity field V(x,z) (plus optional pressure/vorticity), with strict LOD + tile caps.\r\n\r\nWe’re implementing Stable Fluids first (fastest, easiest, great for interactive obstacles), with an optional LBM D2Q9 upgrade later for richer vorticity (but heavier memory), matching the River Editor “flow evolution” path.\r\n\r\nWe’re keeping the no-stall contract: all updates are render-to-texture passes; no readbacks; solver runs only when runtime tiles are active.\r\n\r\n2) Why\r\n\r\nRivers/rapids look alive when the flow field has vorticity + obstacle interaction. Grenier explicitly moved beyond pure flowmap approaches because vortices are the missing ingredient, and he explored stable fluids then LBM for richer vortical behavior.\r\n\r\nRuntime tiles let boats/rocks actually bend flow and generate wakes/eddies without simulating 3D water.\r\n\r\n3) Implementation steps (shippable increments)\r\nRF-A — Stable Fluids runtime tiles (MV)\r\n\r\nState per tile (near-field only):\r\n\r\nVel (RG16F): velocity (vx, vz) in m/s, ping-pong (2 RTs)\r\n\r\nPressure (R16F): ping-pong (2 RTs)\r\n\r\nDivergence (R16F): 1 RT\r\n\r\nObstacle (R8 or R16F): 1 RT (static or updated from dynamic objects)\r\n\r\nMath (2D incompressible):\r\n\r\n∂\r\n𝑢\r\n∂\r\n𝑡\r\n+\r\n(\r\n𝑢\r\n⋅\r\n∇\r\n)\r\n𝑢\r\n=\r\n−\r\n∇\r\n𝑝\r\n+\r\n𝜈\r\n∇\r\n2\r\n𝑢\r\n+\r\n𝑓\r\n,\r\n∇\r\n⋅\r\n𝑢\r\n=\r\n0\r\n∂t\r\n∂u\r\n\t​\r\n\r\n+(u⋅∇)u=−∇p+ν∇\r\n2\r\nu+f,∇⋅u=0\r\n\r\nAlgorithm per tick:\r\n\r\nAdvect velocity (semi-Lagrangian)\r\n\r\nAdd forces (obstacle impulses, river slope acceleration, boat paddles)\r\n\r\nProject to divergence-free:\r\n\r\ncompute divergence\r\n\r\nsolve Poisson for pressure (Jacobi iterations)\r\n\r\nsubtract pressure gradient\r\n\r\nBudgets (MV-safe):\r\n\r\nNear tiles: maxNearTiles = 6, res = 256, Hz = 30\r\n\r\nJacobi iterations: 12–24 (scaled by hardware tier)\r\n\r\nMid: baked flowmap (no runtime solve)\r\n\r\nFar: none\r\n\r\nMemory estimate (per 256² tile, half floats):\r\n\r\nVel RG16F pingpong: ~0.5 MB\r\n\r\nPressure R16F pingpong: ~0.25 MB\r\n\r\nDivergence R16F: ~0.125 MB\r\n\r\nObstacle R8/R16F: ~0.06–0.125 MB\r\nTotal ≈ ~1.0 MB per tile (order of magnitude; varies by GPU alignment).\r\n\r\nStop condition (RF-A): eddies form and persist behind obstacles, and foam streaks follow vortices with no pulsing.\r\n\r\nRF-B — Obstacle coupling + boundary conditions (must-have for “rapids”)\r\n\r\nBuild/update ObstacleTex from scene geometry (banks, rocks, boats):\r\n\r\nsimplest: rasterize obstacle silhouettes into tile UV space (1 pass when dirty)\r\n\r\nBoundary handling:\r\n\r\ninside obstacles: set velocity to 0\r\n\r\nnear boundary: damp normal component, allow tangential slip (cheap stable)\r\n\r\nStop condition: moving a rock causes local swirl and downstream wake within a second, without solver blowing up.\r\n\r\nRF-C — Optional LBM D2Q9 tiles (H2 upgrade)\r\n\r\nIf you want “richer vortices” than Stable Fluids at similar resolution:\r\n\r\nStore distribution functions \r\n𝑓\r\n𝑖\r\nf\r\ni\r\n\t​\r\n\r\n for D2Q9 (9 directions).\r\n\r\nEach step: collide (BGK relaxation) then stream to neighbors.\r\n\r\nCollision:\r\n\r\n𝑓\r\n𝑖\r\n←\r\n𝑓\r\n𝑖\r\n−\r\n𝜔\r\n \r\n(\r\n𝑓\r\n𝑖\r\n−\r\n𝑓\r\n𝑖\r\n𝑒\r\n𝑞\r\n)\r\n,\r\n𝜔\r\n=\r\nΔ\r\n𝑡\r\n/\r\n𝜏\r\nf\r\ni\r\n\t​\r\n\r\n←f\r\ni\r\n\t​\r\n\r\n−ω(f\r\ni\r\n\t​\r\n\r\n−f\r\ni\r\neq\r\n\t​\r\n\r\n),ω=Δt/τ\r\n\r\nwith equilibrium \r\n𝑓\r\n𝑖\r\n𝑒\r\n𝑞\r\n(\r\n𝜌\r\n,\r\n𝑢\r\n)\r\nf\r\ni\r\neq\r\n\t​\r\n\r\n(ρ,u) (standard D2Q9).\r\n\r\nStreaming: pull from neighbor cell in direction \r\n𝑒\r\n𝑖\r\ne\r\ni\r\n\t​\r\n\r\n.\r\n\r\nMemory cost (why it’s heavy):\r\n\r\nNeed 9 values/cell; in WebGL2 you pack into e.g. 3× RGBA16F (12 channels), ping-pong → 6 RGBA16F textures.\r\n\r\nFor 256²: RGBA16F is ~0.5 MB each → ~3 MB per tile just for \r\n𝑓\r\n𝑖\r\nf\r\ni\r\n\t​\r\n\r\n, plus obstacles, etc.\r\n\r\nStop condition: LBM tile shows sharper, more natural eddies at the same resolution, and stays within the tile memory budget.\r\n\r\n4) Code (TS + GLSL) with file boundaries\r\n4.1 src/water/river/flow/FlowTileSim.ts\r\nexport type FlowTileConfig = {\r\n  res: number;        // 256 near, 128 mid (if runtime)\r\n  hz: number;         // 30 near\r\n  jacobiIters: number;// 12..24\r\n  viscosity: number;  // small (0..0.02)\r\n  dt: number;         // fixed 1/hz\r\n};\r\n\r\nexport class FlowTileSim {\r\n  // vel ping-pong\r\n  velA: THREE.WebGLRenderTarget;\r\n  velB: THREE.WebGLRenderTarget;\r\n  ping = 0;\r\n\r\n  // pressure ping-pong\r\n  pA: THREE.WebGLRenderTarget;\r\n  pB: THREE.WebGLRenderTarget;\r\n\r\n  div: THREE.WebGLRenderTarget;\r\n  obstacle: THREE.WebGLRenderTarget; // or DataTexture if baked/static\r\n\r\n  // passes\r\n  advect = new PassAdvectVel();\r\n  addForces = new PassAddForces();\r\n  divergence = new PassDivergence();\r\n  jacobi = new PassJacobiPressure();\r\n  project = new PassProject();\r\n\r\n  step(gl: THREE.WebGLRenderer, inputs: {\r\n    domainSizeXZ: THREE.Vector2;\r\n    baseAccelXZ: THREE.Vector2;  // river slope accel\r\n    obstacleDirty: boolean;\r\n    obstacleSources?: any;       // rocks/boats to rasterize\r\n  }) {\r\n    // (optional) update obstacle if dirty\r\n\r\n    const srcVel = this.ping === 0 ? this.velA : this.velB;\r\n    const dstVel = this.ping === 0 ? this.velB : this.velA;\r\n\r\n    // 1) advect\r\n    this.advect.run(gl, { srcVel: srcVel.texture, obstacle: this.obstacle.texture, ...inputs }, dstVel);\r\n\r\n    // 2) forces\r\n    this.addForces.run(gl, { srcVel: dstVel.texture, obstacle: this.obstacle.texture, ...inputs }, dstVel);\r\n\r\n    // 3) divergence\r\n    this.divergence.run(gl, { vel: dstVel.texture, obstacle: this.obstacle.texture, ...inputs }, this.div);\r\n\r\n    // 4) pressure solve (Jacobi)\r\n    let pSrc = this.pA, pDst = this.pB;\r\n    gl.setRenderTarget(pSrc); gl.clear(true,false,false);\r\n    for (let i=0; i<cfg.jacobiIters; i++) {\r\n      this.jacobi.run(gl, { p: pSrc.texture, div: this.div.texture, obstacle: this.obstacle.texture }, pDst);\r\n      const tmp = pSrc; pSrc = pDst; pDst = tmp;\r\n    }\r\n\r\n    // 5) project: vel -= grad(p)\r\n    this.project.run(gl, { vel: dstVel.texture, p: pSrc.texture, obstacle: this.obstacle.texture, ...inputs }, dstVel);\r\n\r\n    this.ping = 1 - this.ping;\r\n  }\r\n\r\n  get velTex(): THREE.Texture {\r\n    return (this.ping === 0 ? this.velA.texture : this.velB.texture);\r\n  }\r\n}\r\n\r\n4.2 GLSL pass sketches\r\n\r\nAdvect velocity (semi-Lagrangian): shaders/flow/advectVel.frag\r\n\r\nuniform sampler2D uVel;\r\nuniform sampler2D uObstacle;\r\nuniform float uDt;\r\nuniform vec2 uDomainSizeXZ;\r\nvarying vec2 vUv;\r\n\r\nvoid main(){\r\n  vec2 vel = texture2D(uVel, vUv).rg; // m/s\r\n  vec2 duv = (uDt * vel) / max(uDomainSizeXZ, vec2(1e-3));\r\n  vec2 prev = vUv - duv;\r\n\r\n  vec2 vNew = texture2D(uVel, prev).rg;\r\n\r\n  float solid = texture2D(uObstacle, vUv).r;\r\n  vNew *= (1.0 - solid);\r\n\r\n  gl_FragColor = vec4(vNew, 0.0, 1.0);\r\n}\r\n\r\n\r\nDivergence: shaders/flow/divergence.frag\r\n\r\nuniform sampler2D uVel;\r\nuniform sampler2D uObstacle;\r\nuniform vec2 uInvRes; // (1/res, 1/res)\r\nvarying vec2 vUv;\r\n\r\nvoid main(){\r\n  float sC = texture2D(uObstacle, vUv).r;\r\n  if (sC > 0.5) { gl_FragColor = vec4(0.0); return; }\r\n\r\n  vec2 vL = texture2D(uVel, vUv - vec2(uInvRes.x,0)).rg;\r\n  vec2 vR = texture2D(uVel, vUv + vec2(uInvRes.x,0)).rg;\r\n  vec2 vD = texture2D(uVel, vUv - vec2(0,uInvRes.y)).rg;\r\n  vec2 vU = texture2D(uVel, vUv + vec2(0,uInvRes.y)).rg;\r\n\r\n  float div = 0.5 * ((vR.x - vL.x) + (vU.y - vD.y));\r\n  gl_FragColor = vec4(div,0,0,1);\r\n}\r\n\r\n\r\nJacobi pressure: shaders/flow/jacobi.frag\r\n\r\nuniform sampler2D uP;\r\nuniform sampler2D uDiv;\r\nuniform sampler2D uObstacle;\r\nuniform vec2 uInvRes;\r\nvarying vec2 vUv;\r\n\r\nvoid main(){\r\n  float sC = texture2D(uObstacle, vUv).r;\r\n  if (sC > 0.5) { gl_FragColor = vec4(0.0); return; }\r\n\r\n  float pL = texture2D(uP, vUv - vec2(uInvRes.x,0)).r;\r\n  float pR = texture2D(uP, vUv + vec2(uInvRes.x,0)).r;\r\n  float pD = texture2D(uP, vUv - vec2(0,uInvRes.y)).r;\r\n  float pU = texture2D(uP, vUv + vec2(0,uInvRes.y)).r;\r\n\r\n  float div = texture2D(uDiv, vUv).r;\r\n  float p = (pL + pR + pD + pU - div) * 0.25;\r\n  gl_FragColor = vec4(p,0,0,1);\r\n}\r\n\r\n\r\nProject: shaders/flow/project.frag\r\n\r\nuniform sampler2D uVel;\r\nuniform sampler2D uP;\r\nuniform sampler2D uObstacle;\r\nuniform vec2 uInvRes;\r\nvarying vec2 vUv;\r\n\r\nvoid main(){\r\n  float solid = texture2D(uObstacle, vUv).r;\r\n  if (solid > 0.5) { gl_FragColor = vec4(0.0,0.0,0.0,1.0); return; }\r\n\r\n  float pL = texture2D(uP, vUv - vec2(uInvRes.x,0)).r;\r\n  float pR = texture2D(uP, vUv + vec2(uInvRes.x,0)).r;\r\n  float pD = texture2D(uP, vUv - vec2(0,uInvRes.y)).r;\r\n  float pU = texture2D(uP, vUv + vec2(0,uInvRes.y)).r;\r\n\r\n  vec2 vel = texture2D(uVel, vUv).rg;\r\n  vec2 gradP = 0.5 * vec2(pR - pL, pU - pD);\r\n  vel -= gradP;\r\n\r\n  gl_FragColor = vec4(vel, 0.0, 1.0);\r\n}\r\n\r\n5) Validation checklist\r\nVisual sweeps\r\n\r\nPlace a rock/boat in a river tile:\r\n\r\nyou see a clear wake + recirculation eddy behind it within ~0.5–1s\r\n\r\nfoam advection wraps around the vortex (streaklines)\r\n\r\nRapids zone (narrow channel + obstacle cluster):\r\n\r\nflow accelerates, vorticity rises, foam injection increases\r\n\r\nPerf / budgets\r\n\r\nNear runtime solve per tile per tick:\r\n\r\n1 advect + 1 force + 1 divergence + N jacobi + 1 project\r\n\r\nwith N=16: 20 passes/tick/tile @ 30 Hz → tile cap must be enforced\r\n\r\nConfirm LOD gating:\r\n\r\nsolver only runs for near tiles (mid uses baked)\r\n\r\nRegression safety\r\n\r\nToggle runtime solve on/off per tile\r\n\r\nClamp iterations and res per hardware tier\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nThought for 1m 33s\r\n1) What we’re changing\r\n\r\nWe’re adding an LBM D2Q9 runtime flow tile option (H2 upgrade) with an explicit texture packing plan, single-step shader, and hard LOD caps.\r\n\r\nWe’re wiring rapids → EBT using the same top-K + NMS pipeline as ocean SF, but with a RapidsScore derived from flow speed + vorticity + obstacle proximity (GPU-only, no stalls).\r\n\r\nWe’re adding a river “genesis init” mode: spawn sheets/spray that inherit FLOW direction/speed (river analogue of wave genesis).\r\n\r\n2) Why\r\n\r\nStable Fluids tiles are great, but Grenier’s “River Editor” journey highlights that vortical richness is what makes rivers/rapids feel alive; LBM is a natural next step when you can afford memory.\r\n\r\nYou already have a robust EBT event backbone. Rivers just need a different score field and different “inheritance” source (flow instead of wave F/η̇).\r\n\r\n3) Implementation steps (bounded + shippable)\r\nA) LBM tile as a delta-flow (recommended)\r\n\r\nUse LBM to generate vorticity-rich perturbations around obstacles, then combine with baked/base flow:\r\n\r\n𝑣\r\n𝑓\r\n𝑖\r\n𝑛\r\n𝑎\r\n𝑙\r\n=\r\n𝑣\r\n𝑏\r\n𝑎\r\n𝑘\r\n𝑒\r\n𝑑\r\n+\r\n𝑠\r\n⋅\r\n𝑢\r\n𝑙\r\n𝑏\r\n𝑚\r\nv\r\nfinal\r\n\t​\r\n\r\n=v\r\nbaked\r\n\t​\r\n\r\n+s⋅u\r\nlbm\r\n\t​\r\n\r\n\r\nThis keeps LBM lattice velocities small and stable, while the baked field preserves correct bulk transport.\r\n\r\nB) LBM state packing (D2Q9)\r\n\r\nD2Q9 has 9 distributions \r\n𝑓\r\n𝑖\r\nf\r\ni\r\n\t​\r\n\r\n. Pack into 3 RGBA16F textures:\r\n\r\nF0 = (f0,f1,f2,f3)\r\n\r\nF1 = (f4,f5,f6,f7)\r\n\r\nF2 = (f8,0,0,0)\r\n\r\nPing-pong → 6 RGBA16F RTs per tile.\r\n\r\nPer-tile memory (256², RGBA16F ~0.5MB): ~3MB for 6 RTs + obstacle + optional debug → ~3.5–4MB/tile.\r\nThis is why LBM must be near-only + capped.\r\n\r\nC) One-pass step with MRT (no silent passes)\r\n\r\nPreferred: 1 fullscreen draw writes 3 outputs (MRT) → updates F0/F1/F2 in one pass.\r\nFallback: 3 passes (one per output) only on devices lacking MRT robustness.\r\n\r\nD) Obstacles & forcing\r\n\r\nObstacleTex R8 (or R16F): 1 = solid\r\n\r\nApply:\r\n\r\nbounce-back / “rest equilibrium” inside solids\r\n\r\nmild forcing from:\r\n\r\nbase flow alignment\r\n\r\nobstacle impulses (moving rocks/boats)\r\n\r\nE) Rapids → EBT\r\n\r\nBuild RapidsScoreTex (R=score, G=u, B=v) exactly like SF seed, but score:\r\n\r\n𝑠\r\n𝑐\r\n𝑜\r\n𝑟\r\n𝑒\r\n=\r\n𝑤\r\n𝑠\r\n \r\nsmoothstep\r\n(\r\n𝑠\r\n0\r\n,\r\n𝑠\r\n1\r\n,\r\n∣\r\n𝑣\r\n∣\r\n)\r\n⋅\r\n𝑤\r\n𝜔\r\n \r\nsmoothstep\r\n(\r\n𝜔\r\n0\r\n,\r\n𝜔\r\n1\r\n,\r\n∣\r\n𝜔\r\n∣\r\n)\r\n⋅\r\n(\r\n1\r\n−\r\n𝑠\r\n𝑜\r\n𝑙\r\n𝑖\r\n𝑑\r\n)\r\nscore=w\r\ns\r\n\t​\r\n\r\nsmoothstep(s\r\n0\r\n\t​\r\n\r\n,s\r\n1\r\n\t​\r\n\r\n,∣v∣)⋅w\r\nω\r\n\t​\r\n\r\nsmoothstep(ω\r\n0\r\n\t​\r\n\r\n,ω\r\n1\r\n\t​\r\n\r\n,∣ω∣)⋅(1−solid)\r\n\r\nRun the existing top-K reduce + NMS + slot write chain.\r\n\r\nWrite EBT with:\r\n\r\ncenter = winner UV → world XZ\r\n\r\ndirection = normalized flow velocity\r\n\r\nenergy = score\r\n\r\nF) River genesis init (no new sim stages)\r\n\r\nAdd an init mode that uses:\r\n\r\ndirection/speed from VelFinalTex instead of SF1\r\n\r\nvertical lift from rapids intensity (vorticity + speed) instead of η̇\r\n\r\n4) Code (TS + GLSL) with file boundaries\r\n4.1 src/water/river/flow/lbm/LBMTileSim.ts\r\nimport * as THREE from \"three\";\r\n\r\nexport type LBMTileConfig = {\r\n  res: number;        // 256 near\r\n  hz: number;         // 30 near\r\n  tau: number;        // relaxation time (0.55..1.2 typical)\r\n  forceAlign: number; // aligns delta flow to base direction (small)\r\n  forceObstacle: number; // obstacle impulse strength\r\n  deltaScale: number; // scale to convert u_lbm -> world delta velocity\r\n};\r\n\r\nexport class LBMTileSim {\r\n  ping = 0;\r\n\r\n  // Ping-pong: each side has 3 RTs (F0,F1,F2)\r\n  F0A: THREE.WebGLRenderTarget; F1A: THREE.WebGLRenderTarget; F2A: THREE.WebGLRenderTarget;\r\n  F0B: THREE.WebGLRenderTarget; F1B: THREE.WebGLRenderTarget; F2B: THREE.WebGLRenderTarget;\r\n\r\n  obstacle: THREE.WebGLRenderTarget; // R8/R16F\r\n\r\n  // MRT step pass\r\n  stepPass: LBMStepPass;\r\n\r\n  constructor(private gl: THREE.WebGLRenderer, public cfg: LBMTileConfig) {\r\n    const rtOpts: THREE.WebGLRenderTargetOptions = {\r\n      type: THREE.HalfFloatType,\r\n      format: THREE.RGBAFormat,\r\n      depthBuffer: false,\r\n      stencilBuffer: false,\r\n      minFilter: THREE.NearestFilter,\r\n      magFilter: THREE.NearestFilter,\r\n    };\r\n    const r = cfg.res;\r\n    this.F0A = new THREE.WebGLRenderTarget(r, r, rtOpts);\r\n    this.F1A = new THREE.WebGLRenderTarget(r, r, rtOpts);\r\n    this.F2A = new THREE.WebGLRenderTarget(r, r, rtOpts);\r\n    this.F0B = new THREE.WebGLRenderTarget(r, r, rtOpts);\r\n    this.F1B = new THREE.WebGLRenderTarget(r, r, rtOpts);\r\n    this.F2B = new THREE.WebGLRenderTarget(r, r, rtOpts);\r\n\r\n    // obstacle can be cheaper; keep nearest\r\n    this.obstacle = new THREE.WebGLRenderTarget(r, r, {\r\n      type: THREE.UnsignedByteType,\r\n      format: THREE.RedFormat,\r\n      depthBuffer: false,\r\n      stencilBuffer: false,\r\n      minFilter: THREE.NearestFilter,\r\n      magFilter: THREE.NearestFilter,\r\n    });\r\n\r\n    this.stepPass = new LBMStepPass();\r\n    this.initEquilibrium(); // fill distributions with rho=1, u=0\r\n  }\r\n\r\n  private initEquilibrium() {\r\n    // simplest MV: clear all to 0 then run an init shader that writes feq at rest\r\n    // (or write on CPU once if you store as DataTexture; keep it GPU here)\r\n  }\r\n\r\n  step(args: {\r\n    baseVelTex: THREE.Texture;   // baked/base flow RG16F (vx,vz)\r\n    domainSizeXZ: THREE.Vector2; // meters\r\n    dt: number;                 // fixed 1/hz\r\n  }) {\r\n    const src = this.ping === 0\r\n      ? { F0: this.F0A, F1: this.F1A, F2: this.F2A }\r\n      : { F0: this.F0B, F1: this.F1B, F2: this.F2B };\r\n\r\n    const dst = this.ping === 0\r\n      ? { F0: this.F0B, F1: this.F1B, F2: this.F2B }\r\n      : { F0: this.F0A, F1: this.F1A, F2: this.F2A };\r\n\r\n    this.stepPass.runMRT(this.gl, {\r\n      srcF0: src.F0.texture,\r\n      srcF1: src.F1.texture,\r\n      srcF2: src.F2.texture,\r\n      obstacle: this.obstacle.texture,\r\n      baseVelTex: args.baseVelTex,\r\n      dt: args.dt,\r\n      domainSizeXZ: args.domainSizeXZ,\r\n      tau: this.cfg.tau,\r\n      forceAlign: this.cfg.forceAlign,\r\n      forceObstacle: this.cfg.forceObstacle,\r\n    }, dst.F0, dst.F1, dst.F2);\r\n\r\n    this.ping = 1 - this.ping;\r\n  }\r\n\r\n  get srcF0(): THREE.Texture { return (this.ping === 0 ? this.F0A.texture : this.F0B.texture); }\r\n  get srcF1(): THREE.Texture { return (this.ping === 0 ? this.F1A.texture : this.F1B.texture); }\r\n  get srcF2(): THREE.Texture { return (this.ping === 0 ? this.F2A.texture : this.F2B.texture); }\r\n\r\n  // Output delta velocity derived from f’s (computed in shader when needed, or in a helper pass)\r\n}\r\n\r\n4.2 MRT step pass (D2Q9 collide+stream in one shader)\r\nsrc/water/river/flow/lbm/LBMStepPass.ts\r\n\r\nUse THREE.WebGLMultipleRenderTargets to write F0/F1/F2 at once.\r\n\r\nimport * as THREE from \"three\";\r\nimport { FullscreenPassMRT } from \"../../render/FullscreenPassMRT\"; // your helper for MRT\r\n\r\nexport class LBMStepPass {\r\n  private pass: FullscreenPassMRT;\r\n\r\n  constructor() {\r\n    const mat = new THREE.RawShaderMaterial({\r\n      glslVersion: THREE.GLSL3,\r\n      vertexShader: VERT,\r\n      fragmentShader: FRAG,\r\n      uniforms: {\r\n        uF0: { value: null as unknown as THREE.Texture },\r\n        uF1: { value: null as unknown as THREE.Texture },\r\n        uF2: { value: null as unknown as THREE.Texture },\r\n        uObstacle: { value: null as unknown as THREE.Texture },\r\n        uBaseVel: { value: null as unknown as THREE.Texture },\r\n\r\n        uInvRes: { value: new THREE.Vector2(1,1) },\r\n        uDt: { value: 1/30 },\r\n        uDomainSizeXZ: { value: new THREE.Vector2(1,1) },\r\n\r\n        uTau: { value: 0.8 },\r\n        uForceAlign: { value: 0.05 },\r\n        uForceObstacle: { value: 0.10 },\r\n      },\r\n      depthTest: false,\r\n      depthWrite: false,\r\n    });\r\n\r\n    this.pass = new FullscreenPassMRT(mat, 3); // 3 color attachments\r\n  }\r\n\r\n  runMRT(\r\n    gl: THREE.WebGLRenderer,\r\n    args: any,\r\n    outF0: THREE.WebGLRenderTarget,\r\n    outF1: THREE.WebGLRenderTarget,\r\n    outF2: THREE.WebGLRenderTarget\r\n  ) {\r\n    const u = this.pass.mat.uniforms;\r\n    u.uF0.value = args.srcF0;\r\n    u.uF1.value = args.srcF1;\r\n    u.uF2.value = args.srcF2;\r\n    u.uObstacle.value = args.obstacle;\r\n    u.uBaseVel.value = args.baseVelTex;\r\n    u.uInvRes.value.set(1 / outF0.width, 1 / outF0.height);\r\n    u.uDt.value = args.dt;\r\n    u.uDomainSizeXZ.value.copy(args.domainSizeXZ);\r\n    u.uTau.value = args.tau;\r\n    u.uForceAlign.value = args.forceAlign;\r\n    u.uForceObstacle.value = args.forceObstacle;\r\n\r\n    this.pass.render(gl, [outF0, outF1, outF2]);\r\n  }\r\n}\r\n\r\nconst VERT = /* glsl */`#version 300 es\r\nin vec3 position;\r\nin vec2 uv;\r\nout vec2 vUv;\r\nvoid main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }\r\n`;\r\n\r\nsrc/water/river/flow/lbm/lbmStep.frag (collide + pull-stream)\r\n#version 300 es\r\nprecision highp float;\r\n\r\nin vec2 vUv;\r\n\r\nuniform sampler2D uF0;      // (f0,f1,f2,f3)\r\nuniform sampler2D uF1;      // (f4,f5,f6,f7)\r\nuniform sampler2D uF2;      // (f8,0,0,0)\r\nuniform sampler2D uObstacle;// R: solid 0/1\r\nuniform sampler2D uBaseVel; // RG: base vel (m/s)\r\n\r\nuniform vec2  uInvRes;\r\nuniform float uDt;\r\nuniform vec2  uDomainSizeXZ;\r\nuniform float uTau;\r\nuniform float uForceAlign;\r\nuniform float uForceObstacle;\r\n\r\nlayout(location=0) out vec4 oF0;\r\nlayout(location=1) out vec4 oF1;\r\nlayout(location=2) out vec4 oF2;\r\n\r\nconst vec2 e1 = vec2( 1.0, 0.0);\r\nconst vec2 e2 = vec2( 0.0, 1.0);\r\nconst vec2 e3 = vec2(-1.0, 0.0);\r\nconst vec2 e4 = vec2( 0.0,-1.0);\r\nconst vec2 e5 = vec2( 1.0, 1.0);\r\nconst vec2 e6 = vec2(-1.0, 1.0);\r\nconst vec2 e7 = vec2(-1.0,-1.0);\r\nconst vec2 e8 = vec2( 1.0,-1.0);\r\n\r\nfloat w0(){ return 4.0/9.0; }\r\nfloat w1(){ return 1.0/9.0; }\r\nfloat w5(){ return 1.0/36.0; }\r\n\r\nvec4 F0(vec2 uv){ return texture(uF0, uv); }\r\nvec4 F1(vec2 uv){ return texture(uF1, uv); }\r\nfloat F8(vec2 uv){ return texture(uF2, uv).r; }\r\n\r\nfloat solidAt(vec2 uv){ return texture(uObstacle, uv).r; }\r\n\r\nvec2 baseVelUv(vec2 uv){\r\n  // base vel is m/s; we use it only as a forcing direction (delta-flow model)\r\n  return texture(uBaseVel, uv).rg;\r\n}\r\n\r\nvec2 uvShift(vec2 dir){ return dir * uInvRes; }\r\n\r\n// Pull streaming: to get f_i at current cell after stream,\r\n// read f_i from neighbor at (x - e_i).\r\nvoid gatherFi(vec2 uv, out float f0,out float f1,out float f2,out float f3,out float f4,out float f5,out float f6,out float f7,out float f8){\r\n  // f0 stays\r\n  vec4 a0 = F0(uv);\r\n  vec4 b0 = F1(uv);\r\n  f0 = a0.x;\r\n\r\n  // pull from neighbors\r\n  vec2 uv1 = uv - uvShift(e1);\r\n  vec2 uv2 = uv - uvShift(e2);\r\n  vec2 uv3 = uv - uvShift(e3);\r\n  vec2 uv4 = uv - uvShift(e4);\r\n  vec2 uv5 = uv - uvShift(e5);\r\n  vec2 uv6 = uv - uvShift(e6);\r\n  vec2 uv7 = uv - uvShift(e7);\r\n  vec2 uv8 = uv - uvShift(e8);\r\n\r\n  f1 = F0(uv1).y;\r\n  f2 = F0(uv2).z;\r\n  f3 = F0(uv3).w;\r\n  f4 = F1(uv4).x;\r\n  f5 = F1(uv5).y;\r\n  f6 = F1(uv6).z;\r\n  f7 = F1(uv7).w;\r\n  f8 = F8(uv8);\r\n}\r\n\r\n// Equilibrium for direction dot(u)\r\nfloat feq(float wi, float rho, float eu, float uu){\r\n  return wi * rho * (1.0 + 3.0*eu + 4.5*eu*eu - 1.5*uu);\r\n}\r\n\r\nvoid main(){\r\n  float solid = solidAt(vUv);\r\n  if (solid > 0.5) {\r\n    // Inside solid: rest equilibrium (rho=1, u=0) — cheap stable boundary\r\n    float rho = 1.0;\r\n    oF0 = vec4(w0()*rho, w1()*rho, w1()*rho, w1()*rho);\r\n    oF1 = vec4(w1()*rho, w5()*rho, w5()*rho, w5()*rho);\r\n    oF2 = vec4(w5()*rho, 0.0,0.0,0.0);\r\n    return;\r\n  }\r\n\r\n  float f0,f1,f2,f3,f4,f5,f6,f7,f8;\r\n  gatherFi(vUv, f0,f1,f2,f3,f4,f5,f6,f7,f8);\r\n\r\n  // Macros\r\n  float rho = f0+f1+f2+f3+f4+f5+f6+f7+f8;\r\n\r\n  // Lattice velocity u (dimensionless). Keep it small (delta-flow).\r\n  vec2 u = vec2(\r\n    (f1 - f3 + f5 - f6 - f7 + f8) / max(1e-6, rho),\r\n    (f2 - f4 + f5 + f6 - f7 - f8) / max(1e-6, rho)\r\n  );\r\n\r\n  // Forcing: align delta flow weakly to base flow direction (does NOT try to match magnitude).\r\n  vec2 vb = baseVelUv(vUv);\r\n  float vbLen = max(1e-3, length(vb));\r\n  vec2 dirB = vb / vbLen;\r\n\r\n  vec2 a = uForceAlign * dirB; // small acceleration in lattice units\r\n\r\n  // Optional: obstacle forcing can be injected elsewhere; keep placeholder\r\n  // a += uForceObstacle * something;\r\n\r\n  // Semi-implicit: u' = u + a*dt_lattice (we treat dt_lattice = 1 here; scale via small force)\r\n  u = u + a;\r\n\r\n  // Clamp to keep stability (delta-flow)\r\n  float um = length(u);\r\n  if (um > 0.25) u *= (0.25 / um);\r\n\r\n  float uu = dot(u,u);\r\n  float omega = 1.0 / max(0.501, uTau); // relaxation rate, tau > 0.5\r\n\r\n  // Collide toward equilibrium\r\n  float eu1 = dot(e1,u), eu2 = dot(e2,u), eu3 = dot(e3,u), eu4 = dot(e4,u);\r\n  float eu5 = dot(e5,u), eu6 = dot(e6,u), eu7 = dot(e7,u), eu8 = dot(e8,u);\r\n\r\n  float f0e = feq(w0(), rho, 0.0, uu);\r\n  float f1e = feq(w1(), rho, eu1, uu);\r\n  float f2e = feq(w1(), rho, eu2, uu);\r\n  float f3e = feq(w1(), rho, eu3, uu);\r\n  float f4e = feq(w1(), rho, eu4, uu);\r\n  float f5e = feq(w5(), rho, eu5, uu);\r\n  float f6e = feq(w5(), rho, eu6, uu);\r\n  float f7e = feq(w5(), rho, eu7, uu);\r\n  float f8e = feq(w5(), rho, eu8, uu);\r\n\r\n  f0 = mix(f0, f0e, omega);\r\n  f1 = mix(f1, f1e, omega);\r\n  f2 = mix(f2, f2e, omega);\r\n  f3 = mix(f3, f3e, omega);\r\n  f4 = mix(f4, f4e, omega);\r\n  f5 = mix(f5, f5e, omega);\r\n  f6 = mix(f6, f6e, omega);\r\n  f7 = mix(f7, f7e, omega);\r\n  f8 = mix(f8, f8e, omega);\r\n\r\n  oF0 = vec4(f0,f1,f2,f3);\r\n  oF1 = vec4(f4,f5,f6,f7);\r\n  oF2 = vec4(f8,0.0,0.0,0.0);\r\n}\r\n\r\n\r\nNote: This is a “visual LBM delta-flow” that’s stable, bounded, and obstacle-friendly. If/when you want physically consistent forcing (Guo forcing, proper bounce-back), we can extend it—after we’re happy with visuals.\r\n\r\n4.3 Derive u_lbm and combine with base flow (no extra passes if you inline)\r\n\r\nIn your river material (or a helper pass), reconstruct u from f’s (same as above), then:\r\n\r\nvec2 vFinal = vBase + uDeltaScale * uLbm;\r\n\r\n\r\nWhere uDeltaScale is a scene knob (meters/sec). Keep it capped.\r\n\r\n4.4 Rapids → EBT bridge (reuses your top-K pipeline)\r\nsrc/water/river/rapids/RapidsSeedPass.ts (score,u,v)\r\n\r\nScore field from final flow:\r\n\r\nspeed = |vFinal|\r\n\r\nvorticity ω from finite differences in UV\r\n\r\nsolid mask blocks score\r\n\r\nrapidsSeed.frag (concept)\r\n\r\nprecision highp float;\r\nvarying vec2 vUv;\r\nuniform sampler2D uVelFinal;   // RG vel (m/s)\r\nuniform sampler2D uObstacle;   // R solid\r\nuniform vec2 uInvRes;\r\n\r\nuniform float uS0,uS1;         // speed thresholds\r\nuniform float uW0,uW1;         // vorticity thresholds\r\nuniform float uWS, uWW;        // weights\r\n\r\nvoid main(){\r\n  float solid = texture2D(uObstacle, vUv).r;\r\n  if (solid > 0.5) { gl_FragColor = vec4(0.0, vUv.x, vUv.y, 0.0); return; }\r\n\r\n  vec2 vC = texture2D(uVelFinal, vUv).rg;\r\n  float sp = length(vC);\r\n\r\n  // finite diff vorticity in UV space (good enough for scoring)\r\n  vec2 vR = texture2D(uVelFinal, vUv + vec2(uInvRes.x,0)).rg;\r\n  vec2 vL = texture2D(uVelFinal, vUv - vec2(uInvRes.x,0)).rg;\r\n  vec2 vU = texture2D(uVelFinal, vUv + vec2(0,uInvRes.y)).rg;\r\n  vec2 vD = texture2D(uVelFinal, vUv - vec2(0,uInvRes.y)).rg;\r\n\r\n  float dvzdx = 0.5*(vR.y - vL.y);\r\n  float dvxdy = 0.5*(vU.x - vD.x);\r\n  float w = dvzdx - dvxdy;\r\n\r\n  float sGate = smoothstep(uS0,uS1, sp);\r\n  float wGate = smoothstep(uW0,uW1, abs(w));\r\n\r\n  float score = (uWS*sGate + uWW*wGate) * sGate * wGate;\r\n  gl_FragColor = vec4(score, vUv.x, vUv.y, 0.0);\r\n}\r\n\r\n\r\nThen run your existing:\r\n\r\nreduce chain to 1×1 (winner)\r\n\r\nevent slot writer (write center, radius, type, dir, energy)\r\n\r\nsuppress pass (NMS) and repeat for K slots\r\n\r\nEvent slot write for river\r\n\r\nCompute:\r\n\r\ndirection = normalize(vFinal at winner uv)\r\n\r\nenergy = clamp(score,0..1)\r\n\r\ntype = classify by (speed, vorticity):\r\n\r\nhigh vorticity + high speed → “plunging-like spray” (type 2)\r\n\r\nhigh speed + moderate vorticity → sheet (type 1)\r\n\r\nlow speed + high vorticity → boil (type 4 whitecap-ish)\r\n\r\netc.\r\n\r\n4.5 River genesis init (reusing MLS init framework)\r\n\r\nAdd an init mode:\r\n\r\nINIT_POS_RAPIDS_SHEET (same ribbon geometry, anchored to river surface height if you have one; otherwise y=river plane + bias)\r\n\r\nINIT_VEL_FROM_FLOW:\r\n\r\n𝑣\r\n0\r\n=\r\n𝛼\r\n \r\n𝑣\r\n𝑓\r\n𝑙\r\n𝑜\r\n𝑤\r\n+\r\n𝛽\r\n \r\n𝑛\r\n^\r\n \r\n𝑙\r\n𝑖\r\n𝑓\r\n𝑡\r\n(\r\n𝑠\r\n𝑐\r\n𝑜\r\n𝑟\r\n𝑒\r\n)\r\n+\r\n𝛾\r\n \r\n𝑐\r\n𝑢\r\n𝑟\r\n𝑙\r\n𝑇\r\n𝑒\r\n𝑟\r\n𝑚\r\nv\r\n0\r\n\t​\r\n\r\n=αv\r\nflow\r\n\t​\r\n\r\n+β\r\nn\r\n^\r\nlift(score)+γcurlTerm\r\n\r\nWhere:\r\n\r\nv_flow from uVelFinalTex\r\n\r\nlift(score) from rapids score / vorticity\r\n\r\ncurlTerm from local vorticity sign for sideways fling\r\n\r\nNo feedback tuning until this looks like fast, flow-inherited sheet motion.\r\n\r\n5) Validation checklist\r\nVisual sweeps\r\n\r\nLBM delta-flow:\r\n\r\nObstacles create stable eddies/wakes (persistent swirl bands)\r\n\r\nSwirl direction consistent with obstacle placement\r\n\r\nRapids → EBT:\r\n\r\nMultiple event centers appear in rapids zones (top-K)\r\n\r\nEvents don’t cluster (NMS works)\r\n\r\nGenesis success (river):\r\n\r\nspawned sheets/spray inherit flow direction and speed immediately\r\n\r\nmotion starts fast; conforms to the river flow; no “lazy buoyancy start”\r\n\r\nPerf / no-stall\r\n\r\nLBM step = 1 MRT pass/tick/tile (preferred)\r\n\r\nTile caps enforced: e.g. LBM near tiles <= 2 on mid hardware\r\n\r\nZero readbacks; no per-frame allocations\r\n\r\nRegression safety\r\n\r\nToggle per tile: flowMode=baked|stable|lbm\r\n\r\nFallback to stable/baked on weak hardware\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n1) What we’re changing\r\n\r\nWe’re finalizing the River material stack so the runtime/baked flow + foam RT + detail RT produce the full look:\r\nfoam → albedo/roughness, micro-detail → normals, volume term → depth color/scattering.\r\n\r\nWe’re wiring RapidsScore → EBT → Splash/MLS so rapids events spawn sheets + spray that inherit flow direction/speed (river-genesis), with strict caps.\r\n\r\nWe’re locking the exact pass graph (no silent passes): River sim passes are unchanged; the rest is shader-side composition + event reuse.\r\n\r\n2) Why\r\n\r\nRivers/rapids are “flow-first.” Once you have:\r\n\r\nbelievable flow (baked or runtime),\r\n\r\npersistent foam that advects,\r\n\r\ncoherent micro detail (profile or wave particles),\r\nthe remaining “cinematic” lift is shading composition + physically-plausible volume color.\r\n\r\nSplash coupling must remain genesis-first: initial spawn positions conform to the surface region, and velocities inherit the flow immediately (fast, sheet-like motion). No feedback tuning until this looks right.\r\n\r\n3) Implementation steps\r\nStep A — Lock the render graph (explicit)\r\n\r\nRiver sim passes (existing):\r\n\r\nFLOW_TILE_STEP (Stable Fluids or LBM) — optional, near tiles only\r\n\r\nFOAM_ADVECT, FOAM_INJECT — 2 passes/tick/tile (throttled Hz)\r\n\r\nWP_UPDATE_A, WP_UPDATE_B, WP_SPLAT_HEIGHT — optional detail mode\r\n\r\nZero new passes for:\r\n\r\nfoam lighting response (roughness/albedo)\r\n\r\nmicro-normal\r\n\r\nscattering/absorption\r\n\r\nrapids-to-splash coupling\r\n\r\nStep B — River material shader stack\r\n\r\nInputs:\r\n\r\nVelFinalTex (RG m/s)\r\n\r\nFoamTex (R density 0..1)\r\n\r\nDetailHeightTex (R16F) OR profile sampling (no RT)\r\n\r\nDepthTex optional (R meters or 0..1 proxy)\r\n\r\nOutputs:\r\n\r\nPBR-ish: albedo/roughness/normal → single forward material\r\n\r\nRules:\r\n\r\nfoam increases roughness, increases diffuse whiteness, reduces spec sharpness\r\n\r\ndetail normal is derived from DetailHeight OR profile waves aligned to flow\r\n\r\nvolume term uses Beer–Lambert extinction + a cheap “ambient in-water” term\r\n\r\nStep C — Rapids → EBT → Splash\r\n\r\nBuild RapidsScoreTex and run top-K + NMS → write EBT slots (already implemented pattern).\r\n\r\nAdd a river genesis init mode:\r\n\r\nINIT_POS: ribbon anchored near river surface plane (or a river η texture if you add one later)\r\n\r\nINIT_VEL: inherits flow velocity + lift from rapids score + curl from vorticity sign\r\n\r\nType-conditioned shaping:\r\n\r\ntype 1 (sheet) = wide, attached, lower lift\r\n\r\ntype 2 (plume) = thicker, higher lift, more curl\r\n\r\ntype 4 (boil/whitecap-ish) = smaller, noisy, higher breakup\r\n\r\nBudgets enforce caps: events/sec, particles/event, max alive.\r\n\r\n4) Code\r\n4.1 River material: TS wiring\r\n\r\nsrc/water/river/material/RiverMaterial.ts\r\n\r\nimport * as THREE from \"three\";\r\n\r\nexport type RiverDetailMode = \"off\" | \"profile\" | \"waveParticles\";\r\n\r\nexport type RiverMaterialInputs = {\r\n  velFinalTex: THREE.Texture;   // RG = velocity m/s\r\n  foamTex: THREE.Texture;       // R = foam density\r\n  detailHeightTex?: THREE.Texture; // R16F height (waveParticles mode)\r\n  depthTex?: THREE.Texture;     // optional depth meters/proxy\r\n  domainMinXZ: THREE.Vector2;\r\n  domainSizeXZ: THREE.Vector2;\r\n  envMap?: THREE.Texture;\r\n};\r\n\r\nexport type RiverMaterialParams = {\r\n  detailMode: RiverDetailMode;\r\n\r\n  // foam response\r\n  foamAlbedo: THREE.Color;      // white-ish\r\n  waterAlbedoDeep: THREE.Color; // deep tint\r\n  waterAlbedoShallow: THREE.Color;\r\n\r\n  foamRoughnessMin: number; // e.g. 0.35\r\n  foamRoughnessMax: number; // e.g. 0.95\r\n  waterRoughness: number;   // e.g. 0.06\r\n\r\n  // volume\r\n  extinctionRGB: THREE.Vector3; // Beer-Lambert coeffs (1/m), per-channel\r\n  scatterStrength: number;      // cheap ambient-in-water gain\r\n\r\n  // micro detail\r\n  detailNormalStrength: number; // 0..2\r\n  detailHeightScaleM: number;   // converts height RT to slope\r\n  profileLambdaM: number;       // for profile mode\r\n  profileAmpM: number;\r\n};\r\n\r\nexport function makeRiverMaterial(inputs: RiverMaterialInputs, params: RiverMaterialParams) {\r\n  const mat = new THREE.ShaderMaterial({\r\n    vertexShader: VERT,\r\n    fragmentShader: FRAG,\r\n    transparent: false,\r\n    depthWrite: true,\r\n    uniforms: {\r\n      uVelFinal: { value: inputs.velFinalTex },\r\n      uFoam: { value: inputs.foamTex },\r\n      uDetailH: { value: inputs.detailHeightTex ?? inputs.foamTex }, // safe fallback\r\n      uDepth: { value: inputs.depthTex ?? inputs.foamTex },          // safe fallback\r\n      uHasDetailH: { value: inputs.detailHeightTex ? 1 : 0 },\r\n      uHasDepth: { value: inputs.depthTex ? 1 : 0 },\r\n\r\n      uDomainMin: { value: inputs.domainMinXZ.clone() },\r\n      uDomainSize: { value: inputs.domainSizeXZ.clone() },\r\n\r\n      uEnvMap: { value: inputs.envMap ?? null },\r\n      uTime: { value: 0 },\r\n\r\n      // params\r\n      uFoamAlbedo: { value: params.foamAlbedo.clone() },\r\n      uWaterDeep: { value: params.waterAlbedoDeep.clone() },\r\n      uWaterShallow: { value: params.waterAlbedoShallow.clone() },\r\n\r\n      uFoamRMin: { value: params.foamRoughnessMin },\r\n      uFoamRMax: { value: params.foamRoughnessMax },\r\n      uWaterR: { value: params.waterRoughness },\r\n\r\n      uExtinction: { value: params.extinctionRGB.clone() },\r\n      uScatterStrength: { value: params.scatterStrength },\r\n\r\n      uDetailNS: { value: params.detailNormalStrength },\r\n      uDetailHScale: { value: params.detailHeightScaleM },\r\n\r\n      uDetailMode: { value: params.detailMode === \"profile\" ? 1 : params.detailMode === \"waveParticles\" ? 2 : 0 },\r\n      uProfileLambda: { value: params.profileLambdaM },\r\n      uProfileAmp: { value: params.profileAmpM },\r\n    }\r\n  });\r\n\r\n  return {\r\n    mat,\r\n    setTime(t: number) { mat.uniforms.uTime.value = t; },\r\n    setInputs(next: Partial<RiverMaterialInputs>) {\r\n      if (next.velFinalTex) mat.uniforms.uVelFinal.value = next.velFinalTex;\r\n      if (next.foamTex) mat.uniforms.uFoam.value = next.foamTex;\r\n      if (next.detailHeightTex !== undefined) {\r\n        mat.uniforms.uDetailH.value = next.detailHeightTex ?? mat.uniforms.uFoam.value;\r\n        mat.uniforms.uHasDetailH.value = next.detailHeightTex ? 1 : 0;\r\n      }\r\n      if (next.depthTex !== undefined) {\r\n        mat.uniforms.uDepth.value = next.depthTex ?? mat.uniforms.uFoam.value;\r\n        mat.uniforms.uHasDepth.value = next.depthTex ? 1 : 0;\r\n      }\r\n      if (next.domainMinXZ) mat.uniforms.uDomainMin.value.copy(next.domainMinXZ);\r\n      if (next.domainSizeXZ) mat.uniforms.uDomainSize.value.copy(next.domainSizeXZ);\r\n    }\r\n  };\r\n}\r\n\r\nconst VERT = /* glsl */`\r\nvarying vec3 vWorldPos;\r\nvarying vec2 vUv;\r\nvoid main(){\r\n  vUv = uv;\r\n  vec4 wp = modelMatrix * vec4(position, 1.0);\r\n  vWorldPos = wp.xyz;\r\n  gl_Position = projectionMatrix * viewMatrix * wp;\r\n}\r\n`;\r\n\r\n// see below\r\nconst FRAG = /* glsl */`/* filled in RiverSurface.frag.glsl */`;\r\n\r\n4.2 River surface shader: foam→roughness, detail→normal, volume term\r\n\r\nsrc/water/river/material/RiverSurface.frag.glsl\r\n\r\nprecision highp float;\r\n\r\nvarying vec3 vWorldPos;\r\nvarying vec2 vUv;\r\n\r\nuniform sampler2D uVelFinal; // RG m/s\r\nuniform sampler2D uFoam;     // R foam\r\nuniform sampler2D uDetailH;  // R16F height (optional)\r\nuniform sampler2D uDepth;    // R depth (optional)\r\n\r\nuniform int uHasDetailH;\r\nuniform int uHasDepth;\r\n\r\nuniform vec2 uDomainMin;\r\nuniform vec2 uDomainSize;\r\n\r\nuniform float uTime;\r\n\r\nuniform vec3 uFoamAlbedo;\r\nuniform vec3 uWaterDeep;\r\nuniform vec3 uWaterShallow;\r\n\r\nuniform float uFoamRMin, uFoamRMax, uWaterR;\r\n\r\nuniform vec3 uExtinction;       // 1/m\r\nuniform float uScatterStrength; // cheap ambient volume\r\n\r\nuniform float uDetailNS;\r\nuniform float uDetailHScale;\r\n\r\nuniform int uDetailMode;  // 0 off, 1 profile, 2 waveParticles RT\r\nuniform float uProfileLambda;\r\nuniform float uProfileAmp;\r\n\r\nvec2 worldToUv(vec2 xz) { return (xz - uDomainMin) / uDomainSize; }\r\n\r\nfloat sat(float x){ return clamp(x,0.0,1.0); }\r\n\r\nfloat fresnelSchlick(float cosTheta, float F0) {\r\n  return F0 + (1.0 - F0) * pow(1.0 - cosTheta, 5.0);\r\n}\r\n\r\nvec2 flowDir(vec2 uv){\r\n  vec2 v = texture2D(uVelFinal, uv).rg;\r\n  float sp = max(1e-4, length(v));\r\n  return v / sp;\r\n}\r\n\r\nfloat sampleFoam(vec2 uv){\r\n  return sat(texture2D(uFoam, uv).r);\r\n}\r\n\r\nfloat sampleDepthM(vec2 uv){\r\n  if (uHasDepth == 0) return 2.0; // fallback constant\r\n  return max(0.0, texture2D(uDepth, uv).r);\r\n}\r\n\r\n// Profile/no-UV micro wave (coherent detail mode)\r\nfloat profileWave(vec2 worldXZ, vec2 dir, float lambda, float speed, float t){\r\n  float k = 1.0 / max(1e-3, lambda);\r\n  float phase = fract(k * dot(dir, worldXZ) - (speed * k) * t);\r\n  // replace with your profile texture lookup if you have one; this is a simple analytic stand-in:\r\n  return sin(6.2831853 * phase);\r\n}\r\n\r\nfloat detailHeight(vec2 uv, vec2 worldXZ){\r\n  if (uDetailMode == 2 && uHasDetailH == 1) {\r\n    return texture2D(uDetailH, uv).r;\r\n  }\r\n  if (uDetailMode == 1) {\r\n    vec2 dir = flowDir(uv);\r\n    vec2 v = texture2D(uVelFinal, uv).rg;\r\n    float sp = length(v);\r\n    return uProfileAmp * profileWave(worldXZ, dir, uProfileLambda, sp, uTime);\r\n  }\r\n  return 0.0;\r\n}\r\n\r\nvec3 detailNormal(vec2 uv, vec2 worldXZ){\r\n  // finite differences in UV; convert to world
