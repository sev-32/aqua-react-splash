name: THALASSA champion and semantic regression gate
on:
  push:
    branches: [feature/causal-water-ledger-r1]
    paths:
      - 'scripts/champion-audit.mjs'
      - 'docs/consolidation/CHAMPION_REGISTRY.json'
      - 'docs/consolidation/WATER_SEMANTIC_CONTRACTS.json'
      - 'docs/consolidation/WATER_SEMANTIC_CONSTITUTION.md'
      - '.github/workflows/ocean-champion-semantic-gate.yml'
      - 'src/components/SplashParticles.tsx'
      - 'src/shaders/waterShaders.ts'
      - 'src/components/PoolEnvironment.tsx'
      - 'src/hooks/useMlsMpm.ts'
      - 'src/lib/mpmConnectivity.ts'
      - 'src/ocean/render/bodiesRender.ts'
      - 'src/ocean/render/terrainRender.ts'
      - 'src/ocean/render/oceanShaders.ts'
      - 'src/ocean/engine/OceanEngine.ts'
  workflow_dispatch:
jobs:
  semantic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit historical champion bytes, causal ontology and downgrade tripwires
        run: node scripts/champion-audit.mjs
      - name: Preserve observed debts and source receipts, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thalassa-champion-source-and-semantic-audit
          path: captures/champion-audit/receipt.json
          retention-days: 30
          if-no-files-found: warn
