name: THALASSA GPU donor smoke and real render archive
on:
  push:
    branches: [feature/causal-water-ledger-r1]
    paths:
      - '.github/workflows/gpu-donor-smoke.yml'
      - 'scripts/ci-gpu-donor-smoke.mjs'
  workflow_dispatch:
jobs:
  donor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          node scripts/champion-audit.mjs
          npm run typecheck
          npm run build
      - name: Serve original byte-exact standalone donors
        run: |
          mkdir -p dist/donors
          cp docs/champions/donors/wave-to-3d/*.html dist/donors/
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/donor-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/donors/splash-mls-mpm.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/donor-preview.log
          exit 1
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture true software-browser GPU donor probes
        run: node scripts/ci-gpu-donor-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thalassa-three-standalone-gpu-donors-real-browser-captures
          path: captures/donor-gpu-smoke/
          retention-days: 14
          if-no-files-found: warn
