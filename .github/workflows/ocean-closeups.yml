name: THALASSA close-up WebGL2 renders
on:
  push:
    branches:
      - feature/causal-water-ledger-r1
    paths:
      - 'scripts/ci-ocean-closeups.mjs'
      - '.github/workflows/ocean-closeups.yml'
  workflow_dispatch:

jobs:
  render-closeups:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start built ocean engine
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/ocean-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ocean >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ocean-preview.log
          exit 1
      - name: Record 1600x900 original renderer frames
        run: node scripts/ci-ocean-closeups.mjs
      - name: Save original WebGL2 frames and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thalassa-closeup-real-renders
          path: captures/closeup-proofs/
          if-no-files-found: warn
          retention-days: 7
