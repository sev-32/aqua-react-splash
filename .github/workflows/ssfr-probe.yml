name: SSFR root-cause render probe
on:
  push:
    branches: [feature/causal-water-ledger-r1]
    paths: ['scripts/ci-ssfr-probe.mjs', '.github/workflows/ssfr-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/ocean-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ocean >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node scripts/ci-ssfr-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thalassa-ssfr-debug-probes
          path: captures/ssfr-probe/
          retention-days: 7
