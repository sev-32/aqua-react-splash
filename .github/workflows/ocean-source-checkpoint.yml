name: THALASSA source-only checkpoint
on:
  push:
    branches: [feature/causal-water-ledger-r1]
    paths:
      - '.github/workflows/ocean-source-checkpoint.yml'
      - 'src/ocean/sim/splashShaders.ts'
      - 'src/ocean/sim/SplashSystem.ts'
      - 'src/components/ocean/OceanPanel.tsx'
      - 'scripts/ci-splash-morphology-ab.mjs'
      - 'docs/consolidation/SPLASH_MORPHOLOGY_R2.md'
      - 'src/ocean/sim/splashMesh.ts'
      - 'src/ocean/__tests__/splashMesh.test.ts'
      - 'scripts/ci-splash-mesh-v3.mjs'
      - 'docs/consolidation/SPLASH_SURFACE_V3.md'
      - 'scripts/causal-ledger-capture.mjs'
      - 'scripts/ci-ocean-closeups.mjs'
      - 'scripts/ci-shore-ready.mjs'
      - 'docs/consolidation/CAUSAL_R1_EVIDENCE_R2.md'
  workflow_dispatch:
jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: THALASSA-CAUSAL-R1-CODE-DOCS
          path: |
            src/
            .github/workflows/
            scripts/
            docs/consolidation/*.md
            README.md
            package.json
            package-lock.json
            index.html
            vite.config.ts
            tsconfig.json
            tsconfig.app.json
            tsconfig.node.json
            eslint.config.js
            postcss.config.js
            tailwind.config.ts
            components.json
            !**/*.png
            !**/*.jpg
            !**/*.webp
          if-no-files-found: error
          retention-days: 7
