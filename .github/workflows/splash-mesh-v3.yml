name: THALASSA V3 explicit splash mesh proof
on:
  push:
    branches: [feature/causal-water-ledger-r1]
    paths:
      - '.github/workflows/splash-mesh-v3.yml'
      - 'src/ocean/sim/splashMesh.ts'
      - 'src/ocean/sim/splashConnectivity.ts'
      - 'src/ocean/modules/splashModule.ts'
      - 'src/ocean/__tests__/splashConnectivityFairness.test.ts'
      - 'src/ocean/sim/SplashSystem.ts'
      - 'src/ocean/sim/splashShaders.ts'
      - 'src/components/ocean/OceanPanel.tsx'
      - 'src/ocean/__tests__/splashMesh.test.ts'
      - 'scripts/ci-splash-mesh-v3.mjs'
  workflow_dispatch:
jobs:
  v3-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify interface builder and app
        run: |
          npm run typecheck
          npx vitest run src/ocean/__tests__/splashMesh.test.ts src/ocean/__tests__/splashConnectivityFairness.test.ts src/ocean/__tests__/causalLedger.test.ts src/ocean/__tests__/mpm.test.ts
          npm run build
      - name: Install headless WebGL2 Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve compiled ocean engine
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/thalassa-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ocean >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/thalassa-preview.log
          exit 1
      - name: Compare R1, V2 and explicit V3 water interfaces
        run: node scripts/ci-splash-mesh-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thalassa-v3-mesh-12-real-render-proofs
          path: captures/splash-mesh-v3/
          retention-days: 7
          if-no-files-found: warn
